   OWNER_EMAILS is only a fallback used until the Build 40 SQL has been run. */
const OWNER_EMAILS=['lslocum@onetelgem.com'];
function isOwner(u){if(!u)return false;
  if(u.ownerFlag!==undefined)return !!u.ownerFlag;
  return OWNER_EMAILS.includes((u.email||'').trim().toLowerCase());}
/* SALARY vs HOURLY (Build 40): salaried people keep every ability (and the clock-in), they're just
   off hourly payroll. Before the Build 40 SQL runs, owners are treated as salaried (the old behavior). */
function isSalaried(u){if(!u)return false; if(u.payType)return u.payType==='salary'; return isOwner(u);}
function payTypeNow(u){return isSalaried(u)?'salary':'hourly';}
/* which pay type applied to this person at a moment in time (for payroll) */
function payTypeAt(id,ts){
  const list=payChanges.filter(c=>c.empId===id).sort((a,b)=>a.at-b.at);
  const e=employees.find(x=>x.id===id);
  if(!list.length)return payTypeNow(e);
  let t=list[0].payType==='salary'?'hourly':'salary';   /* before the first recorded switch */
  for(const c of list){if(c.at<=ts)t=c.payType;else break;}
  return t;
}
function salarySince(id){const l=payChanges.filter(c=>c.empId===id&&c.payType==='salary').sort((a,b)=>b.at-a.at);return l.length?l[0].at:null;}
function ownerCount(){return employees.filter(e=>isOwner(e)&&isActive(e)).length;}
function canManage(u){return !!u&&(u.role==='manager'||u.role==='comanager'||isOwner(u));}
function clocksIn(u){return !!u&&(u.role!=='manager'||isOwner(u));}
function lastName(n){const p=(n||'').trim().split(/\s+/);return p.length>1?p[p.length-1]:(p[0]||'');}
function byLast(a,b){return lastName(a.name).localeCompare(lastName(b.name))||a.name.localeCompare(b.name);}
function isActive(e){return !!e&&e.active!==false;}
function activeAll(){return employees.filter(isActive).sort(byLast);}
function hourlyStaff(){return employees.filter(e=>(e.role==='comanager'||e.role==='employee')&&isActive(e)).sort(byLast);}
function inactiveHourly(){return employees.filter(e=>(e.role==='comanager'||e.role==='employee')&&!isActive(e)).sort(byLast);}
function hadShiftsIn(id,p){return shifts.some(s=>{const k=companyDateKey(s.clockIn);return s.empId===id&&k>=p.start&&k<=p.end;});}
/* payroll = active, currently hourly co-managers & employees (salaried people keep every other ability) */
function payrollStaff(){return hourlyStaff().filter(e=>!isSalaried(e));}
const YEAR_MS=365*DAY;
/* hours that count for pay in a period = shifts worked while the person was hourly */
function paidMs(id,p){return shifts.filter(s=>{const k=companyDateKey(s.clockIn);return s.empId===id&&k>=p.start&&k<=p.end&&payTypeAt(id,s.clockIn)==='hourly';}).reduce((t,s)=>t+netMs(s),0);}
/* when someone left hourly payroll (deactivated or switched to salary) — records stay visible 1 year after this */
function leftPayrollAt(e){
  const times=[];
  if(!isActive(e))times.push(e.deactivatedAt||Math.max(0,...shifts.filter(s=>s.empId===e.id).map(s=>s.clockOut||s.clockIn)));
  if(isSalaried(e)){const t=salarySince(e.id);if(t)times.push(t);}
  return times.length?Math.max(...times):null;
}
/* who shows on a pay period: active hourly staff, plus anyone deactivated or switched to salary who
   has hourly (paid) time inside this period — kept for 1 year after they left hourly payroll, then hidden */
function periodStaff(p){
  const active=payrollStaff();
  const past=employees.filter(e=>(e.role==='comanager'||e.role==='employee')&&!active.includes(e)&&paidMs(e.id,p)>0&&(()=>{
    const t=leftPayrollAt(e);return !t||Date.now()-t<=YEAR_MS;})());
  return [...active,...past].sort(byLast);
}
function periodMs(id,p){return shifts.filter(s=>{const k=companyDateKey(s.clockIn);return s.empId===id&&k>=p.start&&k<=p.end;}).reduce((t,s)=>t+netMs(s),0);}
function nameOf(id){const e=employees.find(x=>x.id===id);return e?e.name:'—';}
function hmToMin(hm){const [h,m]=hm.split(':').map(Number);return h*60+m;}
function slotHours(sl){const v=(hmToMin(sl.end)-hmToMin(sl.start))/60;return v>0?v:0;}
function dayHours(day){if(!Array.isArray(day)||!day.length)return 0;return day.reduce((t,sl)=>t+slotHours(sl),0);}
function weekHours(id){const s=schedules[id];if(!s)return 0;return DOW.reduce((t,k)=>t+dayHours(s[k]),0);}
function slotsForDate(id,ts){const s=schedules[id];if(!s)return [];const d=s[DOW[partsIn(ts,tzOf(id)).dow]];return Array.isArray(d)?d:[];}
function slotsOverlap(a,b){return hmToMin(a.start)<hmToMin(b.end)&&hmToMin(b.start)<hmToMin(a.end);}
function isOutsideSchedule(id,ts){const slots=slotsForDate(id,ts);if(!slots.length)return true;
  const p=partsIn(ts,tzOf(id)),m=p.h*60+p.mi;return !slots.some(sl=>m>=hmToMin(sl.start)&&m<=hmToMin(sl.end));}
function weekStartKey(){const k=todayKey();return addDaysKey(k,-keyToDate(k).getDay());}
function workedThisWeek(id){const ws=weekStartKey();
  return shifts.filter(s=>s.empId===id&&companyDateKey(s.clockIn)>=ws).reduce((t,s)=>t+netMs(s),0);}
/* ---- live Supabase state (real session only; demo bypass stays in-memory) ---- */
let liveSession=false;
function live(){return !!sb&&liveSession;}
function shiftFromRow(r){return {id:r.id,empId:r.user_id,clockIn:new Date(r.clock_in).getTime(),
  clockOut:r.clock_out?new Date(r.clock_out).getTime():null,edited:!!r.edited};}
function upsertShift(s){const i=shifts.findIndex(x=>x.id===s.id);if(i>=0)shifts[i]=s;else shifts.push(s);}
/* one compact field: accepts "9-5", "9am-5pm", "09:00-17:00", "9:30 to 6" */
function parseOne(t){
  const m=t.match(/^(\d{1,2})(?::(\d{2}))?(am|pm)?$/);
  if(!m)return null;
  let h=+m[1],mi=m[2]?+m[2]:0;const ap=m[3];
  if(h>23||mi>59)return null;
  if(ap==='pm'&&h<12)h+=12;
  if(ap==='am'&&h===12)h=0;
  return {hm:pad(h)+':'+pad(mi),explicit:!!ap};
}
function parseRange(str){
  const s=(str||'').toLowerCase().replace(/\s/g,'').replace(/[–—]/g,'-');
  const parts=s.split(/-|to/).filter(Boolean);
  if(parts.length!==2)return null;
  const a=parseOne(parts[0]),b=parseOne(parts[1]);
  if(!a||!b)return null;
  let end=b.hm;
  /* "9-5" means 9am to 5pm, not 5am */
  if(!b.explicit&&hmToMin(end)<=hmToMin(a.hm)){
    const h=+end.split(':')[0];
    if(h<12)end=pad(h+12)+':'+end.split(':')[1];
  }
  if(hmToMin(end)<=hmToMin(a.hm))return null;
  return {start:a.hm,end};
}

async function authSignUp(){

  finally{authBusyState(false);}
}

async function loadChat(){
  const [cr,mr,gr]=await Promise.all([
    sb.from('conversations').select('*'),
    sb.from('conversation_members').select('*'),
    sb.from('chat_messages').select('*').order('created_at',{ascending:true})
  ]);
  if(cr.error)throw cr.error; if(mr.error)throw mr.error; if(gr.error)throw gr.error;
  const memByConv={}, myRead={};
  (mr.data||[]).forEach(m=>{(memByConv[m.conversation_id]=memByConv[m.conversation_id]||[]).push(m.user_id);
    if(m.user_id===currentUser.id)myRead[m.conversation_id]=new Date(m.last_read_at).getTime();});
  conversations=(cr.data||[])
    .filter(c=>(memByConv[c.id]||[]).includes(currentUser.id))   /* left/deleted chats stay gone */
    .map(c=>({id:c.id,kind:c.kind,title:c.title||'',dmKey:c.dm_key||'',
      members:memByConv[c.id]||[],lastRead:myRead[c.id]||0}));
  chatMsgs={};
  (gr.data||[]).forEach(m=>appendChatMsg(m.conversation_id,{id:m.id,from:m.from_user,fromName:m.from_name,body:m.body,ts:new Date(m.created_at).getTime()}));
}
function subscribeChat(){

    .on('postgres_changes',{event:'INSERT',schema:'public',table:'chat_messages'},payload=>{

      const known=conversations.some(c=>c.id===m.conversation_id);
      appendChatMsg(m.conversation_id,{id:m.id,from:m.from_user,fromName:m.from_name,body:m.body,ts:new Date(m.created_at).getTime()});
      if(!known){ loadChat().then(()=>{ if(chatPageOpen)render(); }); return; }
      if(chatPageOpen){ if(chatOpenConv===m.conversation_id)markRead(m.conversation_id); render(); }

async function getOrCreateDMId(otherId){

  if(existing){
    const {data:mem}=await sb.from('conversation_members').select('user_id').eq('conversation_id',existing.id).eq('user_id',currentUser.id).maybeSingle();
    if(!mem)await sb.from('conversation_members').insert({conversation_id:existing.id,user_id:currentUser.id});
    return existing.id;
  }
  const {data:created,error}=await sb.from('conversations').insert({kind:'dm',dm_key:key,created_by:currentUser.id}).select().single();
  if(error){const {data:again}=await sb.from('conversations').select('*').eq('dm_key',key).maybeSingle();return again?again.id:null;}

function miniRangeCal(startK,endK){
  const [sy,sm]=startK.split('-').map(Number);
  const first=new Date(sy,sm-1,1),lead=first.getDay(),total=new Date(sy,sm,0).getDate();
  const monthName=first.toLocaleDateString('en-US',{month:'long',year:'numeric'});
  let cells='';
  ['S','M','T','W','T','F','S'].forEach(d=>cells+=`<span class="mrc-dow">${d}</span>`);
  for(let i=0;i<lead;i++)cells+='<span class="mrc-cell pad"></span>';
  for(let d=1;d<=total;d++){
    const k=sy+'-'+pad(sm)+'-'+pad(d);
    const on=k>=startK&&k<=endK;
    cells+=`<span class="mrc-cell ${on?'on':''}">${d}</span>`;
  }
  const spanNote=(startK!==endK)?`<p class="mrc-note">${fmtDayKey(startK)} → ${fmtDayKey(endK)}</p>`:`<p class="mrc-note">${fmtDayKey(startK)}</p>`;
  return `<div class="mrc"><div class="mrc-head">${monthName}</div><div class="mrc-grid">${cells}</div>${spanNote}</div>`;
}

function requestsSection(){

    ? timeOff.filter(t=>t.status&&t.empId!==undefined).filter(t=>t.status==='pending'||(t.decidedBy&&t.decidedAt))   /* incoming + recently handled */
    : myRequests();
  items=items.filter(t=>t.status==='pending'||t.end>=todayKey());   /* past, already-decided requests drop off the list */
  if(mgr){ items=[...items].sort((a,b)=>(a.status==='pending'?0:1)-(b.status==='pending'?0:1)||b.start.localeCompare(a.start)); }
  else { items=[...items].sort((a,b)=>b.start.localeCompare(a.start)); }
  if(!items.length)return '';
  const cards=items.map(t=>{
    const who=mgr?nameOf(t.empId):'You';
    const range=t.start===t.end?fmtDayKey(t.start):`${fmtDayKey(t.start)} → ${fmtDayKey(t.end)}`;

  return `<div class="rq-sec"><div class="rq-sec-lbl">${label}</div>${cards}</div>`;
}

async function enterApp(session){
  const u=session&&session.user||{};
  authProvider=((u.app_metadata&&u.app_metadata.provider)||'')+'';
  const viaGoogle=authProvider==='google'||((u.identities||[]).some(i=>i.provider==='google')&&authProvider!=='email');
  if(viaGoogle&&!companyEmail(u.email)){ try{await sb.auth.signOut();}catch(e){} renderLogin('Only @'+COMPANY_DOMAINS[0]+' Google accounts can sign in. You used '+(u.email||'another account')+'.',true); return; }
  try{ await loadProfiles(); }
  catch(e){ renderLogin('Could not load team profiles: '+(e.message||e),true); return; }
  currentUser=employees.find(x=>x.id===session.user.id);
  if(!currentUser){
    // self-heal: the trigger didn't create a profile — make one now (defaults to employee)
    try{
      const meta=session.user.user_metadata||{};
      const {error:insErr}=await sb.from('profiles').insert({
        id:session.user.id, email:(session.user.email||'').toLowerCase(), name:meta.full_name||''
      });
      if(!insErr){ await loadProfiles(); currentUser=employees.find(x=>x.id===session.user.id); }
    }catch(e){/* fall through to message below */}
  }
  if(!currentUser){ renderLogin('Signed in, but your profile could not be created. Run supabase-fix-login.sql, then sign in again.',true); await sb.auth.signOut(); return; }
  if(currentUser.active===false){ await sb.auth.signOut(); renderLogin('This account has been deactivated. Please contact your manager.'); return; }
  renderSigningIn();
  await loadPendingRoles();
  liveSession=true;
  /* everything loads at the same time (much faster than one after another) */
  const step=(fn,msg,fallback)=>Promise.resolve().then(fn).catch(e=>{ if(fallback)fallback(); if(msg)toast(msg+': '+((e&&e.message)||e)); });
  await Promise.all([
    step(loadShifts,'Could not load shifts'), step(loadSchedules,'Could not load schedules'),
    step(loadPeriods,'Could not load pay periods'), step(loadReimb,'Could not load reimbursements'),
    step(loadMessages,'Could not load messages'), step(loadWorkLogs,'Could not load work logs'),
    step(loadStrikes,'Could not load strikes'),
    step(loadPayChanges,null,()=>{payChanges=[];}), step(loadGoals,null,()=>{goals={};}),
    step(loadResources,null,()=>{resItems=[];}), step(loadPersonDetails,null,()=>{personDetails={};}),
    isOwner(currentUser)?step(loadSecurity,null,()=>{secEvents=[];}):null,
    step(loadQotw,'Could not load Questions of the Week'), step(loadSurvey,'Could not load anonymous feedback'),
    step(loadTimeOffCats,'Could not load time off types'), step(loadTimeOff,'Could not load time off'),
    step(loadPriorities,'Could not load projects'), step(loadNotices,'Could not load notices'),
    step(loadAudit,'Could not load change log'), step(loadMyState,'Could not load your widgets'),
    step(loadChat,'Could not load messages')
  ]);
  /* leader data last: the laptop benefit check needs pay periods + reimbursements loaded first */
  if(canManage(currentUser)){ try{ await loadLeaderData(); }catch(e){ /* Build 42 tables */ } }
  subscribeShifts();
  subscribePayroll();
  subscribeMisc();
  subscribeChat();
  selectedEmpId=null; openDay=null; menuOpen=false; logReminder=false; activeTab='home';
  document.getElementById('login').classList.add('hide');
  document.getElementById('app').classList.remove('hide');
  paintTopAvatar();
  document.getElementById('tbName').textContent=currentUser.name;
  render();
  checkTimezone();
}
/* "Signing you in…" screen — shown while Google hands back the session and the team data loads,
   so the sign-in button isn't sitting there inviting a second click. */
function renderSigningIn(){
  const el=document.getElementById('acctList'); if(!el)return;
  el.innerHTML=`<div class="auth-wait"><span class="auth-spin" aria-hidden="true"></span><b>Signing you in…</b><span>Loading your timecard</span></div>`;
}
function hasStoredSession(){try{return Object.keys(sessionStorage).some(k=>/^sb-.*-auth-token$/.test(k));}catch(e){return false;}}
async function initAuth(){
  const qs=new URLSearchParams(location.search+'&'+location.hash.replace(/^#/,''));
  const oauthErr=qs.get('error_description');
  const returning=!oauthErr&&(qs.has('code')||location.hash.includes('access_token')||hasStoredSession());
  if(returning&&sb)renderSigningIn();
  else renderLogin(oauthErr?('Google sign-in didn\'t finish: '+oauthErr):undefined,!!oauthErr);
  if(!sb)return;
  const slow=setTimeout(()=>{ if(!currentUser)renderLogin('Signing in is taking longer than usual — check your connection, then try again.',true); },25000);
  try{
    const {data:{session}}=await sb.auth.getSession();
    if(location.search.includes('code=')||location.hash.includes('access_token')||oauthErr)history.replaceState(null,'',location.pathname);   /* tidy the address bar after Google */
    if(session){
      if(idleTooLong()&&!qs.has('code')){ try{await sb.auth.signOut();}catch(e){} renderLogin('Signed out after a period of inactivity — please sign in again.'); }
      else{ markActive(); await enterApp(session); }
    }else if(returning){
      renderLogin(qs.has('code')?'Google sign-in didn\'t finish — please try again.':undefined,qs.has('code'));
    }
  }catch(e){ console.error('[OTG] sign-in failed',e); renderLogin('Couldn\'t finish signing in: '+((e&&e.message)||'unknown error')+'. Please try again.',true); }
  finally{ clearTimeout(slow); }
}

  let hue=Math.atan2(dx,-dy)*180/Math.PI; if(hue<0)hue+=360;
  const sat=Math.round(dist*100), light=Math.round(100-dist*50);

function sendNotification(){
  const u=currentUser, err=document.getElementById('ntErr');
  const subject=(document.getElementById('ntSubj').value||'').trim();
  const text=(document.getElementById('ntMsg').value||'').trim();
  if(!text){err.textContent='Write a message.';return;}
  let recips=[];
  const toSel=document.getElementById('ntTo');
  const isAll=toSel&&toSel.value==='all';
  if(isAll){ recips=activeAll().filter(e=>e.id!==u.id); }
  else{
    const nm=(document.getElementById('ntWho').value||'').trim().toLowerCase();
    let who=activeAll().find(e=>e.id!==u.id&&e.name.toLowerCase()===nm);
    if(u.role==='employee'&&who&&!(who.role==='manager'||who.role==='comanager'||who.role==='owner'))who=null;
    if(!who){err.textContent=u.role==='employee'?'Pick a manager or co-manager.':'Pick a valid name from your team.';return;}
    recips=[who];
  }
  if(live()){
    const rows=recips.map(r=>({to_user:r.id,from_user:u.id,from_name:u.name,subject:subject||null,body:text}));
    sb.from('messages').insert(rows).select().then(({data,error})=>{
      if(error){toast('Message not sent: '+error.message);return;}
      (data||[]).forEach(r=>{ if(!messages.some(m=>m.id===r.id)) messages.push(msgFromRow(r)); });
    });
  }else{
    recips.forEach(r=>messages.push({id:'nt'+(++msgSeq),to:r.id,from:u.name,subject,text,ts:Date.now(),read:false}));
  }

/* ================= HOME / WIDGETS ================= */
const WIDGETS=[
  {key:'clock',label:'Clock in / out',clockOnly:true},
  {key:'break',label:'Break',clockOnly:true},
  {key:'priorities',label:'Projects'},
  {key:'calendar',label:'Calendar'},
  {key:'notifications',label:'Notifications'},
  {key:'time',label:'Time'},
  {key:'todos',label:'To-do list'},
  {key:'strikes',label:'Strikes'},
  {key:'timeoff',label:'Time off'},
];
function defaultWidgets(u){return u.role==='manager'?['time','priorities','notifications']:['clock','break','time','priorities'];}
function userWidgets(u){if(!homeWidgets[u.id])homeWidgets[u.id]=defaultWidgets(u).slice();
  const arr=homeWidgets[u.id]; const i=arr.indexOf('reminders'); if(i>=0)arr.splice(i,1);
  return arr;}
function userStore(u){if(!widgetStore[u.id])widgetStore[u.id]={reminders:[],todos:[]};return widgetStore[u.id];}
function availableWidgets(u){return WIDGETS.filter(w=>!w.clockOnly||clocksIn(u));}
const GRID_COLS=4, GRID_MAXR=40; /* 4 columns wide; board grows down */
const WDIM={time:{w:4,h:1},clock:{w:2,h:2},break:{w:1,h:1},priorities:{w:1,h:2},notifications:{w:2,h:1},calendar:{w:2,h:2},todos:{w:2,h:2},strikes:{w:1,h:1},timeoff:{w:2,h:1}};
let homeSize={};   /* userId -> { widgetKey: {w,h} } chosen sizes */
function dimOf(k){const s=(homeSize[currentUser.id]||{})[k];return s||WDIM[k]||{w:2,h:1};}
function posMap(u){if(!homePos[u.id])homePos[u.id]={};return homePos[u.id];}
/* build occupancy grid from placed widgets, optionally excluding one key */
function occGrid(u,exclude){
  const pm=posMap(u),keys=userWidgets(u),g=Array.from({length:GRID_MAXR+1},()=>Array(GRID_COLS+1).fill(null));
  keys.forEach(k=>{if(k===exclude)return;const p=pm[k];if(!p)return;const d=dimOf(k);
    for(let r=p.r;r<p.r+d.h;r++)for(let c=p.c;c<p.c+d.w;c++)if(r>=1&&r<=GRID_MAXR&&c>=1&&c<=GRID_COLS)g[r][c]=k;});
  return g;
}
function fits(g,r,c,d){
  if(r<1||c<1||r+d.h-1>GRID_MAXR||c+d.w-1>GRID_COLS)return false;
  for(let rr=r;rr<r+d.h;rr++)for(let cc=c;cc<c+d.w;cc++)if(g[rr][cc])return false;
  return true;
}
function firstFree(u,k,exclude){
  const g=occGrid(u,exclude),d=dimOf(k);
  for(let r=1;r<=GRID_MAXR;r++)for(let c=1;c<=GRID_COLS;c++)if(fits(g,r,c,d))return {r,c};
  return null;
}
/* make sure every present widget has a position (largest first so defaults pack cleanly) */
function ensurePositions(u){
  const pm=posMap(u);
  const missing=userWidgets(u).filter(k=>!pm[k]);
  missing.sort((a,b)=>{const da=dimOf(a),db=dimOf(b);return (db.w*db.h)-(da.w*da.h);});
  missing.forEach(k=>{const spot=firstFree(u,k,k);if(spot)pm[k]=spot;});
}
function homeTab(){
  const u=currentUser;
  ensurePositions(u);
  const pm=posMap(u),keys=userWidgets(u);
  const cards=keys.map(k=>widgetCard(k)).join('');
  // drop-zones for free placement (active while dragging) — grow with the board
  let rowsUsed=1; keys.forEach(k=>{const p=pm[k];if(p)rowsUsed=Math.max(rowsUsed,p.r+dimOf(k).h-1);});
  const dropRows=Math.max(rowsUsed+1,4);
  let cells='';
  for(let r=1;r<=dropRows;r++)for(let c=1;c<=GRID_COLS;c++)
    cells+=`<div class="home-cell" style="--r:${r};--c:${c}" ondragover="wDragOver(event)" ondrop="wCellDrop(event,${r},${c})"></div>`;
  const board=keys.length?`<div class="widget-grid" id="homeGrid">${cells}${cards}</div>`
    :'<div class="home-empty">No widgets yet. Use “Add widget” to build your hub.</div>';
  return `<div class="home">
      <div class="home-top">
        <div><h1 class="home-h1">Dashboard</h1><p class="home-hi">Hi, ${esc(u.name.split(' ')[0])}</p></div>
        <button class="btn btn-primary btn-sm" onclick="openWidgetCatalog()">Add widget</button>
      </div>${board}</div>`;
}
function widgetCard(k){
  const w=WIDGETS.find(x=>x.key===k);if(!w)return '';
  if(w.clockOnly&&!clocksIn(currentUser))return '';
  const p=posMap(currentUser)[k];if(!p)return '';const d=dimOf(k);
  return `<div class="widget" style="--r:${p.r};--c:${p.c};--w:${d.w};--h:${d.h}" data-key="${k}">
      <div class="widget-head" draggable="true" ondragstart="wDragStart(event,'${k}')" ondragend="wDragEnd(event)">
        <span class="widget-title">${k==='time'?'':w.label}</span>
        <span class="widget-tools">
          <button class="widget-size" draggable="false" onclick="openSizePicker('${k}')" title="Resize">⤢</button>
          <button class="widget-x" draggable="false" onclick="removeWidget('${k}')" title="Remove widget">&times;</button></span></div>
      <div class="widget-body">${widgetBody(k)}</div></div>`;
}
let dragKey=null;
function wDragStart(ev,key){dragKey=key;
  try{ev.dataTransfer.effectAllowed='move';ev.dataTransfer.setData('text/plain',key);}catch(e){}
  const g=document.getElementById('homeGrid');if(g)g.classList.add('dragging');
  const card=ev.target.closest('.widget');if(card)setTimeout(()=>card.classList.add('drag-src'),0);}
function wDragOver(ev){if(dragKey===null)return;ev.preventDefault();try{ev.dataTransfer.dropEffect='move';}catch(e){}}
function wCellDrop(ev,r,c){_wCellDrop(ev,r,c);saveMyState();}
function _wCellDrop(ev,r,c){
  ev.preventDefault();ev.stopPropagation();
  if(dragKey===null){cleanupDrag();return;}
  const u=currentUser,pm=posMap(u),d=dimOf(dragKey);
  // clamp target so the widget stays fully on the board
  let tr=Math.min(Math.max(1,r),GRID_MAXR-d.h+1),tc=Math.min(Math.max(1,c),GRID_COLS-d.w+1);
  const old=pm[dragKey];
  // which other widgets overlap the target footprint?
  const g=occGrid(u,dragKey),hit=new Set();
  for(let rr=tr;rr<tr+d.h;rr++)for(let cc=tc;cc<tc+d.w;cc++)if(g[rr][cc])hit.add(g[rr][cc]);
  if(hit.size===0){ pm[dragKey]={r:tr,c:tc}; dragKey=null; render(); return; }   // drop into empty space
  if(hit.size===1 && old){ // swap with the single occupant
    const other=[...hit][0],od=dimOf(other),op=pm[other];
    // tentative: dragged -> other's spot; other -> dragged's old spot
    const g2=Array.from({length:GRID_MAXR+1},()=>Array(GRID_COLS+1).fill(null));
    const place=(k,r0,c0,dd)=>{for(let rr=r0;rr<r0+dd.h;rr++)for(let cc=c0;cc<c0+dd.w;cc++){if(rr<1||cc<1||rr>GRID_MAXR||cc>GRID_COLS||g2[rr][cc])return false;g2[rr][cc]=k;}return true;};
    // place every other widget except dragged & other, then try the swap
    let ok=true;
    userWidgets(u).forEach(k=>{if(k===dragKey||k===other)return;const pp=pm[k];if(pp&&ok)ok=place(k,pp.r,pp.c,dimOf(k));});
    if(ok && place(dragKey,op.r,op.c,d) && place(other,old.r,old.c,od)){
      pm[dragKey]={r:op.r,c:op.c}; pm[other]={r:old.r,c:old.c}; dragKey=null; render(); return;
    }
  }
  toast('Doesn\'t fit there'); cleanupDrag();
}
function wDragEnd(){cleanupDrag();}
function cleanupDrag(){dragKey=null;
  document.querySelectorAll('.widget-grid.dragging').forEach(g=>g.classList.remove('dragging'));
  document.querySelectorAll('.widget.drag-src').forEach(w=>w.classList.remove('drag-src'));}
function widgetBody(k){
  const u=currentUser;

      return `<div class="w-line">${badge}${name}${meta}</div>`;
    }).join('');
  }
  if(k==='calendar'){

    const lead=new Date(y,m-1,1).getDay(),total=new Date(y,m,0).getDate(),todayK=dateKey(now);

      <div class="mc-grid">${['S','M','T','W','T','F','S'].map(x=>`<span class="mc-dow">${x}</span>`).join('')}${cells}</div></div>`;
  }

    let rest='';

    return rows+`<div class="w-add"><input type="text" id="wTodo" placeholder="Add a to-do" onkeydown="if(event.key==='Enter')addTodo()"><button class="btn btn-dark btn-sm" onclick="addTodo()">Add</button></div>`;
  }
  return '';
}
function addWidget(k){const arr=userWidgets(currentUser);

const SIZE_PRESETS=[{w:1,h:1,label:'Small'},{w:2,h:1,label:'Wide'},{w:1,h:2,label:'Tall'},{w:2,h:2,label:'Medium'},{w:4,h:1,label:'Full width'},{w:4,h:2,label:'Large'}];

/* ---------- work log (one running paragraph per day; add to it any time) ---------- */
function logText(empId,dk){const l=workLogs[empId+'|'+dk];return l&&l.text?l.text:'';}
function logPanel(empId,dk,editable){
  const text=logText(empId,dk);
  if(!editable){
    return text.trim()
      ? `<div class="log-para">${esc(text).replace(/\n/g,'<br>')}</div>`
      : '<div class="empty">Nothing logged for this day.</div>';
  }
  return `<div class="log-edit">
      <div class="field"><label>Work log <span class="opt">one running note — add to it any time</span></label>
        <textarea class="log-area" id="tx_${dk}" rows="4" placeholder="What did you work on? You can keep adding to this today or later."
          oninput="logInput('${empId}','${dk}',this)" onblur="saveLogBlur('${empId}','${dk}')">${esc(text)}</textarea></div>
      <div class="log-actions"><button class="btn btn-dark btn-sm" onclick="saveLog('${empId}','${dk}')">Save log</button></div>
    </div>`;
}
function logInput(empId,dk,el){const k=empId+'|'+dk;if(!workLogs[k])workLogs[k]={text:'',saved:'',ids:[]};workLogs[k].text=el.value;}
async function saveLogText(empId,dk,v){
  const k=empId+'|'+dk, prev=workLogs[k]||{text:'',saved:'',ids:[]};
  v=(v||'').trim();
  if(live()){
    if(v===''){
      if(prev.ids&&prev.ids.length){const {error}=await sb.from('work_logs').delete().in('id',prev.ids);if(error){toast('Log not saved: '+error.message);return false;}}
      workLogs[k]={text:'',saved:'',ids:[]};
    }else if(prev.ids&&prev.ids.length){
      /* one row per day: update the first, drop any legacy extras */
      const keep=prev.ids[0], extra=prev.ids.slice(1);
      const {error}=await sb.from('work_logs').update({text:v}).eq('id',keep);
      if(error){toast('Log not saved: '+error.message);return false;}
      if(extra.length)await sb.from('work_logs').delete().in('id',extra);
      workLogs[k]={text:v,saved:v,ids:[keep]};
    }else{
      const {data,error}=await sb.from('work_logs').insert({user_id:empId,day:dk,text:v}).select().single();
      if(error){toast('Log not saved: '+error.message);return false;}
      workLogs[k]={text:v,saved:v,ids:[data.id]};
    }
  }else{
    workLogs[k]={text:v,saved:v,ids:(prev.ids&&prev.ids.length)?prev.ids:(v?[Date.now()]:[])};
  }
  return true;
}
async function saveLog(empId,dk){
  const el=document.getElementById('tx_'+dk);if(!el)return;
  const ok=await saveLogText(empId,dk,el.value);
  if(ok){logReminder=false;openDay=empId+'|'+dk;render();toast('Work log saved');}
}
async function saveLogBlur(empId,dk){
  const el=document.getElementById('tx_'+dk);if(!el)return;
  const k=empId+'|'+dk, saved=(workLogs[k]&&workLogs[k].saved)||'';
  if(el.value.trim()===saved.trim())return;   /* nothing new to store */
  const ok=await saveLogText(empId,dk,el.value);
  if(ok){logReminder=false;openDay=k;render();}
}

/* ---------- day accordion (one row per calendar day; expand for each shift + the log) ---------- */
function toggleDay(k){openDay=(openDay===k)?null:k;render();}
function shiftsByDay(empId){
  const map={};
  shifts.filter(s=>s.empId===empId).forEach(s=>{const dk=companyDateKey(s.clockIn);(map[dk]=map[dk]||[]).push(s);});
  Object.values(map).forEach(arr=>arr.sort((a,b)=>a.clockIn-b.clockIn));
  return map;
}
function dayList(empId,{logEditable=false,editTimes=false}={}){
  const map=shiftsByDay(empId);
  const dks=Object.keys(map).sort((a,b)=>b.localeCompare(a));   /* newest day first */
  if(!dks.length)return '<div class="empty">No days recorded yet.</div>';
  const pencil=`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>`;
  const rows=dks.map(dk=>{
    const day=map[dk], ek=empId+'|'+dk, isOpen=openDay===ek;
    const totalMs=day.reduce((t,s)=>t+netMs(s),0);
    const firstIn=day[0].clockIn;
    const anyActive=day.some(s=>s.clockOut===null);
    const lastOut=anyActive?null:Math.max.apply(null,day.map(s=>s.clockOut));
    const edited=day.some(s=>s.edited);
    const outCell=anyActive?'<span class="st on"><i></i>active</span>':fmtTimeFor(empId,lastOut);
    const multi=day.length>1?`<span class="shift-count">${day.length} shifts</span>`:'';
    const rowEdit=editTimes
      ? (day.length===1
          ? `<button class="day-edit" title="Edit clock-in / clock-out" onclick="event.stopPropagation();openEditDay('${day[0].id}')">${pencil}</button>`
          : `<button class="day-edit" title="Open this day to edit each shift" onclick="event.stopPropagation();openDay='${ek}';render()">${pencil}</button>`)
      : '';
    let html=`<tr class="day-row" onclick="toggleDay('${ek}')">
      <td><span class="day-cell"><span class="caret ${isOpen?'open':''}">&rsaquo;</span>${fmtCoDay(dk)}${edited?'<span class="edited">edited</span>':''}${multi}${rowEdit}</span></td>
      <td class="num">${fmtTimeFor(empId,firstIn)}</td><td class="num">${outCell}</td><td class="num">${fmtDur(totalMs)}</td></tr>`;
    if(isOpen){
      const shiftRows=day.map(s=>{
        const out=s.clockOut?fmtTimeFor(empId,s.clockOut):'<span class="st on"><i></i>active</span>';
        const edit=editTimes?`<button class="day-edit" title="Edit clock-in / clock-out" onclick="event.stopPropagation();openEditDay('${s.id}')">${pencil}</button>`:'';
        return `<li class="shift-line"><span class="shift-times">${fmtTimeFor(empId,s.clockIn)} &ndash; ${out}</span><span class="shift-dur mono">${fmtDur(netMs(s))}</span>${edit}</li>`;
      }).join('');
      const shiftBlock=`<div class="shift-block"><div class="shift-block-h">Clock in / out${day.length>1?' &middot; '+day.length+' shifts':''}</div><ul class="shift-list">${shiftRows}</ul></div>`;
      html+=`<tr class="expand"><td colspan="4"><div class="expand-in">${shiftBlock}${logPanel(empId,dk,logEditable)}</div></td></tr>`;
    }
    return html;
  }).join('');
  return `<table><thead><tr><th>Day</th><th class="num">In</th><th class="num">Out</th><th class="num">Hours</th></tr></thead><tbody>${rows}</tbody></table>`;
}

/* ================= CALENDAR ================= */
function shiftMonth(n){
  const [y,m]=calCursor.split('-').map(Number);
  const d=new Date(y,m-1+n,1);calCursor=d.getFullYear()+'-'+pad(d.getMonth()+1);render();
}
function thisMonth(){const d=new Date(now);calCursor=d.getFullYear()+'-'+pad(d.getMonth()+1);render();}
function offFor(k,scopeId){
  return timeOff.filter(t=>{
    if(t.status!=='approved')return false;                 // only approved on the calendar
    if(!(k>=t.start&&k<=t.end))return false;
    if(canManage(currentUser))return true;                 // managers see everyone
    return t.empId===currentUser.id||isManagerId(t.empId); // employees: own + managers'
  });
}
function priFor(k){return priorities.filter(p=>p.due===k);}

function calendarGrid(scopeId){
  const [y,m]=calCursor.split('-').map(Number);
  const first=new Date(y,m-1,1),lead=first.getDay(),total=new Date(y,m,0).getDate();
  const todayK=dateKey(now);
  let cells='';
  for(let i=0;i<lead;i++)cells+='<div class="cell pad"></div>';
  for(let d=1;d<=total;d++){
    const k=y+'-'+pad(m)+'-'+pad(d);
    const offs=offFor(k,scopeId).map(t=>`<span class="ev off" onclick="event.stopPropagation();openRequestDetail('${t.id}')">${esc(t.empId===currentUser.id?t.note:nameOf(t.empId).split(' ')[0]+' · '+t.note)}</span>`).join('');
    const pris=priFor(k).map(p=>`<span class="ev pri ${p.done?'done':''}" onclick="event.stopPropagation();openProjectDetail('${p.id}')">${esc(p.title)}</span>`).join('');
    const clickable=canManage(currentUser);
    cells+=`<${clickable?'button':'div'} class="cell ${k===todayK?'today':''}" ${clickable?`onclick="openDayAdd('${k}')"`:''}>
      <span class="dnum">${d}</span>${offs}${pris}</${clickable?'button':'div'}>`;
  }
  const label=new Date(y,m-1,1).toLocaleDateString(undefined,{month:'long',year:'numeric'});
  return `<div class="cal-head">
      <span class="cal-title">${label}</span>
      <button class="btn-cell" onclick="shiftMonth(-1)">&lsaquo;</button>
      <button class="btn-cell" onclick="thisMonth()">Today</button>
      <button class="btn-cell" onclick="shiftMonth(1)">&rsaquo;</button>
      ${canManage(currentUser)?'<span class="pri-meta" style="margin-left:auto">Select a day to add time off or a project</span>':''}
    </div>
    <div class="cal-grid">${['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(d=>`<div class="dow">${d}</div>`).join('')}${cells}</div>`;
}

    const pstyle=pset&&p.pcolor?`style="background:${p.pcolor};color:${priContrast(p.pcolor)};border-color:${p.pcolor}"`:'';
    const pbadge=editable
      ? `<button class="pri-p ${pset?'set':''}" draggable="false" onclick="openPriPriority('${p.id}')" title="Set priority" ${pstyle}>${pset?`<span class="pn">${priBadgeText(p.pnum)}</span>`:`P<span class="pbox"></span>`}</button>`
      : (pset?`<span class="pri-p set" ${pstyle}><span class="pn">${priBadgeText(p.pnum)}</span></span>`:'');

    const dueCtrl=editable
      ? `<span class="pri-due-wrap">${hasDue?`<span class="pri-duev ${p.due<todayK?'over':''}">${p.due<todayK?'Overdue · '+fmtDayKey(p.due):fmtDayKey(p.due)}</span>`:''}<button class="pri-due-toggle ${dueOpen?'open':''}" draggable="false" onclick="togglePriDue('${p.id}')" title="${hasDue?'Change due date':'Add due date'}"><i class="chev"></i></button>${dueOpen?`<input type="date" class="pri-due-in" value="${p.due||''}" draggable="false" onchange="setPriDue('${p.id}',this.value)">`:''}</span>`
      : (hasDue?`<span class="pri-duev ${p.due<todayK?'over':''}">${p.due<todayK?'Overdue · '+fmtDayKey(p.due):'Due '+fmtDayKey(p.due)}</span>`:'');
    const line2=(pbadge||dueCtrl)?`<div class="pri-line2">${pbadge}${dueCtrl}</div>`:'';
    const drag=editable?`draggable="true" ondragstart="priDragStart(event,'${p.id}')" ondragover="priDragOver(event)" ondrop="priDrop(event,'${p.id}')" ondragend="priDragEnd(event)"`:'';
    return `<div class="pri-row ${editable?'pri-drag':''}" ${drag}>
      <div class="pri-main"><div class="pri-line1">${name}</div>${line2}</div>
      ${editable?`<button class="pri-link" draggable="false" onclick="openPriRename('${p.id}')" title="Edit title"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg></button>
      <button class="pri-link ${p.link?'on':''}" draggable="false" onclick="openPriLink('${p.id}')" title="${p.link?'Edit spreadsheet link':'Add spreadsheet link'}">${sheetIcon()}</button>
      <button class="pri-x" draggable="false" onclick="removePri('${p.id}')" title="Remove">&times;</button>`:''}</div>`;
  }).join(''):'<div class="empty">No projects.</div>';
  const add=editable?(priAddOpen?`<div class="pri-add">
      <div class="field"><label>New project</label><input type="text" id="priTitle" placeholder="Quarterly inventory count"></div>
      <div class="field"><label>Spreadsheet link <span class="opt">optional</span></label><input type="text" id="priLink" placeholder="Paste a Google Sheets link"></div>
      <div class="field"><label>Due <span class="opt">optional</span></label><input type="date" id="priDue"></div>
      <div class="pri-add-actions"><button class="btn btn-line btn-sm" onclick="priAddOpen=false;render()">Cancel</button><button class="btn btn-primary btn-sm" onclick="addPri()">Add project</button></div>
      <div class="err" id="priErr"></div></div>`
    :`<div class="pri-add collapsed"><button class="btn btn-primary btn-sm pri-add-btn" onclick="openPriAdd()">Add project</button></div>`):'';
  return rows+add;
}
function togglePri(id){const p=priorities.find(x=>x.id===id);if(!p)return;p.done=!p.done;render();
  if(live())sb.from('priorities').update({done:p.done}).eq('id',id).then(({error})=>{ if(error)toast('Not saved: '+error.message); });}
function removePri(id){priorities=priorities.filter(p=>p.id!==id);render();
  if(live())sb.from('priorities').delete().eq('id',id).then(({error})=>{ if(error)toast('Not removed: '+error.message); });}
let priDragId=null;
function priDragStart(ev,id){priDragId=id;try{ev.dataTransfer.effectAllowed='move';ev.dataTransfer.setData('text/plain',id);}catch(e){}
  const row=ev.target.closest('.pri-row');if(row)setTimeout(()=>row.classList.add('pri-dragging'),0);}
function priDragOver(ev){if(priDragId===null)return;ev.preventDefault();try{ev.dataTransfer.dropEffect='move';}catch(e){}
  const row=ev.currentTarget;document.querySelectorAll('.pri-row.pri-over').forEach(r=>{if(r!==row)r.classList.remove('pri-over');});row.classList.add('pri-over');}
function priDrop(ev,targetId){ev.preventDefault();ev.stopPropagation();if(priDragId===null){priDragCleanup();return;}
  const from=priorities.findIndex(p=>p.id===priDragId),to=priorities.findIndex(p=>p.id===targetId);
  if(from<0||to<0||from===to){priDragCleanup();render();return;}
  const item=priorities.splice(from,1)[0];priorities.splice(to,0,item);priDragId=null;render();
  if(live())priorities.forEach((p,i)=>{ p.pos=i;
    sb.from('priorities').update({pos:i}).eq('id',p.id).then(({error})=>{ if(error)toast('Order not saved: '+error.message); }); });}
function priDragEnd(){priDragCleanup();}
let priDueOpen=null, priPickColor='', priAddOpen=false, recentColors=[];
function rememberColor(c){
  if(!c)return;
  recentColors=[c,...recentColors.filter(x=>x!==c)].slice(0,5);
  saveMyState();
}
function pickRecent(c){
  priPickColor=c;
  const prev=document.getElementById('priPrev');
  if(prev){prev.style.background=c;prev.style.borderColor=c;prev.style.color=priContrast(c);}
}
function openPriAdd(){priAddOpen=true;render();setTimeout(()=>{const el=document.getElementById('priTitle');if(el)el.focus();},0);}
function priContrast(color){
  if(!color)return '#fff';
  let l=null;
  const h=color.match(/hsl\(\s*[\d.]+\s*,\s*[\d.]+%\s*,\s*([\d.]+)%/i);
  if(h)l=parseFloat(h[1]);
  else if(color[0]==='#'){let c=color.slice(1);if(c.length===3)c=c.split('').map(x=>x+x).join('');
    const r=parseInt(c.slice(0,2),16),g=parseInt(c.slice(2,4),16),b=parseInt(c.slice(4,6),16);
    l=(0.2126*r+0.7152*g+0.0722*b)/2.55;}
  if(l==null)return '#fff';
  return l>=62?'#111':'#fff';
}
function togglePriDue(id){priDueOpen=(priDueOpen===id?null:id);render();
  if(priDueOpen===id)setTimeout(()=>{const el=document.querySelector('.pri-due-in');if(el)el.focus();},0);}
function setPriDue(id,val){const p=priorities.find(x=>x.id===id);if(!p)return;p.due=val||'';priDueOpen=null;render();
  if(live())sb.from('priorities').update({due:val||null}).eq('id',id).then(({error})=>{ if(error)toast('Due date not saved: '+error.message); });}
function openProjectDetail(id){

function priBadgeText(v){return /^\d+$/.test(String(v))?'P'+v:esc(String(v));}

        <div class="pri-recent">
          <span class="pri-recent-lbl">Recently used</span>
          ${recentColors.length
            ? `<div class="pri-recent-swatches">${recentColors.map(c=>`<button class="pri-recent-sw" title="${c}" style="background:${c}" onclick="pickRecent('${c}')"></button>`).join('')}</div>`
            : `<span class="pri-recent-none">None yet</span>`}
        </div>

    <div class="err" id="priPErr"></div>
    <div class="modal-actions">
      ${p.pnum!=null?`<button class="btn btn-line btn-sm" onclick="savePriPriority('${id}',true)">Clear</button>`:''}
      <button class="btn btn-line btn-sm" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary btn-sm" onclick="savePriPriority('${id}')">Save</button></div></div></div>`;
  const nIn=document.getElementById('priNumIn');
  if(nIn)nIn.addEventListener('input',()=>{const v=nIn.value.trim();document.getElementById('priPrevN').innerHTML=v?priBadgeText(v):'P1';});
}
function priWheelPick(ev){
  const w=document.getElementById('priWheel'), r=w.getBoundingClientRect();
  const cx=r.width/2, cy=r.height/2, dx=ev.clientX-r.left-cx, dy=ev.clientY-r.top-cy;
  const R=Math.min(cx,cy), dist=Math.min(Math.sqrt(dx*dx+dy*dy)/R,1);
  let hue=Math.atan2(dx,-dy)*180/Math.PI; if(hue<0)hue+=360;
  const sat=Math.round(dist*100), light=Math.round(100-dist*50);
  priPickColor=`hsl(${Math.round(hue)},${sat}%,${light}%)`;
  const prev=document.getElementById('priPrev');
  if(prev){prev.style.background=priPickColor;prev.style.borderColor=priPickColor;prev.style.color=priContrast(priPickColor);}
}
function savePriPriority(id,clear){
  const p=priorities.find(x=>x.id===id);if(!p)return;
  if(clear){p.pnum=null;p.pcolor='';closeModal();render();
    if(live())sb.from('priorities').update({pnum:null,pcolor:null}).eq('id',id).then(({error})=>{ if(error)toast('Not saved: '+error.message); });
    return;}
  const raw=(document.getElementById('priNumIn').value||'').trim();
  if(!raw){document.getElementById('priPErr').textContent='Enter a number or a word.';return;}
  p.pnum=raw;p.pcolor=priPickColor||'';rememberColor(p.pcolor);closeModal();render();
  if(live())sb.from('priorities').update({pnum:raw,pcolor:p.pcolor||null}).eq('id',id).then(({error})=>{ if(error)toast('Priority not saved: '+error.message); });
}
function priDragCleanup(){priDragId=null;
  document.querySelectorAll('.pri-row.pri-dragging').forEach(r=>r.classList.remove('pri-dragging'));
  document.querySelectorAll('.pri-row.pri-over').forEach(r=>r.classList.remove('pri-over'));}
function addPri(){
  const t=document.getElementById('priTitle').value.trim(),d=document.getElementById('priDue').value;
  if(!t){document.getElementById('priErr').textContent='Give the project a title.';return;}
  const link=normLink(document.getElementById('priLink').value);
  if(live()){
    sb.from('priorities').insert({title:t,due:d||null,done:false,link,pos:priorities.length,added_by:currentUser.name}).select().single().then(({data,error})=>{
      if(error){toast('Project not saved: '+error.message);return;}
      if(!priorities.some(p=>p.id===data.id)){priorities.push(priFromRow(data));render();}
    });
  }else{
    priorities.push({id:'pr'+Date.now(),title:t,due:d,done:false,link,addedBy:currentUser.name});
  }
  priAddOpen=false;
  render();
}
function normLink(v){v=(v||'').trim();if(!v)return '';if(!/^https?:\/\//i.test(v))v='https://'+v;return v;}
function openPriLink(id){
  const p=priorities.find(x=>x.id===id);if(!p)return;
  document.getElementById('modalMount').innerHTML=`<div class="overlay" onclick="if(event.target===this)closeModal()"><div class="modal">
    <h3>Spreadsheet link</h3><p class="sub">${esc(p.title)}</p>
    <div class="field"><label>Google Sheets link</label><input type="text" id="plInput" placeholder="Paste a Google Sheets link" value="${esc(p.link||'')}"></div>
    <div class="err" id="plErr"></div>
    <div class="modal-actions">
      ${p.link?`<button class="btn btn-line btn-sm" onclick="savePriLink('${id}',true)">Remove link</button>`:''}
      <button class="btn btn-line btn-sm" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary btn-sm" onclick="savePriLink('${id}')">Save</button></div></div></div>`;
}
function savePriLink(id,remove){
  const p=priorities.find(x=>x.id===id);if(!p)return;
  if(remove){p.link='';closeModal();render();toast('Link removed');
    if(live())sb.from('priorities').update({link:''}).eq('id',id).then(({error})=>{ if(error)toast('Not saved: '+error.message); });
    return;}
  const v=normLink(document.getElementById('plInput').value);
  if(!v){document.getElementById('plErr').textContent='Paste a link, or use Remove link.';return;}
  p.link=v;closeModal();render();toast('Link saved');
  if(live())sb.from('priorities').update({link:v}).eq('id',id).then(({error})=>{ if(error)toast('Not saved: '+error.message); });
}
function calendarTab(scopeId,editable){
  const open=priorities.filter(p=>!p.done).length;
  return pageHead('Calendar',scopeId?'your time off · shared projects':hourlyStaff().length+' on payroll')
    +`<div class="sec first"><div class="cal-split">
        <div class="panel">${calendarGrid(scopeId)}</div>
        <div class="panel"><div class="panel-head"><h2>Projects</h2><span class="ml meta">${open} open</span></div>

function openDayAdd(k){
  document.getElementById('modalMount').innerHTML=`<div class="overlay" onclick="if(event.target===this)closeModal()"><div class="modal">
    <h3>Add to ${fmtDayKey(k)}</h3><p class="sub">Time off or a project</p>
    <div class="field"><label>Type</label><select id="daType" onchange="daSwap()">
      <option value="off">Time off</option><option value="pri">Project</option></select></div>
    <div id="daBody"></div>
    <div class="err" id="daErr"></div>
    <div class="modal-actions"><button class="btn btn-line btn-sm" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary btn-sm" onclick="saveDayAdd('${k}')">Add</button></div></div></div>`;
  daSwap(k);
}
function daSwap(k){
  k=k||document.getElementById('daBody').dataset.k;
  const t=document.getElementById('daType').value,b=document.getElementById('daBody');
  b.dataset.k=k;
  const people=activeAll().map(e=>`<option value="${e.id}">${e.name}</option>`).join('');
  b.innerHTML = t==='off'
    ? `<div class="field"><label>Person</label><select id="daWho">${people}</select></div>
       <div class="field"><label>Reason</label><input type="text" id="daNote" placeholder="Vacation"></div>
       <div class="field"><label>From</label><input type="date" id="daStart" value="${k}"></div>
       <div class="field"><label>To</label><input type="date" id="daEnd" value="${k}"></div>
       <div class="field"><label>Type</label>${offTypePicker('daCat','regular','')}</div>`
    : `<div class="field"><label>Title</label><input type="text" id="daNote" placeholder="Quarterly inventory count"></div>
       <div class="field"><label>Due <span class="opt">optional</span></label><input type="date" id="daStart" value="${k}"></div>
       <label class="da-nodue"><input type="checkbox" id="daNoDue" onchange="document.getElementById('daStart').disabled=this.checked"> No due date</label>`;
}
function saveDayAdd(k){
  const t=document.getElementById('daType').value,err=document.getElementById('daErr');
  const note=document.getElementById('daNote').value.trim();
  if(!note){err.textContent=t==='off'?'Add a reason.':'Add a title.';return;}
  if(t==='off'){
    const who=document.getElementById('daWho').value;
    const cat=document.getElementById('daCat')?document.getElementById('daCat').value:'regular';
    const s=document.getElementById('daStart').value,e=document.getElementById('daEnd').value;
    if(!s||!e){err.textContent='Pick both dates.';return;}
    if(e<s){err.textContent='End date must be after the start date.';return;}
    if(live()){
      sb.from('time_off').insert({user_id:who,start_date:s,end_date:e,note,status:'approved',added_by:currentUser.name}).select().single().then(({data,error})=>{
        if(error){toast('Time off not saved: '+error.message);return;}
        if(!timeOff.some(t=>t.id===data.id)){timeOff.push(offFromRow(data));}
        setOffType(data.id,cat).then(()=>render());
      });
    }else{
      const tid='t'+Date.now();timeOff.push({id:tid,empId:who,start:s,end:e,note,status:'approved',addedBy:currentUser.name});timeOffCat[tid]=cat;
    }
    closeModal();render();toast('Time off added');
  }else{
    const noDue=document.getElementById('daNoDue')&&document.getElementById('daNoDue').checked;
    const d=noDue?'':document.getElementById('daStart').value;
    if(live()){
      sb.from('priorities').insert({title:note,due:d||null,done:false,pos:priorities.length,added_by:currentUser.name}).select().single().then(({data,error})=>{
        if(error){toast('Project not saved: '+error.message);return;}
        if(!priorities.some(p=>p.id===data.id)){priorities.push(priFromRow(data));render();}
      });
    }else{
      priorities.push({id:'pr'+Date.now(),title:note,due:d,done:false,addedBy:currentUser.name});
    }
    closeModal();render();toast('Project added');
  }
}

function timecardTab(){
  const dk=todayKey(),s=openShift(currentUser.id);

      </div>${brk}${reminder}

/* ---------- schedule ---------- */
function scheduleTab(empId,editable,embed){
  const s=schedules[empId]||blankWeek();
  const rows=DOW.map(k=>{
    const day=Array.isArray(s[k])?s[k]:[];
    let inner;
    if(editable){
      inner=day.map((sl,i)=>`<span class="slot"><input class="range-in" id="rg_${k}_${i}" value="${fmtHM(sl.start)} – ${fmtHM(sl.end)}"
          onblur="setSlot('${empId}','${k}',${i},this)" onkeydown="if(event.key==='Enter')this.blur()">
          <button class="slot-x" tabindex="-1" onmousedown="event.preventDefault()" onclick="removeSlot('${empId}','${k}',${i})" title="Remove block">&times;</button></span>`).join('')
        +`<button class="slot-add" onclick="addSlot('${empId}','${k}')" aria-label="Add a time block" title="Add a time block">+</button>`;
    }else{
      inner=day.length
        ? day.map(sl=>`<span class="slot ro"><span class="mono">${fmtHM(sl.start)} – ${fmtHM(sl.end)}</span></span>`).join('')
        : `<span class="sched-off">Day off</span>`;
    }
    return `<div class="sched-row ${day.length?'':'off'}"><span class="sched-day">${DOW_LABEL[k]}</span>
      <span class="slot-wrap">${inner}</span>
      <span class="sched-hrs">${day.length?fmtHrs(dayHours(day)):'—'}</span></div>`;
  }).join('');
  const total=weekHours(empId);
  const inner=`${editable?'<p class="lede">Tap the purple + on a day to add a time block, then type the hours — "9-5", "9am-5:30pm", and "09:00-17:00" all work. Add as many blocks a day as you need; tap a block and hit the × to remove it.</p>':''}
      ${rows}
      <div class="totals"><div class="stat"><div class="k">Scheduled per week</div><div class="v">${fmtHrs(total)}</div></div>
        <div class="stat"><div class="k">Worked so far this week</div><div class="v">${fmtDur(workedThisWeek(empId))}</div></div>
        <div class="stat"><div class="k">Days working</div><div class="v">${DOW.filter(k=>Array.isArray(s[k])&&s[k].length).length}</div></div></div>`;
  if(embed)return inner;
  return pageHead(editable?'My schedule':'Schedule',(editable?'visible to your manager':nameOf(empId))+' · '+tzLabel(tzOf(empId)))
    +`<div class="sec first">${inner}</div>`;
}
function ensureWeek(empId){if(!schedules[empId])schedules[empId]=blankWeek();
  DOW.forEach(k=>{if(!Array.isArray(schedules[empId][k]))schedules[empId][k]=[];});return schedules[empId];}
function addSlot(empId,day){const w=ensureWeek(empId);w[day].push({start:'09:00',end:'17:00'});render();saveSchedule(empId);
  setTimeout(()=>{const el=document.getElementById('rg_'+day+'_'+(w[day].length-1));if(el){el.focus();el.select();}},0);}
function removeSlot(empId,day,i){const w=ensureWeek(empId);w[day].splice(i,1);render();saveSchedule(empId);}
function setSlot(empId,day,i,el){
  const r=parseRange(el.value);
  if(!r){el.classList.add('bad');toast('Try a range like 9-5 or 9:00am-5:30pm');return;}
  el.classList.remove('bad');
  const w=ensureWeek(empId);
  if(!w[day][i]){render();return;}
  w[day][i].start=r.start;w[day][i].end=r.end;
  const clash=w[day].some((sl,j)=>j!==i&&slotsOverlap(sl,w[day][i]));
  render();saveSchedule(empId);
  if(clash)toast('Heads up — this block overlaps another one. Check the AM/PM.');
}

function teamTab(){
  if(teamView==='analytics'&&canManage(currentUser))return analyticsView();
  const team=hourlyStaff();
  const live=team.filter(e=>openShift(e.id)).length;
  const hc=(hoursCheck&&canManage(currentUser))?hoursCheck:null;
  let nMet=0,nShort=0;
  const rows=team.map(e=>{
    const s=openShift(e.id);
    const st=s?`<span class="st on"><i></i>On the clock</span>`:`<span class="st off"><i></i>Clocked out</span>`;
    let hcCell='';
    if(hc&&isSalaried(e)){hcCell=`<td class="num"><span class="hc-detail">Salaried</span></td>`;}
    else if(hc){const r=hoursCheckFor(e.id,hc);r.ok?nMet++:nShort++;
      hcCell=`<td class="num"><span class="hc-light ${r.ok?'ok':'no'}"><i></i>${r.ok?'Met':'Short'}</span>
        <span class="hc-detail">${fmtDur(r.worked)} / ${fmtHrs(r.reqH)}${r.off?` · ${r.off} day${r.off>1?'s':''} off`:''}</span></td>`;}
    const since=s?`<span class="mini mono" style="margin-left:10px">${fmtTimeFor(e.id,s.clockIn)}</span>`:'';
    return `<tr class="rowlink" onclick="openEmp('${e.id}')">
      <td><span class="person"><span class="sq-av" style="${avatarStyle(e)}">${initials(e.name)}</span>${e.name}</span></td>
      <td>${st}${since}</td><td class="num">${fmtDur(weekTotal(e.id))}</td>
      <td class="num">${fmtHrs(weekHours(e.id))}</td>${hcCell}
      <td style="text-align:right"><button class="linkish">View</button></td></tr>`;
  }).join('');
  const roster=team.length
    ? `<table><thead><tr><th>Employee</th><th>Status</th>
      <th class="num">Worked</th><th class="num">Scheduled</th>${hc?'<th class="num">Hours check</th>':''}<th></th></tr></thead><tbody>${rows}</tbody></table>`
    : '<div class="empty">No hourly people yet — they\'ll appear here once they create accounts.</div>';
  const gone=inactiveHourly();
  const inactiveRows=gone.map(e=>`<tr class="rowlink" onclick="openEmp('${e.id}')">
      <td><span class="person"><span class="sq-av" style="${avatarStyle(e)}">${initials(e.name)}</span>${esc(e.name)} <span class="inactive-tag">Inactive</span></span></td>
      <td style="text-align:right"><button class="linkish">View history</button></td></tr>`).join('');
  const inactiveSec=gone.length
    ? `<div class="sec"><div class="sec-head"><h2>Deactivated</h2><span class="ml meta">past records · read-only</span></div>
        <p class="lede">Deactivated people are off the current roster and payroll. Their past hours and work logs are kept here to view.</p>
        <table><tbody>${inactiveRows}</tbody></table></div>`
    : '';
  return teamHead(live+' of '+team.length+' on the clock')
    +`<div class="sec first">${hoursCheckBar(hc,nMet,nShort)}${roster}</div>`
    +inactiveSec
    +laptopSection()
    +rolesCard();
}
/* People & roles — everyone in leadership can see it; only OWNERS can change anything here */
function roleLabel(r){return r==='comanager'?'Co-manager':r==='manager'?'Manager':'Employee';}
function isLeaderRole(e){return e.role==='manager'||e.role==='comanager';}
function rolesCard(){
  const own=isOwner(currentUser);
  const people=employees.slice().sort(byLast).map(e=>{
    const off=e.active===false, me=e.id===currentUser.id, sal=isSalaried(e), onPay=e.role!=='manager';
    const tags=(isOwner(e)?' <span class="owner-tag">Owner</span>':'')+(onPay&&sal?' <span class="sal-tag">Salary</span>':'')+(off?' <span class="inactive-tag">Inactive</span>':'');
    const who=`<span class="person"><span class="sq-av" style="${avatarStyle(e)}">${initials(e.name)}</span><span><b>${esc(e.name)}</b>${tags}<span class="mini" style="display:block">${esc(e.email||'')}</span></span></span>`;
    if(!own){
      return `<div class="role-row ${off?'inactive':''}">${who}<span class="role-ro">${roleLabel(e.role)}${onPay?' · '+(sal?'Salary':'Hourly'):''}</span></div>`;
    }
    const roleSel=`<select class="role-sel" ${off?'disabled':''} onchange="changeRole('${e.id}',this.value)" title="Role">
        <option value="employee" ${e.role==='employee'?'selected':''}>Employee</option>
        <option value="comanager" ${e.role==='comanager'?'selected':''}>Co-manager</option>
        <option value="manager" ${e.role==='manager'?'selected':''}>Manager</option></select>`;
    const paySel=onPay?`<select class="role-sel pay-sel" ${off?'disabled':''} onchange="setPayType('${e.id}',this.value)" title="Pay type">
        <option value="hourly" ${!sal?'selected':''}>Hourly</option><option value="salary" ${sal?'selected':''}>Salary</option></select>`
      :`<span class="role-na" title="Managers are never on hourly payroll">No payroll</span>`;
    const ownBtn=(!off&&isLeaderRole(e))
      ?(isOwner(e)?`<button class="btn btn-line btn-sm" onclick="setOwner('${e.id}',false)" ${ownerCount()<=1?'disabled title="There must always be at least one Owner"':''}>Remove owner</button>`
                 :`<button class="btn btn-line btn-sm" onclick="setOwner('${e.id}',true)">Make owner</button>`)
      :'';
    const actBtn=me?'':(off?`<button class="btn btn-line btn-sm" onclick="setActive('${e.id}',true)">Reactivate</button>`
                        :`<button class="btn btn-line btn-sm rl-deact" onclick="askDeactivate('${e.id}')">Deactivate</button>`);
    return `<div class="role-row ${off?'inactive':''}">${who}<span class="role-ctrls">${roleSel}${paySel}${ownBtn}${actBtn}</span></div>`;
  }).join('');
  const pend=pendingRoles.length?pendingRoles.map(p=>`<div class="role-row">
      <span><b>${esc(p.email)}</b><span class="mini" style="display:block">hasn't signed up yet</span></span>
      <span class="mini" style="text-transform:capitalize">${p.role==='comanager'?'Co-manager':p.role}</span>
      ${own?`<button class="pri-x" onclick="removePendingRole('${esc(p.email)}')" title="Remove">&times;</button>`:''}</div>`).join('')
    :'<div class="empty">No pre-assigned roles waiting.</div>';
  const head=own
    ?`<p class="lede">You're an Owner: change roles, pay type (hourly or salary), ownership, and activation here. Switching someone to salary keeps their clock-in and takes them off hourly payroll from that moment — hours they worked while hourly stay on payroll. Owners must be a manager or co-manager.</p>
      <div style="margin:0 0 14px"><button class="btn btn-primary btn-sm" onclick="openTransferOwner()">Transfer ownership</button></div>`
    :`<p class="lede">Only an Owner can change roles, pay type, activation or ownership.</p>`;
  const pre=own?`<div class="role-pre">
        <div class="sec-head" style="margin-top:22px"><h2>Pre-assign a role</h2></div>
        <p class="mini" style="margin:0 0 12px">Set someone's role before they sign up. When they create their account with this email, the role applies automatically — then send them the site link.</p>
        <div class="inline-form">
          <div class="field grow"><label>Email</label><input type="email" id="prEmail" placeholder="name@onetelgem.com"></div>
          <div class="field"><label>Role</label><select id="prRole"><option value="employee">Employee</option><option value="comanager">Co-manager</option><option value="manager">Manager</option></select></div>
          <button class="btn btn-primary btn-sm" onclick="addPendingRole()">Pre-assign</button>
        </div><div class="err" id="prErr"></div>
        <div style="margin-top:14px">${pend}</div>
      </div>`:(pendingRoles.length?`<div class="role-pre"><div class="sec-head" style="margin-top:22px"><h2>Pre-assigned roles</h2></div>${pend}</div>`:'');
  return `<div class="sec"><div class="sec-head"><h2>People &amp; roles</h2><span class="ml meta">${own?'owner controls':'leadership only · view'}</span></div>
      ${head}${people||'<div class="empty">No accounts yet.</div>'}${pre}</div>`;
}
function ownerOnly(){if(isOwner(currentUser))return true;toast('Only an Owner can change this');render();return false;}
function profileErr(error){const m=(error&&error.message)||'';
  return /column|schema cache|pay_type|is_owner|deactivated_at/i.test(m)?'Run the Build 40 SQL in Supabase first ('+m+')':m;}
async function setActive(id,activeVal){
  if(!ownerOnly())return;
  const e=employees.find(x=>x.id===id); if(!e)return;
  if(!activeVal&&isOwner(e)&&ownerCount()<=1){toast('There must always be at least one active Owner');return;}
  const at=activeVal?null:Date.now();
  if(live()){
    let {error}=await sb.from('profiles').update({active:activeVal,deactivated_at:at?new Date(at).toISOString():null}).eq('id',id);
    if(error&&/deactivated_at|column|schema cache/i.test(error.message||'')) ({error}=await sb.from('profiles').update({active:activeVal}).eq('id',id));
    if(error){toast('Not saved: '+profileErr(error));return;}
  }
  e.active=activeVal; e.deactivatedAt=at;
  logAudit({ts:Date.now(),manager:currentUser.name,emp:e.name,field:activeVal?'Reactivated':'Deactivated',old:activeVal?'Inactive':'Active',new:activeVal?'Active':'Inactive',reason:''});
  closeModal();render();toast(activeVal?'Person reactivated':'Person deactivated — past payroll stays visible for 1 year');
}
function askDeactivate(id){
  if(!ownerOnly())return;
  const e=employees.find(x=>x.id===id);if(!e)return;
  document.getElementById('modalMount').innerHTML=`<div class="overlay" onclick="if(event.target===this)closeModal()"><div class="modal">
    <h3>Deactivate ${esc(e.name)}?</h3>

  e.role=role; if(id===currentUser.id)currentUser.role=role;

  const at=Date.now();

    const {error}=await sb.from('profiles').update({pay_type:type}).eq('id',id);
    if(error){toast('Could not change pay type: '+profileErr(error));render();return;}
    const {data,error:e2}=await sb.from('pay_type_changes').insert({user_id:id,pay_type:type,effective_at:new Date(at).toISOString(),changed_by:currentUser.id,changed_by_name:currentUser.name}).select().single();

function payTab(){
  const team=payrollStaff();

  /* current period first; then any finished period (from the rule date on) still waiting for its "Est. received"
     date; then everything else newest to oldest. Entering the received date lets a period drop down. */
  const waiting=p=>p.end<todayK&&p.end>=PERIOD_RULE_FROM&&!p.received;
  const rank=p=>(todayK>=p.start&&todayK<=p.end)?0:waiting(p)?1:2;
  const ordered=[...payPeriods].sort((a,b)=>rank(a)-rank(b)||b.start.localeCompare(a.start));
  const periods=ordered.map(p=>{
    const current=todayK>=p.start&&todayK<=p.end;
    const rows=periodStaff(p).map(e=>{const ms=paidMs(e.id,p),amt=(ms/HR)*e.rate;
      const rbTotal=periodReimb.filter(r=>r.periodId===p.id&&r.empId===e.id).reduce((t,r)=>t+r.amount,0);
      const tag=(isActive(e)?'':' <span class="inactive-tag">Inactive</span>')+(isActive(e)&&isSalaried(e)?' <span class="inactive-tag">Now salaried</span>':'');

    return `<div class="period ${current?'current':''}"><div class="period-head">
        <span class="period-title">${fmtDayKey(p.start)} — ${fmtDayKey(p.end)}</span>
        ${current?'<span class="period-tag">Current</span>':''}${waiting(p)?'<span class="period-tag wait">Needs received date</span>':''}
        <span class="pd-dates"><label>Sent<input type="date" class="pd-in" value="${p.sent||''}" onchange="setPeriodDate('${p.id}','sent',this.value)"></label>
          <label>Est. received<input type="date" class="pd-in ${waiting(p)?'need':''}" value="${p.received||''}" onchange="setPeriodDate('${p.id}','received',this.value)"></label></span>
        <button class="dl-btn" onclick="openPdfChoice('${p.id}')" title="Download payroll PDF" aria-label="Download payroll PDF">&#8595;</button></div>
      <table><thead><tr><th>Employee</th><th class="num">Hours</th><th class="num">Rate</th><th class="num">Est. pay</th><th class="num">Reimb</th><th class="num">Total</th></tr></thead><tbody>${rows}</tbody></table>

      <div style="margin-top:10px"><button class="pri-x" onclick="removePeriod('${p.id}')" title="Remove period">&times; Remove this period</button></div></div>`;
  }).join('');
  return pageHead('Payroll',payPeriods.length+' periods')
    +`<div class="sec first"><div class="sec-head"><h2>Pay rates</h2></div><table><tbody>${rateRows}</tbody></table></div>
      <div class="sec"><div class="sec-head"><h2>Schedule periods</h2></div>
        <div class="inline-form">

  const range=fmtDayKey(p.start)+' — '+fmtDayKey(p.end)+', '+keyToDate(p.end).getFullYear();

/* ================= STRIKES (#1) =================
   Ledger of add/remove events. Active count = adds minus removes (never below 0).
   Clock for eligibility starts at the most recent strike activity (add OR remove):
   6 months later -> "Eligible for reevaluation", 12 months later -> "Eligible for removal".
   A manager/co-manager decides and removes with a reason. Employees only ever load their own rows. */
const STRIKE_MAX=3;
function strikeFromRow(r){return {id:r.id,empId:r.user_id,action:r.action,reason:r.reason||'',
  date:r.strike_date||dateKey(new Date(r.created_at).getTime()),byName:r.created_by_name||'',ts:new Date(r.created_at).getTime()};}
async function loadStrikes(){
  const {data,error}=await sb.from('strikes').select('*').order('strike_date',{ascending:true}).order('created_at',{ascending:true});
  if(error)throw error;
  strikes=(data||[]).filter(r=>r.user_id&&(r.action==='add'||r.action==='remove')).map(strikeFromRow);
}
function strikesFor(id){return strikes.filter(s=>s.empId===id).sort((a,b)=>a.date.localeCompare(b.date)||a.ts-b.ts);}
function strikeCount(id){let n=0;strikesFor(id).forEach(s=>{n+=s.action==='add'?1:-1;if(n<0)n=0;});return n;}
function lastStrikeAdd(id){const a=strikesFor(id).filter(s=>s.action==='add');return a.length?a[a.length-1].date:null;}
function lastStrikeEvent(id){const a=strikesFor(id);return a.length?a[a.length-1].date:null;}
function addMonthsKey(k,n){const d=keyToDate(k),day=d.getDate();d.setMonth(d.getMonth()+n);if(d.getDate()!==day)d.setDate(0);return dateKey(d);}
function fmtDayKeyYear(k){return keyToDate(k).toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'});}
/* calendar difference from a date key to today, e.g. "1 yr 2 mo 5 days" */
function timeSinceKey(k){
  const a=keyToDate(k),b=keyToDate(dateKey(Date.now()));
  if(b<=a)return 'today';
  let y=b.getFullYear()-a.getFullYear(),m=b.getMonth()-a.getMonth(),d=b.getDate()-a.getDate();
  if(d<0){m--;d+=new Date(b.getFullYear(),b.getMonth(),0).getDate();}
  if(m<0){y--;m+=12;}
  const p=[];if(y)p.push(y+(y===1?' yr':' yrs'));if(m)p.push(m+' mo');if(d)p.push(d+(d===1?' day':' days'));
  return p.join(' ')||'today';
}
function strikeStatus(id){
  const n=strikeCount(id),last=lastStrikeAdd(id),clock=lastStrikeEvent(id),today=dateKey(Date.now());
  let flag='';
  if(n>0&&clock){ if(today>=addMonthsKey(clock,12))flag='removal'; else if(today>=addMonthsKey(clock,6))flag='reeval'; }
  return {n,last,flag};
}
function strikeStat(id,mgr){
  const st=strikeStatus(id);
  const since=st.last?`Time since last strike · ${timeSinceKey(st.last)}`:'No strikes on record';
  const flag=(mgr&&st.flag)?`<span class="strike-flag ${st.flag}">${st.flag==='removal'?'Eligible for removal':'Eligible for reevaluation'}</span>`:'';
  const plus=mgr?`<button class="plus-bub" title="Add a strike" aria-label="Add a strike" onclick="event.stopPropagation();openStrikeForm('${id}','add')">+</button>`:'';
  return `<div class="stat strike-stat click-stat ${st.n>=STRIKE_MAX?'maxed':''}" onclick="openStrikeHistory('${id}')" title="See strike history">
      <div class="k">Strikes</div>
      <div class="v">${st.n}<span class="of"> / ${STRIKE_MAX}</span>${plus}</div>
      <div class="strike-since">${since}</div>${flag}</div>`;
}
function openStrikeForm(id,action){
  if(!canManage(currentUser))return;
  const e=employees.find(x=>x.id===id);if(!e)return;
  const add=action==='add',n=strikeCount(id),today=dateKey(Date.now());
  const warn=(add&&n+1>=STRIKE_MAX)?`<div class="note warn" style="margin-bottom:18px">This will be strike ${n+1} of ${STRIKE_MAX}. All managers and co-managers will be notified.</div>`:'';
  document.getElementById('modalMount').innerHTML=`<div class="overlay" onclick="if(event.target===this)closeModal()"><div class="modal">
    <h3>${add?'Add a strike':'Remove a strike'}</h3><p class="sub">${esc(e.name)} · currently ${n} / ${STRIKE_MAX}</p>
    ${warn}
    <div class="field"><label>Date</label><input type="date" id="skDate" value="${today}" max="${today}"></div>
    <div class="field"><label>Reason <span class="req">required</span></label><textarea class="log-area" id="skReason" rows="3" placeholder="Write the reason for ${add?'this strike':'removing this strike'}"></textarea></div>
    <div class="err" id="skErr"></div>
    <div class="modal-actions"><button class="btn btn-line btn-sm" onclick="closeModal()">Cancel</button>
      <button class="btn ${add?'btn-danger':'btn-primary'} btn-sm" onclick="saveStrike('${id}','${action}')">${add?'Add strike':'Remove strike'}</button></div></div></div>`;
}
async function saveStrike(id,action){
  const err=document.getElementById('skErr');
  const reason=(document.getElementById('skReason').value||'').trim();
  const date=document.getElementById('skDate').value;
  const today=dateKey(Date.now());
  if(!reason){err.textContent='Add a reason — it is saved with the strike.';return;}
  if(!date){err.textContent='Pick a date.';return;}
  if(date>today){err.textContent='The date can\'t be in the future.';return;}
  const before=strikeCount(id);
  if(action==='remove'&&before<=0){err.textContent='There are no active strikes to remove.';return;}
  const row={user_id:id,action,reason,strike_date:date,created_by:currentUser.id,created_by_name:currentUser.name};
  if(live()){
    const {data,error}=await sb.from('strikes').insert(row).select().single();
    if(error){err.textContent='Could not save: '+error.message;return;}
    if(!strikes.some(s=>s.id===data.id))strikes.push(strikeFromRow(data));
  }else{
    strikes.push({id:'sk'+Date.now(),empId:id,action,reason,date,byName:currentUser.name,ts:Date.now()});
  }
  const after=strikeCount(id);
  logAudit({ts:Date.now(),manager:currentUser.name,emp:nameOf(id),field:action==='add'?'Strike added':'Strike removed',
    old:before+' / '+STRIKE_MAX,new:after+' / '+STRIKE_MAX,reason});
  if(action==='add'&&before<STRIKE_MAX&&after>=STRIKE_MAX)notifyStrikeMax(id);
  closeModal();render();toast(action==='add'?'Strike added':'Strike removed');
}
/* 3/3 reached -> notify every other active manager/co-manager */
function notifyStrikeMax(id){
  const text=`${nameOf(id)} has reached ${STRIKE_MAX} of ${STRIKE_MAX} strikes.`;
  const leaders=activeAll().filter(x=>canManage(x)&&x.id!==currentUser.id);
  if(!leaders.length)return;
  if(live()){
    sb.from('messages').insert(leaders.map(l=>({to_user:l.id,from_user:currentUser.id,from_name:currentUser.name,subject:'Strike alert',body:text})))
      .then(({error})=>{ if(error)toast('Strike alert not sent: '+error.message); });
  }else{
    leaders.forEach(l=>messages.push({id:'nt'+(++msgSeq),to:l.id,from:currentUser.name,subject:'Strike alert',text,ts:Date.now(),read:false}));
  }
}
function openStrikeHistory(id){
  const mgr=canManage(currentUser);
  if(!mgr&&id!==currentUser.id)return;   /* employees can only ever open their own */
  const e=employees.find(x=>x.id===id);if(!e)return;
  const list=strikesFor(id).slice().reverse();
  const rows=list.length?list.map(s=>`<div class="sh-row"><span class="sh-badge ${s.action}">${s.action==='add'?'Added':'Removed'}</span>
      <div class="sh-main"><div class="sh-reason">${esc(s.reason)||'—'}</div>
      <div class="sh-date">${fmtDayKeyYear(s.date)}${mgr&&s.byName?' · by '+esc(s.byName):''}</div></div></div>`).join('')
    :'<div class="empty">No strikes on record.</div>';
  document.getElementById('modalMount').innerHTML=`<div class="overlay" onclick="if(event.target===this)closeModal()"><div class="modal">
    <h3>Strike history</h3><p class="sub">${esc(e.name)} · ${strikeCount(id)} / ${STRIKE_MAX} active</p>
    <div class="sh-list">${rows}</div>
    <p class="sh-rule">A strike is eligible for reevaluation 6 months after the most recent strike activity, and for removal after a full year without a new strike.</p>
    <div class="modal-actions edit-actions"><span class="ea-left">${mgr?`<button class="btn btn-danger btn-sm" onclick="openStrikeForm('${id}','add')">+ Add strike</button>`
        +(strikeCount(id)>0?`<button class="btn btn-line btn-sm" onclick="openStrikeForm('${id}','remove')">Remove a strike</button>`:''):''}</span>
      <span class="ea-right"><button class="btn btn-line btn-sm" onclick="closeModal()">Close</button></span></div></div></div>`;
}

/* ================= QUESTIONS OF THE WEEK (#2) =================
   One entry per person per week. A week is keyed by its Friday send-by date.
   Everyone sees everything; each person edits their own; leaders edit any + set the Special Guest.
   Imported rows may be name-only (no account yet) — they're matched to an account by first name. */
function qeFromRow(r){return {id:r.id,week:r.week_date,userId:r.user_id||null,personName:r.person_name||'',question:r.question||'',vacation:!!r.is_vacation,status:r.answer_status||''};}
async function loadQotw(){
  const [er,wr]=await Promise.all([sb.from('qotw_entries').select('*'),sb.from('qotw_weeks').select('*')]);
  if(er.error)throw er.error; if(wr.error)throw wr.error;
  qotwEntries=(er.data||[]).filter(r=>r.week_date).map(qeFromRow);
  qotwGuests={};(wr.data||[]).forEach(r=>{if(r.week_date&&r.guest)qotwGuests[r.week_date]=r.guest;});
}
function firstNameOf(n){return (n||'').trim().split(/\s+/)[0].toLowerCase();}
function qPersonKey(en){
  if(en.userId)return en.userId;
  const fn=firstNameOf(en.personName),m=employees.find(e=>firstNameOf(e.name)===fn);
  return m?m.id:'name:'+fn;
}
function isQParticipant(u){return !!u&&(u.role==='comanager'||u.role==='employee')&&isActive(u)&&!isOwner(u);}
function qParticipants(){
  const map=new Map();
  employees.filter(isQParticipant).forEach(e=>map.set(e.id,{key:e.id,name:e.name}));
  qotwEntries.forEach(en=>{const k=qPersonKey(en);if(!map.has(k)){const emp=employees.find(e=>e.id===k);
    map.set(k,{key:k,name:emp?emp.name:(en.personName||k.replace(/^name:/,''))});}});
  return [...map.values()].sort((a,b)=>a.name.localeCompare(b.name));
}
function qEntry(week,key){return qotwEntries.find(en=>en.week===week&&qPersonKey(en)===key)||null;}
function fridayOnOrAfter(k){const d=keyToDate(k);d.setDate(d.getDate()+((5-d.getDay()+7)%7));return dateKey(d);}
function currentQWeek(){return fridayOnOrAfter(dateKey(Date.now()));}
function fmtQWeek(k){return keyToDate(k).toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric',year:'numeric'});}
/* Monday reminder: from Monday until the question for this Friday is in (vacation counts as done) */
function qotwReminderDue(){
  if(!isQParticipant(currentUser))return null;
  const dow=new Date().getDay(); if(dow<1||dow>5)return null;
  const wk=currentQWeek(); return qEntry(wk,currentUser.id)?null:wk;
}
function qCanEdit(key){return canManage(currentUser)||key===currentUser.id;}
function qotwTab(){
  const me=currentUser,mgr=canManage(me),wk=currentQWeek(),people=qParticipants();
  let mine='';
  if(isQParticipant(me)){
    const en=qEntry(wk,me.id),vac=!!(en&&en.vacation);
    const val=qwDraft!==null?qwDraft:(en&&!vac?en.question:'');
    mine=`<div class="panel qw-mine"><div class="panel-head"><h2>Your question · due ${fmtQWeek(wk)}</h2>
        <span class="ml meta ${en?'qw-done':'qw-due'}">${en?(vac?'on vacation':'submitted'):'not submitted yet'}</span></div>
      <textarea class="log-area" id="qwMine" rows="3" placeholder="Write your question for this week…" oninput="qwDraft=this.value" ${vac?'disabled':''}>${esc(val)}</textarea>
      <label class="chk-line"><input type="checkbox" id="qwVac" ${vac?'checked':''} onchange="document.getElementById('qwMine').disabled=this.checked"> I'm on vacation this week</label>
      <div class="log-actions"><button class="btn btn-primary btn-sm" onclick="saveMyQuestion()">Save</button></div></div>`;
  }
  const guestTool=mgr?`<span class="qw-tool-grp"><span class="ml">Special guest</span>
      <input type="date" id="qgDate" value="${wk}"><input type="text" id="qgName" class="qg-name" placeholder="Guest name">
      <button class="btn btn-line btn-sm" onclick="saveGuest()">Save guest</button></span>`:'';
  const randBtn=mgr?`<button class="btn btn-primary btn-sm qw-rand-btn" onclick="startRandomizer()">&#8645; ${qRand?'New 3':'Randomizer'}</button>`:'';
  const tools=(guestTool||randBtn)?`<div class="qw-tools">${guestTool}${randBtn}</div><div class="err" id="qgErr"></div>`:'';
  if(qRand&&!mgr)qRand=null;
  const pinned=new Set(qRand?qRand.ids:[]);
  const weekSet=new Set([wk,...qotwEntries.map(e=>e.week),...Object.keys(qotwGuests)]);
  /* future weeks show once they have a guest or an answered question (so a question answered early still has a home) */
  const weeks=[...weekSet].filter(k=>k<=wk||qotwGuests[k]||qotwEntries.some(e=>e.week===k&&e.status==='answered')).sort((a,b)=>b.localeCompare(a));
  const pencil=`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>`;
  const cards=weeks.map(k=>{
    const guest=qotwGuests[k]||'';
    const rows=[],missing=[];
    let nAns=0,nOpen=0;
    people.forEach(pp=>{const en=qEntry(k,pp.key);
      if(en&&pinned.has(en.id))return;   /* pinned in the Randomizer section for now */
      if(en){
        const st=en.vacation?'':en.status;
        if(st==='answered')nAns++;

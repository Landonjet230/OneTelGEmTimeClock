            <button class="qw-mark ok ${st==='answered'?'on':''}" title="${st==='answered'?'Answered — click to undo':'Mark answered'}" onclick="setQStatus('${en.id}','answered')">&#10003;</button></span>`:'';
        rows.push(`<div class="qw-row ${st==='answered'?'st-answered':''}"><span class="qw-who">${esc(pp.name.split(' ')[0])}</span>
        <span class="qw-q">${en.vacation?'<span class="qw-vac">Vacation</span>':esc(en.question)}</span>${marks}
        ${qCanEdit(pp.key)?`<button class="day-edit" title="Edit" onclick="openQEdit('${k}','${pp.key}')">${pencil}</button>`:''}</div>`);
      } else missing.push(pp);});
    const tally=nAns?`<span class="qw-tally"><b class="t-ok">${nAns} answered</b></span>`:'';
    const miss=missing.length?`<div class="qw-missing">No question yet: ${missing.map(pp=>qCanEdit(pp.key)
        ?`<button class="qw-add" onclick="openQEdit('${k}','${pp.key}')">${esc(pp.name.split(' ')[0])}</button>`
        :`<span>${esc(pp.name.split(' ')[0])}</span>`).join('')}</div>`:'';
    return `<div class="qw-week ${k===wk?'current':''}"><div class="qw-head">
        <span class="qw-date">${fmtQWeek(k)}</span>${k===wk?'<span class="period-tag">This week</span>':''}
        ${guest?(mgr?`<button class="qw-guest qw-guest-btn" title="Change or remove guest" onclick="openGuestEdit('${k}')">Special guest · ${esc(guest)}</button>`:`<span class="qw-guest">Special guest · ${esc(guest)}</span>`)
          :(mgr?`<button class="qw-addguest" onclick="openGuestEdit('${k}')">+ Add guest</button>`:'')}${tally}</div>
      ${rows.join('')||'<div class="empty" style="padding:6px 0">No questions yet.</div>'}${miss}</div>`;
  }).join('');
  return pageHead('Questions of the Week','due Fridays · '+people.length+' people')
    +`<div class="sec first">${mine}${tools}<div class="qw-weeks">${qRandSection()}${cards}</div></div>`;
}
/* create / update / clear one person's entry for a week */
async function upsertQ(week,key,question,vacation){
  const existing=qEntry(week,key);
  const emp=employees.find(e=>e.id===key);
  const person=emp?emp.name:(existing?existing.personName:key.replace(/^name:/,''));
  question=(question||'').trim();
  if(!question&&!vacation){
    if(existing){
      if(live()){const {error}=await sb.from('qotw_entries').delete().eq('id',existing.id);if(error){toast('Not saved: '+error.message);return false;}}
      qotwEntries=qotwEntries.filter(x=>x!==existing);
    }
    return true;
  }
  const row={week_date:week,user_id:emp?emp.id:null,person_name:person,question:vacation?'':question,is_vacation:!!vacation,updated_by:currentUser.id,updated_at:new Date().toISOString()};
  if(live()){
    const q=existing?sb.from('qotw_entries').update(row).eq('id',existing.id):sb.from('qotw_entries').insert(row);
    const {data,error}=await q.select().single();
    if(error){toast('Not saved: '+error.message);return false;}
    if(existing)Object.assign(existing,qeFromRow(data)); else qotwEntries.push(qeFromRow(data));
  }else{
    const loc={week,userId:row.user_id,personName:person,question:row.question,vacation:!!vacation};
    if(existing)Object.assign(existing,loc); else qotwEntries.push({id:'qe'+Date.now(),...loc});
  }
  return true;
}

/* Randomizer (leaders only, this screen only): pins 3 random not-yet-answered questions (any week, past or future)
   to the top. ✓ marks one answered and sends it back to its own week. Skip swaps it for another random one;
   skipped questions stay out for this round only. The section hides once all 3 are answered, or on Clear. */
function qRandomPool(exclude){exclude=exclude||new Set();
  return qotwEntries.filter(en=>!en.vacation&&(en.question||'').trim()&&en.status!=='answered'&&!exclude.has(en.id));}
function qRandPick(n,exclude){
  const pool=qRandomPool(exclude).slice();
  for(let i=pool.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]];}
  return pool.slice(0,n).map(en=>en.id);
}
function startRandomizer(){
  if(!canManage(currentUser))return;
  const ids=qRandPick(3);
  if(!ids.length){qRand=null;render();toast('Every question has been answered');return;}
  qRand={ids,skipped:new Set()};render();
  const el=document.getElementById('qRandSec');if(el)el.scrollIntoView({block:'nearest',behavior:'smooth'});
}
function clearRandomizer(){qRand=null;render();}
function skipRandQ(id){
  if(!qRand)return;
  qRand.skipped.add(id);
  const i=qRand.ids.indexOf(id);if(i<0)return;
  const [rep]=qRandPick(1,new Set([...qRand.skipped,...qRand.ids]));
  if(rep)qRand.ids[i]=rep; else{qRand.ids.splice(i,1);toast('No more unanswered questions to swap in');}
  if(!qRand.ids.length)qRand=null;
  render();
}
async function answerRandQ(id){
  if(!qRand)return;
  qRand.ids=qRand.ids.filter(x=>x!==id);
  if(!qRand.ids.length)qRand=null;   /* all 3 done -> hide the section */
  await setQStatus(id,'answered');
  const en=qotwEntries.find(x=>x.id===id);
  if(en&&en.status==='answered')toast('Answered · moved back to '+fmtDayKey(en.week));
}
function qRandSection(){
  if(!qRand||!canManage(currentUser))return '';
  /* drop anything answered/removed elsewhere in the meantime */
  qRand.ids=qRand.ids.filter(id=>{const en=qotwEntries.find(x=>x.id===id);return en&&en.status!=='answered';});
  if(!qRand.ids.length){qRand=null;return '';}
  const nameFor=en=>{const k=qPersonKey(en),pp=qParticipants().find(x=>x.key===k);return (pp?pp.name:en.personName||'').split(' ')[0];};
  const rows=qRand.ids.map(id=>{const en=qotwEntries.find(x=>x.id===id);
    return `<div class="qw-row qr-row"><button class="qr-skip" title="Skip — swap in another question" onclick="skipRandQ('${id}')">Skip</button>
      <span class="qw-who">${esc(nameFor(en))}</span>
      <span class="qw-q">${esc(en.question)}<span class="qr-from">from ${fmtQWeek(en.week)}</span></span>
      <span class="qw-marks"><button class="qw-mark ok" title="Mark answered — moves it back to its week" onclick="answerRandQ('${id}')">&#10003;</button></span></div>`;}).join('');
  const left=qRandomPool(new Set([...qRand.skipped,...qRand.ids])).length;
  return `<div class="qw-week qr-sec" id="qRandSec"><div class="qw-head"><span class="qw-date">Randomizer</span>
      <span class="period-tag">${qRand.ids.length} picked</span><span class="qr-left">${left} more to swap in</span>
      <button class="btn btn-line btn-xs qr-clear" onclick="clearRandomizer()">Clear</button></div>${rows}</div>`;
}

/* ================= ANONYMOUS SURVEY (#3) =================
   Once per calendar month (company time, Utah). The comment is stored with NO name and NO timestamp.
   A separate private marker ("you sent one this month") is readable only by that same person.
   Leaders get a monthly bell reminder to send the survey out; sending notifies the team. */
const SURVEY_MSG="This month's anonymous survey is open. Share advice, problems or concerns — your name is never attached. Open Messages → Anonymous feedback.";
function surveyMonth(){return new Intl.DateTimeFormat('en-CA',{timeZone:'America/Denver',year:'numeric',month:'2-digit'}).format(new Date()).slice(0,7);}
function surveyMonthLabel(m){return new Date(m+'-01T00:00:00').toLocaleDateString(undefined,{month:'long',year:'numeric'});}
function nextSurveyMonthLabel(){const d=new Date(surveyMonth()+'-01T00:00:00');d.setMonth(d.getMonth()+1);return d.toLocaleDateString(undefined,{month:'long',day:'numeric'});}
async function loadSurvey(){
  const resp=[],rounds={},mine=new Set();
  if(canManage(currentUser)){
    const [r1,r2]=await Promise.all([sb.from('survey_responses').select('*'),sb.from('survey_rounds').select('*')]);
    if(r1.error)throw r1.error; if(r2.error)throw r2.error;
    (r1.data||[]).forEach(r=>resp.push({id:r.id,month:r.month,body:r.body||''}));
    (r2.data||[]).forEach(r=>{rounds[r.month]={by:r.sent_by_name||'',at:new Date(r.sent_at).getTime(),status:r.status||'sent'};});
  }
  const r3=await sb.from('survey_submissions').select('month').eq('user_id',currentUser.id);
  if(r3.error)throw r3.error;
  (r3.data||[]).forEach(r=>mine.add(r.month));
  surveyResponses=resp;surveyRounds=rounds;surveyMine=mine;
}
function surveyReminderDue(){const m=surveyMonth();return (canManage(currentUser)&&!surveyRounds[m])?m:null;}
function surveyButton(){
  const sent=isQParticipant(currentUser)&&surveyMine.has(surveyMonth());

}

    <h3>Anonymous feedback</h3><p class="cmp-sub">${surveyMonthLabel(m)} · one per month</p>

      <button class="btn btn-primary btn-sm" onclick="submitSurvey()">Send anonymously</button></div></div></div>`;
}
async function submitSurvey(){

/* ================= GOALS (Build 41) =================
   Each person can have an HOURS goal, a PAY goal, both, or neither (all optional).
   Pay = worked hours x hourly rate, before taxes. Period per goal: this week (Sun–Sat), this pay period,
   this month (Utah time) or custom dates; week / pay period / month roll over automatically.
   Shown small, right next to the "Hours" title; click it to set, change or remove. Leaders see them too. */
function goalRange(g){
  const t=todayKey();
  if(g.period==='week'){const a=weekStartKey();return {start:a,end:addDaysKey(a,6),label:'This week'};}
  if(g.period==='month'){const a=t.slice(0,7)+'-01',d=keyToDate(a);d.setMonth(d.getMonth()+1);d.setDate(0);return {start:a,end:dateKey(d),label:'This month'};}
  if(g.period==='payperiod'){const p=payPeriods.find(x=>t>=x.start&&t<=x.end);return p?{start:p.start,end:p.end,label:'This pay period'}:null;}
  return (g.start&&g.end)?{start:g.start,end:g.end,label:'Custom dates'}:null;
}
function goalProgress(id,g){
  const r=goalRange(g); if(!r)return null;
  const e=employees.find(x=>x.id===id), ms=periodMs(id,r);
  const have=g.kind==='pay'?(ms/HR)*((e&&e.rate)||0):ms/HR;
  return {r,have,pct:g.target>0?Math.min(100,have/g.target*100):0,done:have>=g.target};
}
function goalFmt(g,v){return g.kind==='pay'?money(v).replace(/\.00$/,''):(Math.round(v*10)/10)+'h';}
function goalsOf(id){const m=goals[id]||{};return ['hours','pay'].map(k=>m[k]).filter(Boolean);}
/* the small inline goal(s) next to the page title */
function goalMini(id,g,click){
  const pr=goalProgress(id,g);
  const lbl=g.kind==='pay'?'Pay':'Hours';
  const tip=pr?`${lbl} goal · ${pr.r.label} (${fmtDayKey(pr.r.start)} – ${fmtDayKey(pr.r.end)}) · ${Math.floor(pr.pct)}%${pr.done?' · reached!':''}`
             :`${lbl} goal · ${g.period==='payperiod'?'no pay period covers today yet':'pick dates'}`;
  const inner=`<span class="gm-lbl">${lbl}</span><span class="gm-bar"><i style="width:${pr?pr.pct.toFixed(1):0}%"></i></span>
    <span class="gm-num">${pr?goalFmt(g,pr.have):'—'}<span class="gm-of"> / ${goalFmt(g,g.target)}</span></span>`;
  return click?`<button class="goal-mini ${pr&&pr.done?'done':''}" title="${esc(tip)} — click to change" onclick="openGoalForm()">${inner}</button>`
              :`<span class="goal-mini ro ${pr&&pr.done?'done':''}" title="${esc(tip)}">${inner}</span>`;
}
function goalsInline(id,mine){
  const list=goalsOf(id);
  if(!list.length)return mine?`<button class="goal-link" onclick="openGoalForm()">Goals</button>`:'';
  return `<span class="goals-inline">${list.map(g=>goalMini(id,g,mine)).join('')}</span>`;
}
function goalFields(kind,g,hasPP){
  const pay=kind==='pay', v=g||{target:'',period:'week',start:'',end:''}, P=pay?'gp':'gh';
  return `<div class="goal-sec"><div class="goal-sec-h"><span class="ml">${pay?'Pay goal':'Hours goal'}</span>
      <span class="mini">${pay?'hours × your rate, before taxes':''}${g?'':' optional'}</span></div>
    <div class="goal-row">
      <div class="field"><label>${pay?'Amount ($)':'Hours'}</label><input type="number" id="${P}Target" min="0" step="${pay?'1':'0.25'}" value="${v.target||''}" placeholder="${pay?'500':'30'}"></div>
      <div class="field grow"><label>Period</label><select id="${P}Period" onchange="document.getElementById('${P}Custom').classList.toggle('hide',this.value!=='custom')">
        <option value="week" ${v.period==='week'?'selected':''}>This week (resets weekly)</option>
        <option value="payperiod" ${v.period==='payperiod'?'selected':''}>This pay period${hasPP?'':' (none right now)'}</option>
        <option value="month" ${v.period==='month'?'selected':''}>This month (resets monthly)</option>
        <option value="custom" ${v.period==='custom'?'selected':''}>Custom dates</option></select></div></div>
    <div id="${P}Custom" class="goal-custom ${v.period==='custom'?'':'hide'}">
      <div class="field"><label>From</label><input type="date" id="${P}Start" value="${v.start||''}"></div>
      <div class="field"><label>To</label><input type="date" id="${P}End" value="${v.end||''}"></div></div>
    ${g?`<button class="linkish goal-clear" onclick="clearGoalField('${P}')">Clear this goal</button>`:''}</div>`;
}
function clearGoalField(P){document.getElementById(P+'Target').value='';}
function openGoalForm(){
  const m=goals[currentUser.id]||{};
  const canPay=!isSalaried(currentUser)&&currentUser.rate>0;
  const hasPP=payPeriods.some(x=>todayKey()>=x.start&&todayKey()<=x.end);
  const prog=goalsOf(currentUser.id).map(g=>{const pr=goalProgress(currentUser.id,g);if(!pr)return '';
    return `<div class="goal-prog"><span class="ml">${g.kind==='pay'?'Pay':'Hours'} · ${pr.r.label}</span>
      <div class="goal-prog-n"><b>${goalFmt(g,pr.have)}</b> of ${goalFmt(g,g.target)} · ${Math.floor(pr.pct)}%${pr.done?' — reached!':' — '+goalFmt(g,g.target-pr.have)+' to go'}</div>
      <div class="gm-bar wide ${pr.done?'done':''}"><i style="width:${pr.pct.toFixed(1)}%"></i></div></div>`;}).join('');
  document.getElementById('modalMount').innerHTML=`<div class="overlay" onclick="if(event.target===this)closeModal()"><div class="modal">
    <h3>Goals</h3><p class="sub">Set one, both, or neither · visible to you and leadership</p>
    ${prog?`<div class="goal-progs">${prog}</div>`:''}
    ${goalFields('hours',m.hours,hasPP)}

      <button class="btn btn-primary btn-sm" onclick="saveGoals()">Save</button></div></div></div>`;

function readGoalField(P,kind){
  const el=document.getElementById(P+'Target'); if(!el)return {skip:true};
  const raw=(el.value||'').trim(); if(!raw)return {g:null};
  const target=parseFloat(raw),period=document.getElementById(P+'Period').value;
  const start=document.getElementById(P+'Start').value,end=document.getElementById(P+'End').value;
  const nm=kind==='pay'?'pay goal':'hours goal';
  if(!(target>0))return {err:'Enter a '+nm+' greater than 0, or leave it blank.'};
  if(period==='custom'){if(!start||!end)return {err:'Pick From and To dates for the '+nm+'.'};
    if(end<start)return {err:'For the '+nm+', the To date must be on or after the From date.'};}
  return {g:{kind,target,period,start:period==='custom'?start:'',end:period==='custom'?end:''}};
}
async function saveGoals(){
  const err=document.getElementById('gErr');
  const res={hours:readGoalField('gh','hours'),pay:readGoalField('gp','pay')};
  for(const k in res)if(res[k].err){err.textContent=res[k].err;return;}
  const cur=goals[currentUser.id]||{}, next={...cur};
  for(const k of ['hours','pay']){
    if(res[k].skip)continue;
    const g=res[k].g;
    if(live()){
      const q=g?sb.from('goal_targets').upsert({user_id:currentUser.id,kind:k,target:g.target,period:g.period,start_date:g.start||null,end_date:g.end||null,updated_at:new Date().toISOString()})
               :sb.from('goal_targets').delete().eq('user_id',currentUser.id).eq('kind',k);
      const {error}=await q;
      if(error){err.textContent='Could not save: '+(/goal_targets|schema cache|relation/i.test(error.message)?'run the Build 41 SQL in Supabase first':error.message);return;}
    }
    if(g)next[k]=g; else delete next[k];
  }
  goals[currentUser.id]=next; closeModal();render();toast(goalsOf(currentUser.id).length?'Goals saved':'Goals cleared');
}

/* ================= HOURS CHECK (#6) — managers & co-managers only =================
   Custom From/To dates + custom required hours. Worked = hours whose shifts fall on those company (Utah) days.
   Approved time off lowers the target: required x (weekdays not off / weekdays in range). */
let hoursCheck=null;   /* {start,end,hours} for this session */
function isWeekdayKey(k){const d=keyToDate(k).getDay();return d>0&&d<6;}
function weekdaysIn(a,b){let n=0;for(let k=a;k<=b;k=addDaysKey(k,1))if(isWeekdayKey(k))n++;return n;}
function offWeekdaysIn(id,a,b){let n=0;
  for(let k=a;k<=b;k=addDaysKey(k,1))if(isWeekdayKey(k)&&timeOff.some(t=>t.empId===id&&t.status==='approved'&&k>=t.start&&k<=t.end))n++;
  return n;}
function hoursCheckFor(id,c){
  c=c||hoursCheck; const worked=periodMs(id,{start:c.start,end:c.end});
  const W=weekdaysIn(c.start,c.end),off=offWeekdaysIn(id,c.start,c.end);
  const reqH=W?c.hours*(W-off)/W:c.hours;
  return {worked,reqH,off,ok:worked>=Math.round(reqH*HR)};
}
function hoursCheckBar(hc,nMet,nShort){
  const v=hc||{start:'',end:'',hours:''};
  const summary=hc?`<div class="hc-sum"><b>${fmtDayKeyYear(hc.start)} – ${fmtDayKeyYear(hc.end)}</b> · ${fmtHrs(hc.hours)} required
      <span class="mini">(lowered for approved weekday time off)</span>
      <span class="hc-count"><span class="hc-light ok"><i></i>${nMet} met</span><span class="hc-light no"><i></i>${nShort} short</span></span></div>`:'';
  return `<div class="hc-bar"><span class="ml hc-title">Hours check</span>
      <div class="field"><label>From</label><input type="date" id="hcStart" value="${v.start}"></div>
      <div class="field"><label>To</label><input type="date" id="hcEnd" value="${v.end}"></div>
      <div class="field"><label>Required hours</label><input type="number" id="hcHours" min="0" step="0.25" value="${v.hours}" placeholder="20" onkeydown="if(event.key==='Enter')runHoursCheck()"></div>
      <button class="btn btn-primary btn-sm hc-pill" onclick="runHoursCheck()">Check</button>
      ${hc?'<button class="btn btn-line btn-sm hc-pill" onclick="hoursCheck=null;render()">Clear</button>':''}</div>
    <div class="err" id="hcErr"></div>${summary}`;
}
function runHoursCheck(){
  if(!canManage(currentUser))return;
  const a=document.getElementById('hcStart').value,b=document.getElementById('hcEnd').value;

  if(!a||!b){err.textContent='Pick a From and To date.';return;}
  if(b<a){err.textContent='The To date must be on or after the From date.';return;}
  if(!(h>0)){err.textContent='Enter the required hours (more than 0).';return;}
  hoursCheck={start:a,end:b,hours:h};render();

/* ================= TIME OFF TRACKER (#7) =================
   4 weeks = 20 workdays (Mon–Fri) of unpaid time off per calendar year, reset every Jan 1 (company time).
   Only APPROVED time off counts. Leaders mark each one Regular or Emergency/sick; emergency days
   don't count against the 20 and appear only in the red bar, which only managers/co-managers see. */
const PTO_DAYS=20;
async function loadTimeOffCats(){
  const {data,error}=await sb.from('time_off_categories').select('time_off_id,category');
  if(error)throw error;
  const m={};(data||[]).forEach(r=>{m[r.time_off_id]=r.category;});timeOffCat=m;
}
function offCat(id){return timeOffCat[String(id)]==='emergency'?'emergency':'regular';}
function offTypePicker(elId,value,onchange,short){
  return `<select class="role-sel${short?' oh-sel':''}" id="${elId}" ${onchange?`onchange="${onchange}"`:''}>
    <option value="regular" ${value!=='emergency'?'selected':''}>${short?'Regular':'Regular — counts toward the 4 weeks'}</option>
    <option value="emergency" ${value==='emergency'?'selected':''}>${short?'Emergency / sick':'Emergency / sick — doesn\'t count'}</option></select>`;
}
async function setOffType(id,cat){
  if(!canManage(currentUser))return true;
  const t=timeOff.find(x=>x.id===id);
  if(live()){
    const {error}=await sb.from('time_off_categories').upsert({time_off_id:String(id),user_id:t?t.empId:null,category:cat,set_by:currentUser.id,set_at:new Date().toISOString()});
    if(error){toast('Type not saved: '+error.message);return false;}
  }
  timeOffCat[String(id)]=cat;return true;
}
async function changeOffType(id,el){if(await setOffType(id,el.value)){render();toast('Marked '+(el.value==='emergency'?'emergency / sick':'regular'));}}
function ptoYear(){const y=todayKey().slice(0,4);return {y,a:y+'-01-01',b:y+'-12-31'};}
/* weekdays in this year's approved time off, split by type and by used (date has arrived) vs upcoming */
function offDaysByCat(id){
  const {a,b}=ptoYear(),today=todayKey(),reg=new Set(),em=new Set();
  timeOff.filter(t=>t.empId===id&&t.status==='approved').forEach(t=>{
    const bucket=offCat(t.id)==='emergency'?em:reg;
    const s0=t.start<a?a:t.start,e0=t.end>b?b:t.end;
    for(let k=s0;k<=e0;k=addDaysKey(k,1))if(isWeekdayKey(k))bucket.add(k);
  });
  em.forEach(k=>reg.delete(k));   /* a day marked emergency never also counts as regular */
  const split=set=>{let used=0,up=0;set.forEach(k=>k<=today?used++:up++);return {used,up};};
  const r=split(reg),e=split(em);
  return {regular:reg.size,emergency:em.size,regUsed:r.used,regUp:r.up,emUsed:e.used,emUp:e.up};
}
function daysWord(n){return n+' day'+(n===1?'':'s');}
function ptoBar(used,up,cls){
  const u=Math.min(100,used/PTO_DAYS*100),p=Math.min(100-u,up/PTO_DAYS*100);
  return `<div class="pto-bar ${cls}"><span class="seg-used" style="width:${u}%"></span><span class="seg-up" style="width:${p}%"></span></div>`;
}
function timeOffBlocks(id,showRed){
  const d=offDaysByCat(id),{y}=ptoYear(),left=PTO_DAYS-d.regular;
  const main=`<div class="pto-block click-stat" onclick="openTimeOffHistory('${id}','regular')" title="See time off history">
      <div class="k">Time off · ${y}</div>${ptoBar(d.regUsed,d.regUp,left<0?'over':'')}
      <div class="pto-txt"><b>${daysWord(Math.max(0,left))} left</b>${d.regUp?` <span class="pto-up">(${daysWord(d.regUp)} upcoming)</span>`:''}
        · ${d.regUsed} used${left<0?` · <span class="pto-over">over by ${-left}</span>`:''}</div></div>`;
  const red=showRed?`<div class="pto-block click-stat" onclick="openTimeOffHistory('${id}','emergency')" title="See emergency / sick history">
      <div class="k">Emergency / sick · ${y}</div>${ptoBar(d.emUsed,d.emUp,'red')}
      <div class="pto-txt"><b>${daysWord(d.emergency)}</b>${d.emUp?` <span class="pto-up red">(${daysWord(d.emUp)} upcoming)</span>`:''} · no limit · leaders only</div></div>`:'';
  return main+red;
}
function timeOffStat(id,mgr){return `<div class="stat pto-stat">${timeOffBlocks(id,mgr)}</div>`;}
/* history of one person's time off this year, for one type */
function openTimeOffHistory(id,cat){
  const mgr=canManage(currentUser);
  if(!mgr&&id!==currentUser.id)return;
  if(cat==='emergency'&&!mgr)return;          /* emergency / sick history is leaders only */
  const e=employees.find(x=>x.id===id);if(!e)return;
  const {a,b,y}=ptoYear(),today=todayKey();
  const inYear=t=>t.end>=a&&t.start<=b;
  const approved=timeOff.filter(t=>t.empId===id&&t.status==='approved'&&inYear(t)&&offCat(t.id)===cat).sort((x,z)=>z.start.localeCompare(x.start));
  const wd=t=>{const s0=t.start<a?a:t.start,e0=t.end>b?b:t.end;let n=0;for(let k=s0;k<=e0;k=addDaysKey(k,1))if(isWeekdayKey(k))n++;return n;};
  const range=t=>t.start===t.end?fmtDayKeyYear(t.start):`${fmtDayKey(t.start)} – ${fmtDayKeyYear(t.end)}`;
  const state=t=>t.start>today?['up','Upcoming']:(t.end>today?['now','In progress']:['used','Used']);
  const row=t=>{const [c,l]=state(t);
    return `<div class="sh-row"><span class="oh-badge ${c}">${l}</span><div class="sh-main"><div class="sh-reason">${range(t)} · ${daysWord(wd(t))}</div>
      <div class="sh-date">${esc(t.note)||'—'}${mgr&&t.decidedByName?' · approved by '+esc(t.decidedByName):(mgr&&t.addedBy?' · added by '+esc(t.addedBy):'')}</div></div>
      ${mgr?offTypePicker('oh_'+t.id,offCat(t.id),`changeOffType('${t.id}',this).then(()=>openTimeOffHistory('${id}','${cat}'))`,true):''}</div>`;};
  const waiting=cat==='regular'?timeOff.filter(t=>t.empId===id&&t.status==='pending'&&inYear(t)).sort((x,z)=>x.start.localeCompare(z.start)):[];
  const d=offDaysByCat(id);
  const sum=cat==='regular'
    ?`${daysWord(Math.max(0,PTO_DAYS-d.regular))} left of ${PTO_DAYS} · ${d.regUsed} used${d.regUp?' · '+d.regUp+' upcoming':''}`
    :`${daysWord(d.emergency)} this year${d.emUp?' · '+d.emUp+' upcoming':''} · no limit`;
  document.getElementById('modalMount').innerHTML=`<div class="overlay" onclick="if(event.target===this)closeModal()"><div class="modal sv-modal">
    <h3>${cat==='regular'?'Time off':'Emergency / sick'} · ${y}</h3><p class="sub">${esc(e.name)} · ${sum}</p>
    <div class="sh-list">${approved.length?approved.map(row).join(''):`<div class="empty">No ${cat==='regular'?'time off':'emergency / sick days'} this year.</div>`}</div>
    ${waiting.length?`<div class="oh-wait-h">Awaiting approval · doesn't count yet</div>${waiting.map(t=>`<div class="sh-row"><span class="oh-badge wait">Pending</span><div class="sh-main"><div class="sh-reason">${range(t)} · ${daysWord(wd(t))}</div><div class="sh-date">${esc(t.note)||'—'}</div></div></div>`).join('')}`:''}
    <p class="sh-rule">Counts weekdays only. 4 weeks = ${PTO_DAYS} workdays per year, resetting Jan 1. Approved days are "upcoming" until the date arrives, then "used"${cat==='regular'?'; both count toward days left':''}.</p>
    <div class="modal-actions"><button class="btn btn-line btn-sm" onclick="closeModal()">Close</button></div></div></div>`;
}

/* ---------- LAPTOP BENEFIT: $400 after 4 months (start + 121 days), $100 after 1 year (start + 365) ---------- */
const LAP={r4:{amt:400,days:121,label:'4 months'},r1:{amt:100,days:365,label:'1 year'}};
function lapFromRow(r){return {id:r.id,userId:r.user_id||null,name:r.person_name||'',start:r.start_date||'',
  r4:r.r4_state||'pending',r4d:r.r4_date||'',r4x:r.r4_reimb||'',r1:r.r1_state||'pending',r1d:r.r1_date||'',r1x:r.r1_reimb||'',notes:r.notes||''};}
function normName(n){return (n||'').toLowerCase().replace(/["“”].*?["“”]/g,'').replace(/\s+/g,' ').trim();}
/* which account a laptop row belongs to: linked id, or an exact name match on the most recent row for that name */
function lapEmp(rec){
  if(rec.userId)return employees.find(e=>e.id===rec.userId)||null;
  const same=laptopRecs.filter(x=>normName(x.name)===normName(rec.name)&&!x.userId).sort((a,b)=>(b.start||'').localeCompare(a.start||''));
  if(same[0]!==rec)return null;
  return employees.find(e=>normName(e.name)===normName(rec.name))||null;
}
function lapFor(empId){return laptopRecs.find(r=>{const e=lapEmp(r);return e&&e.id===empId;})||null;}
function lapStart(rec){const e=lapEmp(rec);return (e&&detailsOf(e.id).start)||rec.start||'';}
function lapDue(rec,k){const s=lapStart(rec);return s?addDaysKey(s,LAP[k].days):'';}
function lapChip(rec,k){
  const st=rec[k],d=rec[k+'d'],due=lapDue(rec,k),t=todayKey();
  if(st==='received')return `<span class="lap-chip ok" title="Received">${d?fmtDayKeyYear(d):'Received'}</span>`;
  if(st==='na')return `<span class="lap-chip na">N/A</span>`;
  if(!due)return `<span class="lap-chip na">No start date</span>`;
  return due<=t?`<span class="lap-chip due" title="Qualified ${fmtDayKeyYear(due)} — not received yet">Due · ${fmtDayKeyYear(due)}</span>`
              :`<span class="lap-chip up">${fmtDayKeyYear(due)}</span>`;
}
function lapTotal(rec){return (rec.r4==='received'?400:0)+(rec.r1==='received'?100:0);}
/* Automatic reimbursements: when a qualifying date falls inside a pay period that ends on/after the rule date,
   add the $400 / $100 to that period once (people already paid are skipped). Only for active hourly staff. */
let lapAutoBusy=false;
async function runLaptopAuto(){
  if(lapAutoBusy||!canManage(currentUser))return; lapAutoBusy=true;
  try{
    for(const rec of laptopRecs){
      const e=lapEmp(rec); if(!e||!isActive(e)||isSalaried(e)||e.role==='manager')continue;
      for(const k of ['r4','r1']){
        if(rec[k]!=='pending'||rec[k+'x'])continue;
        const due=lapDue(rec,k); if(!due)continue;
        const p=payPeriods.find(x=>due>=x.start&&due<=x.end&&x.end>=PERIOD_RULE_FROM); if(!p)continue;
        const label=`Laptop benefit — ${LAP[k].label}`;
        if(periodReimb.some(r=>r.empId===e.id&&r.label===label)){rec[k]='received';continue;}
        if(live()){
          /* claim it first so two leaders signed in at once can't both add it */
          const col=k+'_reimb', {data:cl,error:ce}=await sb.from('laptop_benefits').update({[col]:'claim:'+currentUser.id}).eq('id',rec.id).is(col,null).eq(k+'_state','pending').select();
          if(ce||!cl||!cl.length)continue;
          const {data,error}=await sb.from('reimbursements').insert({period_id:p.id,user_id:e.id,label,amount:LAP[k].amt}).select().single();
          if(error){await sb.from('laptop_benefits').update({[col]:null}).eq('id',rec.id);continue;}
          periodReimb.push({id:data.id,periodId:p.id,empId:e.id,label,amount:LAP[k].amt});
          await sb.from('laptop_benefits').update({[col]:data.id,[k+'_state']:'received',[k+'_date']:p.end,user_id:e.id,updated_at:new Date().toISOString()}).eq('id',rec.id);
          rec[k+'x']=data.id;
        }else{
          periodReimb.push({id:'pr'+Date.now()+k,periodId:p.id,empId:e.id,label,amount:LAP[k].amt});
          rec[k+'x']='auto';
        }
        rec[k]='received';rec[k+'d']=p.end;rec.userId=e.id;
        logAudit({ts:Date.now(),manager:'Automatic',emp:e.name,field:'Reimbursement added',old:'—',new:label+' · '+money(LAP[k].amt),reason:'Laptop benefit qualifying date '+fmtDayKeyYear(due)});
      }
    }
  }finally{lapAutoBusy=false;}
}

/* ---------- CHARTS (OTG purples, validated: #7D4E95 solid + #C08AD6 dashed; one y-axis; hover crosshair) ---------- */
const CHARTS={}; let chartSeq=0;
const CH_MAIN='#7D4E95', CH_AVG='#C08AD6', CH_BAR='#9B64B1';
function niceMax(v){if(v<=0)return 1;const p=Math.pow(10,Math.floor(Math.log10(v))),f=v/p;return (f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10)*p;}
function lineChart(cfg){
  const id='ch'+(++chartSeq), W=760,H=230,L=52,R=96,T=14,B=28, n=cfg.labels.length;
  if(!n)return '<div class="empty">No data yet.</div>';
  const all=cfg.series.flatMap(s=>s.values).filter(v=>v!=null);
  const ymax=niceMax(Math.max(...all,0)*1.08), x=i=>L+(n===1?(W-L-R)/2:i*(W-L-R)/(n-1)), y=v=>T+(H-T-B)*(1-v/ymax);
  CHARTS[id]={...cfg,x,y,W,H,L,R,T,B,n};
  const grid=[0,.25,.5,.75,1].map(f=>{const v=ymax*f;return `<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" class="ch-grid"/><text x="${L-8}" y="${y(v)+4}" class="ch-ax" text-anchor="end">${cfg.yfmt(v)}</text>`;}).join('');
  const step=Math.max(1,Math.ceil(n/7)), xl=cfg.labels.map((k,i)=>(i%step===0||i===n-1)&&!(i!==n-1&&n-1-i<step/2)?`<text x="${x(i)}" y="${H-8}" class="ch-ax" text-anchor="middle">${cfg.xfmt(k)}</text>`:'').join('');
  /* direct labels at the line ends, nudged apart so they never overlap */
  const ends=cfg.series.map((s,si)=>({si,y:y(s.values[s.values.length-1]||0)+4})).sort((a,b)=>a.y-b.y);
  for(let k=1;k<ends.length;k++)if(ends[k].y-ends[k-1].y<13)ends[k].y=ends[k-1].y+13;
  const endY={};ends.forEach(e=>endY[e.si]=e.y);
  const lines=cfg.series.map((s,si)=>{const pts=s.values.map((v,i)=>v==null?null:`${x(i).toFixed(1)},${y(v).toFixed(1)}`).filter(Boolean).join(' ');
    const last=s.values.length-1;
    return `<polyline points="${pts}" fill="none" stroke="${s.color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" ${s.dash?'stroke-dasharray="5 4"':''}/>`
      +(n<=40?s.values.map((v,i)=>v==null?'':`<circle cx="${x(i)}" cy="${y(v)}" r="3" fill="${s.color}" stroke="#fff" stroke-width="2"/>`).join(''):'')
      +`<text x="${x(last)+8}" y="${endY[si]}" class="ch-lbl">${esc(s.short||s.name)}</text>`;}).join('');
  const legend=cfg.series.length>1?`<div class="ch-legend">${cfg.series.map(s=>`<span><i style="border-top:2px ${s.dash?'dashed':'solid'} ${s.color}"></i>${esc(s.name)}</span>`).join('')}</div>`:'';
  return `${legend}<div class="ch-wrap" id="${id}w"><svg viewBox="0 0 ${W} ${H}" class="ch-svg" role="img" aria-label="${esc(cfg.title||'chart')}">${grid}${xl}${lines}
      <line id="${id}x" class="ch-cross" y1="${T}" y2="${H-B}" x1="0" x2="0" style="display:none"/>
      <rect x="${L}" y="${T}" width="${W-L-R}" height="${H-T-B}" fill="transparent" onmousemove="chartMove(event,'${id}')" onmouseleave="chartLeave('${id}')"/></svg>
    <div class="ch-tip" id="${id}t"></div></div>`;
}
function chartMove(ev,id){
  const c=CHARTS[id]; if(!c)return;
  const svg=ev.currentTarget.ownerSVGElement, r=svg.getBoundingClientRect(), sx=(ev.clientX-r.left)*c.W/r.width;
  let i=Math.round((sx-c.L)/((c.W-c.L-c.R)/Math.max(1,c.n-1))); i=Math.max(0,Math.min(c.n-1,i));
  const cr=document.getElementById(id+'x'); cr.setAttribute('x1',c.x(i)); cr.setAttribute('x2',c.x(i)); cr.style.display='';
  const tip=document.getElementById(id+'t'); tip.innerHTML='';
  const h=document.createElement('div');h.className='ch-tip-h';h.textContent=c.xfmt(c.labels[i],true);tip.appendChild(h);
  c.series.forEach(s=>{const row=document.createElement('div');row.className='ch-tip-r';
    const k=document.createElement('i');k.style.borderTop=`2px ${s.dash?'dashed':'solid'} ${s.color}`;
    const b=document.createElement('b');b.textContent=s.values[i]==null?'—':c.yfmt(s.values[i],true);
    const t=document.createElement('span');t.textContent=s.name;row.append(k,b,t);tip.appendChild(row);});
  const px=c.x(i)*r.width/c.W; tip.style.display='block';
  tip.style.left=Math.min(r.width-tip.offsetWidth-4,Math.max(4,px+12))+'px';
}
function chartLeave(id){const t=document.getElementById(id+'t'),x=document.getElementById(id+'x');if(t)t.style.display='none';if(x)x.style.display='none';}

function tpFromRow(r){return {id:r.id,year:Number(r.term_year),term:r.term,name:r.person_name,period:r.period_start,amt:Number(r.amount)||0,inTotal:r.in_total!==false};}
/* every pay amount for a term: imported entries win; otherwise filled from the app's Payroll (hours × rate + reimbursements) */
function termData(year,term){
  const cells={}, periods=new Set();
  termPay.filter(t=>t.year===year&&(!term||t.term===term)).forEach(t=>{periods.add(t.period);(cells[t.name]=cells[t.name]||{})[t.period]={amt:t.amt,src:'import',inTotal:t.inTotal,id:t.id};});
  payPeriods.filter(p=>+p.start.slice(0,4)===year&&(!term||termOf(p.start)===term)&&p.start<=todayKey()).forEach(p=>{
    periodStaff(p).forEach(e=>{
      const nm=Object.keys(cells).find(n=>normName(n)===normName(e.name))||e.name;
      if(cells[nm]&&cells[nm][p.start])return;
      const amt=(paidMs(e.id,p)/HR)*e.rate+periodReimb.filter(r=>r.periodId===p.id&&r.empId===e.id).reduce((t,r)=>t+r.amount,0);
      if(amt<=0)return;
      periods.add(p.start);(cells[nm]=cells[nm]||{})[p.start]={amt:Math.round(amt*100)/100,src:'payroll',inTotal:true};
    });});
  const ps=[...periods].sort(), names=Object.keys(cells).sort((a,b)=>lastName(a).localeCompare(lastName(b))||a.localeCompare(b));
  const totals=ps.map(k=>names.reduce((t,n)=>{const c=cells[n][k];return t+(c&&c.inTotal?c.amt:0);},0));
  const personTot=names.map(n=>ps.reduce((t,k)=>{const c=cells[n][k];return t+(c&&c.inTotal?c.amt:0);},0));
  return {ps,names,cells,totals,personTot,grand:totals.reduce((a,b)=>a+b,0)};
}

  const google=authProvider==='google';
  const chk=(ok,t,how)=>`<div class="sec-chk ${ok===true?'ok':ok===false?'no':'todo'}"><span class="sec-chk-i">${ok===true?'&#10003;':ok===false?'!':'&#9675;'}</span><div><b>${t}</b><span>${how}</span></div></div>`;
  const rows=list.length?list.map(e=>`<div class="sec-ev ${e.reviewed?'done':''}"><span class="sec-sev ${e.severity}">${SEV_LABEL[e.severity]||e.severity}</span>
      <div class="sec-ev-m"><div class="sec-ev-t">${esc(e.title)}</div><div class="sec-ev-d">${esc(e.detail)}</div>
        <div class="sec-ev-w">${fmtDay(e.at)} · ${fmtTime(e.at)}${e.actor?' · by '+esc(e.actor):''}${e.reviewed&&e.by?' · reviewed by '+esc(e.by):''}</div></div>
      ${e.reviewed?'':`<button class="btn btn-line btn-xs" onclick="reviewSec(${e.id})">Mark reviewed</button>`}</div>`).join('')
    :`<div class="empty">${secShowAll?'No alerts yet.':'Nothing to review — all clear.'}</div>`;
  return pageHead('Security','owners only')
    +`<div class="sec first"><div class="sec-top">
        <div class="stat"><div class="k">Open alerts</div><div class="v">${open.length}</div></div>
        <div class="stat"><div class="k">High</div><div class="v sec-h">${cnt('high')}</div></div>
        <div class="stat"><div class="k">Medium</div><div class="v sec-m">${cnt('medium')}</div></div>
        <div class="stat"><div class="k">Last scan</div><div class="v sec-t">${secLastRun?fmtDay(secLastRun)+' · '+fmtTime(secLastRun):'not yet'}</div></div>
        <button class="btn btn-primary btn-sm sec-run" onclick="runSecScan()" ${secBusy?'disabled':''}>${secBusy?'Scanning…':'Run scan now'}</button></div>
      <div class="sec-head"><h2>Alerts</h2><span class="sec-tabs"><button class="an-chip ${!secShowAll?'on':''}" onclick="secShowAll=false;render()">To review</button><button class="an-chip ${secShowAll?'on':''}" onclick="secShowAll=true;render()">All</button></span>
        ${open.length>1?'<button class="linkish" onclick="reviewAllSec()">Mark all reviewed</button>':''}</div>
      <div class="sec-list">${rows}</div></div>
      <div class="sec"><div class="sec-head"><h2>Setup checklist</h2><span class="ml meta">steps that live outside the app</span></div>
        <div class="sec-chks">
          ${chk(google?true:null,'Sign in with Google',google?'You\'re signed in with Google right now.':'Turn on the Google provider in Supabase, then sign in with Google once.')}
          ${chk(null,'Require Google 2-Step Verification','Google Admin (admin.google.com) → Security → Authentication → 2-Step Verification → turn on enforcement for everyone.')}
          ${chk(null,'Turn off password sign-in','After everyone has signed in with Google once: Supabase → Authentication → Sign In / Providers → Email → turn off.')}
          ${chk(null,'Breach alerts for @onetelgem.com','haveibeenpwned.com → Domain search → verify onetelgem.com to get emailed if company addresses show up in a breach.')}
          ${chk(null,'Google suspicious sign-in alerts','Google Admin → Security → Alert center — Google already flags suspicious sign-ins and password leaks for company accounts.')}
        </div></div>`;
}
async function runSecScan(){
  if(!live()){toast('Scans run on the live site');return;}
  secBusy=true;render();
  try{const {data,error}=await sb.rpc('otg_run_watchdog');
    if(error)toast('Scan failed: '+(/otg_run_watchdog|schema cache|function/i.test(error.message)?'run the Build 44 SQL in Supabase first':error.message));
    else{await loadSecurity();toast(data?data+' new alert'+(data>1?'s':''):'Scan done — nothing new');}}
  finally{secBusy=false;render();paintUserMenu();}
}
async function reviewSec(id){
  const e=secEvents.find(x=>x.id===id);if(!e)return;
  if(live()){const {error}=await sb.from('security_events').update({reviewed:true,reviewed_by_name:currentUser.name,reviewed_at:new Date().toISOString()}).eq('id',id);
    if(error){toast('Not saved: '+error.message);return;}}
  e.reviewed=true;e.by=currentUser.name;render();paintUserMenu();
}
async function reviewAllSec(){
  const ids=secEvents.filter(e=>!e.reviewed).map(e=>e.id);if(!ids.length)return;
  if(live()){const {error}=await sb.from('security_events').update({reviewed:true,reviewed_by_name:currentUser.name,reviewed_at:new Date().toISOString()}).in('id',ids);
    if(error){toast('Not saved: '+error.message);return;}}
  secEvents.forEach(e=>{if(!e.reviewed){e.reviewed=true;e.by=currentUser.name;}});render();paintUserMenu();toast('All marked reviewed');
}

/* ================= CORRECTIONS ================= */
function tsToInput(ts){const d=new Date(ts);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())+'T'+pad(d.getHours())+':'+pad(d.getMinutes());}
function inputToTs(v){return v?new Date(v).getTime():null;}
function openAdd(empId){
  const e=employees.find(x=>x.id===empId),base=tsToInputTZ(Date.now(),tzOf(empId));
  document.getElementById('modalMount').innerHTML=`<div class="overlay" onclick="if(event.target===this)closeModal()"><div class="modal">
    <h3>Add a missing day</h3><p class="sub">${e.name} · times in ${tzLabel(tzOf(empId))}</p>
    <div class="field"><label>Clock in</label><input type="datetime-local" id="edIn" value="${base}"></div>
    <label class="chk-line"><input type="checkbox" id="edActive" onchange="toggleAddActive()"> Currently clocked in <span class="opt">no clock-out · today only</span></label>
    <div class="field" id="edOutWrap"><label>Clock out</label><input type="datetime-local" id="edOut" value="${base}"></div>
    <div class="field"><label>Reason <span class="req">required</span></label><input type="text" id="edReason" placeholder="Employee forgot to clock in"></div>
    <div class="err" id="edErr"></div>
    <div class="modal-actions"><button class="btn btn-line btn-sm" onclick="closeModal()">Cancel</button>
    <button class="btn btn-primary btn-sm" onclick="saveAdd('${empId}')">Add day</button></div></div></div>`;
}
function closeModal(){document.getElementById('modalMount').innerHTML='';}
function toast(m){const t=document.getElementById('toastMount');t.innerHTML=`<div class="toast">${m}</div>`;setTimeout(()=>{t.innerHTML='';},2400);}
async function saveAdd(empId){
  const err=document.getElementById('edErr'),reason=document.getElementById('edReason').value.trim();
  if(!reason){err.textContent='Add a reason — it goes in the change log.';return;}
  const active=document.getElementById('edActive')&&document.getElementById('edActive').checked;
  const tz=tzOf(empId);
  const nIn=inputToTsTZ(document.getElementById('edIn').value,tz);
  const nOut=active?null:inputToTsTZ(document.getElementById('edOut').value,tz);
  if(!nIn){err.textContent='Clock-in time is required.';return;}
  if(active){
    if(companyDateKey(nIn)!==todayKey()){err.textContent='“Currently clocked in” only works for today.';return;}
  }else{
    if(!nOut&&companyDateKey(nIn)!==todayKey()){err.textContent='Clock-out is required for a past day.';return;}
    if(nOut&&nOut<nIn){err.textContent='Clock-out must be after clock-in.';return;}
  }
  if(live()){
    const {data,error}=await sb.from('shifts').insert({user_id:empId,clock_in:new Date(nIn).toISOString(),clock_out:nOut?new Date(nOut).toISOString():null,edited:true}).select().single();
    if(error){err.textContent='Could not save: '+error.message;return;}
    upsertShift(shiftFromRow(data));
  }else{
    shifts.push({id:nid(),empId,clockIn:nIn,clockOut:nOut,edited:true});
  }
  logAudit({ts:Date.now(),manager:currentUser.name,emp:nameOf(empId),field:'Day added',old:'—',new:fmtTimeTZ(nIn,tz)+' – '+(nOut?fmtTimeTZ(nOut,tz):'currently clocked in'),reason});
  closeModal();render();toast('Day added');
}
function toggleAddActive(){
  const on=document.getElementById('edActive').checked;
  document.getElementById('edOutWrap').classList.toggle('hide',on);
}
function openEditDay(shiftId){
  const s=shifts.find(x=>x.id===shiftId);if(!s)return;
  const e=employees.find(x=>x.id===s.empId);
  const tz=tzOf(s.empId),inToday=companyDateKey(s.clockIn)===todayKey();
  const outHint=inToday?'<span class="opt">leave blank if still clocked in</span>':'<span class="opt">required for a past day</span>';
  document.getElementById('modalMount').innerHTML=`<div class="overlay" onclick="if(event.target===this)closeModal()"><div class="modal">
    <h3>Edit day</h3><p class="sub">${e.name} · ${fmtCoDay(companyDateKey(s.clockIn))} · times in ${tzLabel(tz)}</p>
    <div class="field"><label>Clock in</label><input type="datetime-local" id="edIn" value="${tsToInputTZ(s.clockIn,tz)}"></div>
    <div class="field"><label>Clock out ${outHint}</label><input type="datetime-local" id="edOut" value="${s.clockOut?tsToInputTZ(s.clockOut,tz):''}"></div>
    <div class="err" id="edErr"></div>
    <div class="modal-actions edit-actions"><button class="del-shift" title="Delete this time record" onclick="deleteShift('${shiftId}')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/></svg></button>
    <span class="ea-right"><button class="btn btn-line btn-sm" onclick="closeModal()">Cancel</button>
    <button class="btn btn-primary btn-sm" onclick="saveEditDay('${shiftId}')">Save changes</button></span></div></div></div>`;
}
async function saveEditDay(shiftId){
  const s=shifts.find(x=>x.id===shiftId);if(!s)return;
  const err=document.getElementById('edErr');
  const tz=tzOf(s.empId);
  const nIn=inputToTsTZ(document.getElementById('edIn').value,tz),nOut=inputToTsTZ(document.getElementById('edOut').value,tz);
  if(!nIn){err.textContent='Clock-in time is required.';return;}
  const inToday=companyDateKey(nIn)===todayKey();
  if(!nOut&&!inToday){err.textContent='Clock-out is required for a past day.';return;}   /* only today's shift may stay open */
  if(nOut&&nOut<nIn){err.textContent='Clock-out must be after clock-in.';return;}
  const oldStr=fmtTimeTZ(s.clockIn,tz)+' – '+(s.clockOut?fmtTimeTZ(s.clockOut,tz):'active');
  const newStr=fmtTimeTZ(nIn,tz)+' – '+(nOut?fmtTimeTZ(nOut,tz):'active');
  if(live()){
    const {error}=await sb.from('shifts').update({clock_in:new Date(nIn).toISOString(),clock_out:nOut?new Date(nOut).toISOString():null,edited:true}).eq('id',shiftId);
    if(error){err.textContent='Could not save: '+error.message;return;}
  }
  s.clockIn=nIn;s.clockOut=nOut||null;s.edited=true;
  logAudit({ts:Date.now(),manager:currentUser.name,emp:nameOf(s.empId),field:'Time edited',old:oldStr,new:newStr,reason:''});
  closeModal();render();toast('Day updated');
}
async function deleteShift(shiftId){
  const s=shifts.find(x=>x.id===shiftId);if(!s)return;
  const err=document.getElementById('edErr');
  const oldStr=fmtTimeFor(s.empId,s.clockIn)+' – '+(s.clockOut?fmtTimeFor(s.empId,s.clockOut):'active');
  if(live()){
    const {error}=await sb.from('shifts').delete().eq('id',shiftId);
    if(error){if(err)err.textContent='Could not delete: '+error.message;return;}
  }
  shifts=shifts.filter(x=>x.id!==shiftId);
  logAudit({ts:Date.now(),manager:currentUser.name,emp:nameOf(s.empId),field:'Record deleted',old:oldStr,new:'—',reason:''});
  closeModal();render();toast('Time record deleted');
}

/* ================= CLOCK ================= */
async function clockIn(){
  const ts=Date.now();
  if(live()){
    const {data,error}=await sb.from('shifts').insert({user_id:currentUser.id,clock_in:new Date(ts).toISOString(),edited:false}).select().single();
    if(error){toast('Could not clock in: '+error.message);return;}
    upsertShift(shiftFromRow(data));
  }else{
    shifts.push({id:nid(),empId:currentUser.id,clockIn:ts,clockOut:null,edited:false});
  }
  render();
  if(isOutsideSchedule(currentUser.id,ts))askNotify(ts);
}
function askNotify(ts){
  const slots=slotsForDate(currentUser.id,ts);
  const line=slots.length?`You're scheduled ${slots.map(sl=>fmtHM(sl.start)+' – '+fmtHM(sl.end)).join(', ')} today.`:`You're not scheduled to work today.`;
  document.getElementById('modalMount').innerHTML=`<div class="overlay"><div class="modal">
    <h3>Working outside your schedule</h3><p class="sub">Clocked in ${fmtTimeFor(currentUser.id,ts)}</p>
    <p style="margin:0 0 20px;font-size:14px">${line} Send your manager a notice so they know?</p>
    <div class="field"><label>Reason (optional)</label><input type="text" id="nfReason" placeholder="Covering for Devin"></div>
    <div class="modal-actions"><button class="btn btn-line btn-sm" onclick="closeModal()">Not now</button>
      <button class="btn btn-primary btn-sm" onclick="sendNotice(${ts})">Send notice</button></div></div></div>`;
}
function sendNotice(ts){
  const r=document.getElementById('nfReason').value.trim();
  if(live()){
    sb.from('notices').insert({user_id:currentUser.id,ts:new Date(ts).toISOString(),reason:r}).select().single().then(({data,error})=>{
      if(error){toast('Notice not sent: '+error.message);return;}
      if(!notices.some(n=>n.id===data.id)){notices.push(noticeFromRow(data));render();}
    });
  }else{
    notices.push({id:'n'+Date.now(),empId:currentUser.id,ts,reason:r});
  }
  closeModal();render();toast('Notice sent to your manager');
}
async function clockOut(){
  const s=openShift(currentUser.id);if(!s)return;
  const out=Date.now();
  if(live()){
    const {error}=await sb.from('shifts').update({clock_out:new Date(out).toISOString()}).eq('id',s.id);
    if(error){toast('Could not clock out: '+error.message);return;}
  }
  s.clockOut=out;if(breakActive)endBreak(true);
  render();promptWorkLog();
}
function promptWorkLog(){
  const dk=todayKey(), text=logText(currentUser.id,dk);
  document.getElementById('modalMount').innerHTML=`<div class="overlay"><div class="modal">
    <h3>Before you go</h3><p class="sub">Work log · ${fmtDayKey(dk)}</p>
    <div class="field"><label>What did you work on today? <span class="opt">one running note — add to it any time</span></label>
      <textarea class="log-area" id="wlInput" rows="5" placeholder="What did you work on? You can keep adding to this today or later.">${esc(text)}</textarea></div>
    <div class="modal-actions"><button class="btn btn-line btn-sm" onclick="wlSkip()">Skip for now</button>
      <button class="btn btn-primary btn-sm" onclick="wlDone()">Save log</button></div></div></div>`;
}
async function wlSkip(){
  const el=document.getElementById('wlInput');
  if(el){const v=el.value.trim(); if(v)await saveLogText(currentUser.id,todayKey(),v);}   /* keep whatever they typed */
  logReminder=!logText(currentUser.id,todayKey()).trim();
  closeModal();render();
}
async function wlDone(){
  const el=document.getElementById('wlInput'), v=el?el.value.trim():'';
  const ok=await saveLogText(currentUser.id,todayKey(),v);
  if(!ok)return;
  logReminder=!v;
  closeModal();render();toast(v?'Work log saved':'Work log still empty');
}
function breakKey(){return currentUser.id+'|'+dateKey(now);}
function breakRemaining(){return Math.max(0,BREAK_BUDGET-(breakUsed[breakKey()]||0));}
function startBreak(){
  const rem=breakRemaining();
  if(rem<=0){toast('Your 30-minute break is used up for today');return;}
  breakActive=true;breakEndsAt=Date.now()+rem;startCountdown();render();
}
function endBreak(silent){
  if(breakEndsAt!=null){
    /* used = full budget minus whatever time was still left on the clock */
    breakUsed[breakKey()]=BREAK_BUDGET-Math.max(0,breakEndsAt-Date.now());
  }
  breakActive=false;breakEndsAt=null;clearInterval(breakTimer);breakTimer=null;stopAlarm();if(!silent)render();
}
function startCountdown(){clearInterval(breakTimer);breakTimer=setInterval(()=>{
  if(!breakEndsAt){clearInterval(breakTimer);return;}
  const rem=breakEndsAt-Date.now(),el=document.getElementById('brkCount');
  if(el)el.textContent=fmtWatch(rem);
  if(rem<=0){clearInterval(breakTimer);breakTimer=null;fireAlarm();}},250);}

/* ================= ALARM ================= */
function ensureAudio(){if(!audioCtx)audioCtx=new (window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume();return audioCtx;}
function beep(f,st,du){const c=ensureAudio(),o=c.createOscillator(),g=c.createGain();o.type='square';o.frequency.value=f;
  o.connect(g);g.connect(c.destination);const t=c.currentTime+st;g.gain.setValueAtTime(0.0001,t);
  g.gain.exponentialRampToValueAtTime(0.22,t+0.02);g.gain.exponentialRampToValueAtTime(0.0001,t+du);o.start(t);o.stop(t+du+0.02);}
function pattern(){beep(880,0,0.16);beep(1180,0.22,0.16);beep(880,0.44,0.16);}
function testAlarm(){ensureAudio();pattern();}
function fireAlarm(){ensureAudio();pattern();alarmLoop=setInterval(pattern,1400);
  document.getElementById('alarmMount').innerHTML=`<div class="alarm"><b>Break is over</b>
    <span class="ml" style="color:#fff">30 minutes elapsed</span>
    <button class="btn btn-sm o" onclick="stopAlarm()">Dismiss</button>
    <button class="btn btn-sm" onclick="endBreak();stopAlarm()">Back to work</button></div>`;}
function stopAlarm(){if(alarmLoop){clearInterval(alarmLoop);alarmLoop=null;}document.getElementById('alarmMount').innerHTML='';}

/* ================= BOOT ================= */
setInterval(()=>{
  if(!currentUser)return;
  const s=openShift(currentUser.id);
  const el=document.getElementById('liveClock');if(el&&s)el.textContent=fmtWatch(netMs(s));
  const wc=document.getElementById('wClock');if(wc)wc.textContent=s?fmtWatch(netMs(s)):'00:00:00';
  const wn=document.getElementById('wNow');if(wn)wn.textContent=new Date().toLocaleTimeString();
},1000);
initAuth();
</script>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>otg — Timecard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --brand:#9B64B1; --brand-dark:#6F4783; --brand-tint:#F1E9F5;
    --ink:#000000; --paper:#F7F5F9; --card:#FFFFFF;
    --line:#E9E4EF; --muted:#756E80; --text:#1A1522;
    --warn:#B67A1E;
    --danger:#C0281F; --danger-tint:#FDECEC;
    --shadow:0 1px 2px rgba(20,16,25,.05),0 10px 28px rgba(20,16,25,.06);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{background:var(--paper);color:var(--text);font-family:"Inter",system-ui,sans-serif;font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
  .mono{font-family:"IBM Plex Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}
  h1,h2,h3{font-family:"Space Grotesk",sans-serif;letter-spacing:-.01em}
  button{font-family:inherit;cursor:pointer}
  :focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:4px}
  .hide{display:none!important}
  .wordmark{font-family:"Space Grotesk";font-weight:700;letter-spacing:-.02em}
  .wordmark .g{color:var(--brand)}

  /* ---------- Home / login ---------- */
  .login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:28px;background:#000}
  .login-inner{width:100%;max-width:400px;color:#fff}
  .logo-mark{max-width:330px;margin:0 auto 4px}
  .logo-mark svg{width:100%;height:auto;display:block}
  .login-inner .sub{color:#B9AEC4;font-size:13.5px;margin:10px 2px 20px;text-align:center}
  .demo-label{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:#8E859E;margin:22px 0 10px;font-weight:600}
  .demo-acc{display:flex;flex-direction:column;gap:8px}
  .demo-btn{display:flex;align-items:center;justify-content:space-between;gap:12px;text-align:left;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.12);border-radius:11px;padding:12px 14px;color:#fff;transition:border-color .12s,background .12s,transform .05s}
  .demo-btn:hover{border-color:var(--brand);background:rgba(155,100,177,.14)}
  .demo-btn:active{transform:translateY(1px)}
  .demo-btn .who{font-weight:600}
  .demo-btn .role{font-size:11px;font-weight:600;padding:3px 9px;border-radius:20px}
  .role.employee{background:rgba(155,100,177,.22);color:#DABEE8}
  .role.manager{background:rgba(255,255,255,.13);color:#EFE9F5}
  .avatar{width:30px;height:30px;border-radius:50%;flex:none;display:grid;place-items:center;color:#fff;font-size:12px;font-weight:600;font-family:"Space Grotesk"}
  .notice-dark{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.12);border-radius:10px;padding:11px 14px;font-size:12.5px;color:#C9C1D6}

  /* ---------- Shell ---------- */
  .topbar{background:#000;color:#fff;position:sticky;top:0;z-index:20}
  .topbar-in{max-width:1080px;margin:0 auto;padding:13px 20px;display:flex;align-items:center;gap:14px}
  .topbar .wordmark{font-size:22px;color:#fff}
  .spacer{flex:1}
  .whoami{display:flex;align-items:center;gap:9px;font-size:13.5px}
  .whoami .role{font-size:10.5px;padding:3px 9px;border-radius:20px}
  .whoami .role.manager{background:rgba(255,255,255,.14);color:#fff}
  .whoami .role.employee{background:rgba(155,100,177,.3);color:#fff}
  .ghost{background:transparent;border:1px solid rgba(255,255,255,.2);color:#fff;border-radius:8px;padding:7px 12px;font-size:13px;font-weight:500}
  .ghost:hover{background:rgba(255,255,255,.08)}
  .wrap{max-width:1080px;margin:0 auto;padding:24px 20px 90px}

  .tabs{display:flex;gap:2px;background:#ECE7F1;padding:4px;border-radius:12px;margin-bottom:22px;overflow:auto}
  .tab{flex:1;white-space:nowrap;border:none;background:transparent;padding:9px 14px;border-radius:9px;font-weight:600;font-size:13.5px;color:var(--muted)}
  .tab.active{background:#fff;color:#000;box-shadow:var(--shadow)}

  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:22px}
  .card + .card{margin-top:16px}
  .card h2{font-size:15.5px;margin:0 0 4px}
  .card .hint{color:var(--muted);font-size:12.5px;margin:0 0 16px}

  /* ---------- Clock control (compact) ---------- */
  .clock-card{text-align:center;padding:26px 22px}
  .status-line{display:inline-flex;align-items:center;gap:8px;font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:18px}
  .dot{width:9px;height:9px;border-radius:50%;background:var(--muted)}
  .dot.live{background:var(--brand);animation:pulse 1.7s infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(155,100,177,.45)}70%{box-shadow:0 0 0 9px rgba(155,100,177,0)}100%{box-shadow:0 0 0 0 rgba(155,100,177,0)}}
  @media (prefers-reduced-motion:reduce){.dot.live{animation:none}}
  .clock-actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
  .btn{border:none;border-radius:11px;padding:14px 22px;font-weight:600;font-size:15px;transition:transform .05s,filter .12s}
  .btn:active{transform:translateY(1px)}
  .btn-in{background:var(--brand);color:#fff}
  .btn-out{background:#000;color:#fff}
  .btn-brk{background:#fff;color:var(--brand-dark);border:1.5px solid var(--brand)}
  .btn:hover{filter:brightness(1.06)}
  .break-panel{margin-top:18px;padding-top:18px;border-top:1px dashed var(--line)}
  .break-row{display:flex;gap:12px;align-items:center;justify-content:center;flex-wrap:wrap}
  .brk-count{font-family:"IBM Plex Mono";font-size:30px;font-weight:500;color:var(--brand-dark)}
  .mini{font-size:12.5px;color:var(--muted)}
  .test-link{background:none;border:none;color:var(--brand-dark);font-size:12.5px;font-weight:600;text-decoration:underline;padding:4px}

  /* ---------- Tables ---------- */
  table{width:100%;border-collapse:collapse;font-size:13.5px}
  th{text-align:left;font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:0 12px 9px;border-bottom:1px solid var(--line)}
  td{padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
  .num{text-align:right;font-family:"IBM Plex Mono";font-variant-numeric:tabular-nums}
  th.num{font-family:"Inter"}
  .chip{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:20px}
  .chip.in{background:var(--brand-tint);color:var(--brand-dark)}
  .chip.out{background:#EEECF1;color:var(--muted)}
  .chip .dot{width:7px;height:7px}
  .chip.in .dot{background:var(--brand)}
  .edited-tag{font-size:10.5px;color:var(--warn);font-weight:600;margin-left:6px}
  .caret{display:inline-block;width:14px;color:var(--muted);transition:transform .15s}
  .caret.open{transform:rotate(90deg);color:var(--brand-dark)}
  .day-row{cursor:pointer}
  .day-row:hover td{background:#FAF8FC}
  .day-cell{font-weight:600;display:flex;align-items:center;gap:8px}
  .edit-btn{background:#fff;border:1px solid var(--line);border-radius:7px;padding:5px 11px;font-size:12px;font-weight:600;color:#000}
  .edit-btn:hover{border-color:var(--brand)}
  .expand td{background:#FBFAFC;padding:0}
  .expand-inner{padding:16px 18px}
  .link-btn{background:none;border:none;color:var(--brand-dark);font-weight:600;font-size:13px;padding:0}
  .rowlink{cursor:pointer}
  .rowlink:hover td{background:#FAF8FC}

  .totals{display:flex;gap:24px;flex-wrap:wrap;margin-top:16px;padding-top:16px;border-top:1px solid var(--line)}
  .stat .k{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600}
  .stat .v{font-family:"IBM Plex Mono";font-size:22px;font-weight:600}

  .notice{background:var(--brand-tint);border:1px solid #E4D3F0;border-left:3px solid var(--brand);border-radius:8px;padding:11px 14px;font-size:12.5px;color:var(--text)}
  .empty{color:var(--muted);font-size:13.5px;padding:18px;text-align:center}

  /* ---------- Work log ---------- */
  .field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
  .field label{font-size:12px;font-weight:600;color:#000}
  input[type=text],input[type=time],input[type=date],input[type=datetime-local],input[type=number]{font-family:inherit;font-size:14px;border:1px solid var(--line);border-radius:9px;padding:10px 12px;width:100%;background:#fff;color:var(--text)}
  .task-add{display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap;margin-bottom:4px}
  .task-add .field{margin:0}
  .task-add .t-text{flex:1;min-width:190px}
  .btn-sm{background:#000;color:#fff;border:none;border-radius:9px;padding:10px 16px;font-weight:600;font-size:13.5px}
  .btn-brand{background:var(--brand);color:#fff;border:none;border-radius:9px;padding:10px 16px;font-weight:600;font-size:13.5px}
  .loglist{list-style:none;margin:12px 0 0;padding:0}
  .loglist li{padding:9px 0;border-bottom:1px solid var(--line);font-size:13.5px}
  .loglist li:last-child{border-bottom:none}
  .loglist li:before{content:"";display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--brand);margin-right:11px;vertical-align:middle}
  .back-btn{background:none;border:none;color:var(--brand-dark);font-weight:600;font-size:13.5px;padding:0;margin-bottom:14px;display:inline-flex;align-items:center;gap:5px}

  /* pay */
  .rate-in{width:120px}
  .period-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap}
  .period-title{font-family:"Space Grotesk";font-weight:600;font-size:15px}
  .period-total{font-family:"IBM Plex Mono";font-weight:600;font-size:18px;color:var(--brand-dark)}
  .x-btn{background:none;border:none;color:var(--muted);font-size:18px;line-height:1;padding:0 4px}
  .x-btn:hover{color:var(--brand-dark)}
  .row-inline{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap}
  .row-inline .field{margin:0}

  /* Modal + alarm */
  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);display:grid;place-items:center;z-index:50;padding:20px}
  .modal{background:#fff;border-radius:16px;box-shadow:0 24px 60px rgba(0,0,0,.35);width:100%;max-width:430px;padding:24px}
  .modal h3{margin:0 0 4px;font-size:17px}
  .modal .hint{color:var(--muted);font-size:12.5px;margin:0 0 18px}
  .modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:20px}
  .btn-cancel{background:#fff;border:1px solid var(--line);border-radius:9px;padding:10px 16px;font-weight:600;color:var(--muted)}
  .required{color:var(--brand-dark)}
  .err{color:#B4232B;font-size:12.5px;margin-top:4px;min-height:1em}
  .saved-toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#000;color:#fff;padding:12px 20px;border-radius:10px;font-size:13.5px;font-weight:600;z-index:70;box-shadow:0 10px 30px rgba(0,0,0,.3)}

  .alarm{position:fixed;left:0;right:0;bottom:0;z-index:60;background:var(--brand);color:#fff;padding:16px 20px;display:flex;align-items:center;gap:14px;justify-content:center;flex-wrap:wrap;box-shadow:0 -6px 24px rgba(155,100,177,.4)}
  .alarm b{font-family:"Space Grotesk";font-size:16px}
  .alarm button{background:#fff;color:var(--brand-dark);border:none;border-radius:9px;padding:9px 16px;font-weight:700;font-size:14px}

  /* ---------- Schedule ---------- */
  .sched-row{display:flex;align-items:center;gap:14px;padding:10px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
  .sched-row:last-child{border-bottom:none}
  .sched-day{width:40px;font-weight:600;font-size:13px;flex:none}
  .sched-off label{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted);white-space:nowrap}
  .sched-times{display:flex;align-items:center;gap:8px;flex:1;min-width:220px}
  .sched-times input[type=time]{width:120px}
  .sched-meta{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:16px;padding-top:16px;border-top:1px solid var(--line)}
  .chip.on-sched{background:#E7F3E9;color:#2C7A39}
  .chip.on-sched .dot{background:#2C7A39}
  .chip.off-sched{background:var(--danger-tint);color:var(--danger)}
  .chip.off-sched .dot{background:var(--danger)}
  .notice-warn{background:var(--danger-tint);border:1px solid #F5C6C2;border-left:3px solid var(--danger);border-radius:8px;padding:11px 14px;font-size:12.5px;color:#7A211B;text-align:left}
  .tag-outside{font-size:10.5px;color:var(--danger);font-weight:600;margin-left:6px}
  .live-timer{font-family:"IBM Plex Mono";font-size:42px;font-weight:600;line-height:1;color:var(--text);font-variant-numeric:tabular-nums;letter-spacing:1px;margin:2px 0 4px}
  .live-cap{font-size:12px;color:var(--muted);margin-bottom:18px}
  .dot-danger{display:inline-block;width:12px;height:12px;border-radius:50%;background:var(--danger);margin-right:9px;vertical-align:middle}

  /* ---------- Desktop two-column layouts ---------- */
  .emp-grid{display:grid;grid-template-columns:minmax(300px,360px) 1fr;gap:16px;align-items:start}
  .emp-grid > .card{margin-top:0}
  @media (max-width:820px){ .emp-grid{grid-template-columns:1fr} }

  /* ---------- Calendar: month grid ---------- */
  .cal-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px;flex-wrap:wrap}
  .cal-nav{display:flex;align-items:center;gap:10px}
  .cal-month-title{font-family:"Space Grotesk";font-weight:700;font-size:20px;letter-spacing:-.01em;min-width:170px;text-align:center}
  .cal-nav-btn{background:#fff;border:1px solid var(--line);border-radius:9px;width:36px;height:36px;font-size:18px;line-height:1;color:var(--text);display:grid;place-items:center;padding:0}
  .cal-nav-btn:hover{border-color:var(--brand);color:var(--brand-dark)}
  .cal-today-btn{background:#fff;border:1px solid var(--line);border-radius:9px;padding:8px 14px;font-weight:600;font-size:13px;color:var(--brand-dark)}
  .cal-today-btn:hover{border-color:var(--brand)}

  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden}
  .cal-dow{background:#FAF8FC;padding:10px 8px;font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);font-weight:600;text-align:center}
  .cal-cell{background:#fff;min-height:110px;padding:8px;cursor:pointer;display:flex;flex-direction:column;gap:5px;transition:background .12s}
  .cal-cell:hover{background:#FAF8FC}
  .cal-cell.other{background:#FCFBFD}
  .cal-cell.other .cal-num{color:#C7C0D1}
  .cal-num{font-size:13px;font-weight:600;font-family:"IBM Plex Mono";color:var(--text);align-self:flex-start}
  .cal-cell.today .cal-num{background:var(--brand);color:#fff;border-radius:50%;width:25px;height:25px;display:grid;place-items:center}
  .cal-pills{display:flex;flex-direction:column;gap:3px;min-width:0}
  .cal-pill{font-size:11px;font-weight:600;padding:2px 7px;border-radius:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.4}
  .cal-pill.meeting{background:var(--brand-tint);color:var(--brand-dark)}
  .cal-pill.event{background:#EEECF1;color:var(--text)}
  .cal-pill.timeoff{background:#FBF0DE;color:var(--warn)}
  .cal-more{font-size:10.5px;color:var(--muted);font-weight:600;padding-left:2px}
  .cal-legend{display:flex;gap:16px;flex-wrap:wrap;margin-top:16px}
  .cal-key{display:inline-flex;align-items:center;gap:7px;font-size:12px;color:var(--muted);font-weight:600}
  .cal-key:before{content:"";width:11px;height:11px;border-radius:3px}
  .cal-key.meeting:before{background:var(--brand)}
  .cal-key.event:before{background:var(--muted)}
  .cal-key.timeoff:before{background:var(--warn)}

  /* Calendar day detail (modal) */
  .cal-item{display:flex;align-items:center;gap:14px;padding:11px 0;border-bottom:1px solid var(--line)}
  .cal-item:last-child{border-bottom:none}
  .cal-body{flex:1;min-width:0}
  .cal-title{font-weight:600;font-size:13.5px}
  .cal-sub{font-size:12px;color:var(--muted);margin-top:4px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .cal-add{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin-bottom:12px}
  .cal-add .field{margin:0}
  .cal-add .t-text{flex:1;min-width:180px}
  .chip.meeting{background:var(--brand-tint);color:var(--brand-dark)}
  .chip.meeting .dot{background:var(--brand)}
  .chip.event{background:#EEECF1;color:var(--text)}
  .chip.event .dot{background:var(--muted)}
  .chip.timeoff{background:#FBF0DE;color:var(--warn)}
  .chip.timeoff .dot{background:var(--warn)}

  @media (max-width:560px){
    .cal-cell{min-height:64px;padding:5px 4px;gap:3px}
    .cal-num{font-size:12px}
    .cal-pills{flex-direction:row;flex-wrap:wrap;gap:3px}
    .cal-pill{font-size:0;padding:0;width:8px;height:8px;border-radius:50%}
    .cal-more{display:none}
    .cal-dow{padding:8px 2px;font-size:10px}
  }

  /* ---------- Clock-out confirmation ---------- */
  .check-row{display:flex;align-items:flex-start;gap:10px;background:var(--brand-tint);border-radius:9px;padding:12px 13px;margin-top:14px}
  .check-row input{margin-top:3px;width:16px;height:16px;accent-color:var(--brand)}
  .check-row label{font-size:13px;line-height:1.4;font-weight:600}

  @media (max-width:560px){
    .wrap{padding:18px 14px 96px}
    .card{padding:18px}
    th,td{padding-left:8px;padding-right:8px}
    .whoami .who{display:none}
    .sched-row{align-items:flex-start}
  }
</style>
</head>
<body>

<!-- ============ HOME / LOGIN ============ -->
<div id="login" class="login-wrap">
  <div class="login-inner">
    <div class="logo-mark">
      <svg viewBox="0 0 380 220" xmlns="http://www.w3.org/2000/svg" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <g stroke="#9B64B1" stroke-width="12">
          <path d="M20 120 Q 34 44 104 32"/>
          <path d="M38 126 Q 52 66 108 54"/>
          <path d="M56 130 Q 66 86 110 78"/>
        </g>
        <text x="86" y="176" font-family="'Space Grotesk',sans-serif" font-weight="700" font-size="150" letter-spacing="-6" stroke-width="4">
          <tspan stroke="#FFFFFF" fill="none">ot</tspan><tspan stroke="#9B64B1" fill="none">g</tspan>
        </text>
        <g stroke="#FFFFFF" stroke-width="4">
          <circle cx="346" cy="184" r="19"/>
          <path d="M346 184 L346 172"/>
          <path d="M346 184 L355 190"/>
        </g>
      </svg>
    </div>
    <p class="sub">OneTelGem</p>
    <div class="notice-dark">Working prototype — pick a demo account to explore both sides. The real version signs in with a private email &amp; password.</div>
    <div class="demo-label">Sign in as</div>
    <div class="demo-acc" id="demoAcc"></div>
  </div>
</div>

<!-- ============ APP ============ -->
<div id="app" class="hide">
  <div class="topbar">
    <div class="topbar-in">
      <div class="wordmark">ot<span class="g">g</span></div>
      <div class="spacer"></div>
      <div class="whoami">
        <div class="avatar" id="tbAvatar"></div>
        <div class="who" id="tbName"></div>
        <span class="role" id="tbRole"></span>
      </div>
      <button class="ghost" onclick="signOut()">Sign out</button>
    </div>
  </div>
  <div class="wrap" id="view"></div>
</div>

<div id="alarmMount"></div>
<div id="modalMount"></div>
<div id="toastMount"></div>

<script>
/* ============================================================
   DEMO DATA (in-memory only — resets on refresh).
============================================================ */
const now = Date.now();
const DAY=86400000, HR=3600000, MIN=60000;
function at(daysAgo,h,m){ const d=new Date(now-daysAgo*DAY); d.setHours(h,m,0,0); return d.getTime(); }
function pad(n){ return String(n).padStart(2,'0'); }
function dateKey(ts){ const d=new Date(ts); return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function keyToDate(k){ return new Date(k+'T00:00:00'); }
function addDaysKey(k,n){ const d=keyToDate(k); d.setDate(d.getDate()+n); return dateKey(d); }
function initials(name){ return name.split(' ').map(p=>p[0]).slice(0,2).join('').toUpperCase(); }

const employees = [

/* ============================================================ HELPERS */
function fmtTime(ts){ if(ts==null) return '—'; const d=new Date(ts); let h=d.getHours(),m=d.getMinutes(); const ap=h<12?'AM':'PM'; h=h%12||12; return h+':'+pad(m)+' '+ap; }
function fmtDay(ts){ return new Date(ts).toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'}); }
function fmtDayKey(k){ return keyToDate(k).toLocaleDateString(undefined,{month:'short',day:'numeric'}); }
function fmtDur(ms){ if(ms<0)ms=0; return Math.floor(ms/HR)+'h '+pad(Math.floor((ms%HR)/MIN))+'m'; }
function fmtWatch(ms){ if(ms<0)ms=0; return pad(Math.floor(ms/HR))+':'+pad(Math.floor((ms%HR)/MIN))+':'+pad(Math.floor((ms%MIN)/1000)); }
function money(n){ return '$'+n.toFixed(2); }
function escapeHtml(s){ return (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

function netMs(sh){ return (sh.clockOut||Date.now()) - sh.clockIn; } // paid breaks: nothing deducted
function openShift(empId){ return shifts.find(s=>s.empId===empId && s.clockOut===null); }
function daysFor(empId){ return shifts.filter(s=>s.empId===empId).sort((a,b)=>b.clockIn-a.clockIn); }
function weekTotal(empId){ const wa=now-7*DAY; return shifts.filter(s=>s.empId===empId&&s.clockIn>=wa).reduce((t,s)=>t+netMs(s),0); }
function periodMs(empId,p){ return shifts.filter(s=>{const k=dateKey(s.clockIn);return s.empId===empId&&k>=p.start&&k<=p.end;}).reduce((t,s)=>t+netMs(s),0); }

/* ---------- Schedule matching ---------- */
function fmtHM(hm){ if(!hm) return '—'; const [h,m]=hm.split(':').map(Number); const ap=h<12?'AM':'PM'; const hh=h%12||12; return hh+':'+pad(m)+' '+ap; }
function scheduleFor(empId){ return schedules[empId]||null; }
function dowKey(ts){ return DOW[new Date(ts).getDay()]; }
function scheduledStart(empId,ts){
  const sc=scheduleFor(empId); if(!sc) return null;
  const day=sc[dowKey(ts)]; if(!day||day.off||!day.start) return null;
  const [h,m]=day.start.split(':').map(Number); const d=new Date(ts); d.setHours(h,m,0,0); return d.getTime();
}
function isOnSchedule(empId,clockInTs){
  const start=scheduledStart(empId,clockInTs); if(start==null) return false;
  const GRACE=15*MIN; return clockInTs>=start-GRACE && clockInTs<=start+GRACE;
}

/* ---------- day list (single-open accordion) ---------- */
function toggleDay(k){ openDay = (openDay===k)?null:k; render(); }
function dayList(empId,{logEditable=false,canCorrect=false}={}){
  const list=daysFor(empId);
  if(!list.length) return '<div class="empty">No days recorded yet.</div>';
  const rows=list.map(s=>{
    const dk=dateKey(s.clockIn), ek=empId+'|'+dk, open=openDay===ek;
    const out = s.clockOut?fmtTime(s.clockOut):'<span class="chip in"><span class="dot"></span>active</span>';
    const correct = canCorrect?`<td style="text-align:right"><button class="edit-btn" onclick="event.stopPropagation();openEdit('${s.id}')">Correct</button></td>`:'';
    const main=`<tr class="day-row" onclick="toggleDay('${ek}')">
        <td><span class="day-cell"><span class="caret ${open?'open':''}">&rsaquo;</span>${fmtDay(s.clockIn)}${s.edited?'<span class="edited-tag">edited</span>':''}${s.onSchedule===false?'<span class="tag-outside">outside hours</span>':''}</span></td>
        <td class="num">${fmtTime(s.clockIn)}</td>
        <td class="num">${out}</td>
        <td class="num">${fmtDur(netMs(s))}</td>${correct}</tr>`;
    const span = 4+(canCorrect?1:0);
    const exp = open?`<tr class="expand"><td colspan="${span}"><div class="expand-inner">${logPanel(empId,dk,logEditable)}</div></td></tr>`:'';
    return main+exp;
  }).join('');
  return `<table><thead><tr><th>Day</th><th class="num">In</th><th class="num">Out</th><th class="num">Hours</th>${canCorrect?'<th></th>':''}</tr></thead><tbody>${rows}</tbody></table>`;
}

function submitSchedule(empId){

/* ---------- Calendar (shared across team) ---------- */
function calTypeLabel(t){ return t==='meeting'?'Meeting':t==='time-off'?'Time off':'Event'; }
function calChip(ev){ const cls=ev.type==='meeting'?'meeting':ev.type==='time-off'?'timeoff':'event';
  return `<span class="chip ${cls}"><span class="dot"></span>${calTypeLabel(ev.type)}</span>`; }
function calWho(ev){ if(!ev.empId) return 'Whole team';
  const e=employees.find(x=>x.id===ev.empId); if(!e) return '';
  return e.id===currentUser.id ? 'You' : e.name; }
function calPillClass(ev){ return ev.type==='meeting'?'meeting':ev.type==='time-off'?'timeoff':'event'; }
function calendarTab(){
  const isManager=currentUser.role==='manager';
  if(calMonth==null){ const d=new Date(now); calYear=d.getFullYear(); calMonth=d.getMonth(); }
  const first=new Date(calYear,calMonth,1);
  const startDay=first.getDay();                        // 0=Sun
  const daysInMonth=new Date(calYear,calMonth+1,0).getDate();
  const weeks=Math.ceil((startDay+daysInMonth)/7);
  const gridStart=new Date(calYear,calMonth,1-startDay);
  const todayKey=dateKey(Date.now());
  const monthTitle=first.toLocaleDateString(undefined,{month:'long',year:'numeric'});
  const dowRow=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(d=>`<div class="cal-dow">${d}</div>`).join('');

  let cells='';
  for(let i=0;i<weeks*7;i++){
    const d=new Date(gridStart); d.setDate(gridStart.getDate()+i);
    const dk=dateKey(d);
    const other=d.getMonth()!==calMonth;
    const isToday=dk===todayKey;
    const evs=calendarEvents.filter(e=>e.date===dk).sort((a,b)=>(a.time||'').localeCompare(b.time||''));
    const shown=evs.slice(0,3).map(ev=>{
      const t=ev.time?fmtHM(ev.time).replace(':00','')+' ':'';
      return `<span class="cal-pill ${calPillClass(ev)}" title="${escapeHtml(ev.title)}">${t}${escapeHtml(ev.title)}</span>`;
    }).join('');
    const more=evs.length>3?`<span class="cal-more">+${evs.length-3} more</span>`:'';
    cells+=`<div class="cal-cell${other?' other':''}${isToday?' today':''}" onclick="openCalDay('${dk}')">
        <span class="cal-num">${d.getDate()}</span>
        <div class="cal-pills">${shown}${more}</div></div>`;
  }
  const hint=isManager?'Tap any day to add or manage events. Everyone on the team sees this calendar.':'Tap a day to see what\'s scheduled.';
  return `<div class="card">
    <div class="cal-head">
      <div class="cal-nav">
        <button class="cal-nav-btn" onclick="calStep(-1)" aria-label="Previous month">&lsaquo;</button>
        <div class="cal-month-title">${monthTitle}</div>
        <button class="cal-nav-btn" onclick="calStep(1)" aria-label="Next month">&rsaquo;</button>
      </div>
      <button class="cal-today-btn" onclick="calToday()">Today</button>
    </div>
    <p class="hint" style="margin:-6px 0 16px">${hint}</p>
    <div class="cal-grid">${dowRow}${cells}</div>
    <div class="cal-legend">
      <span class="cal-key meeting">Meeting</span>
      <span class="cal-key event">Event</span>
      <span class="cal-key timeoff">Time off</span>
    </div>
  </div>`;
}
function calStep(n){ let m=calMonth+n, y=calYear; if(m<0){m=11;y--;} if(m>11){m=0;y++;} calMonth=m; calYear=y; render(); }
function calToday(){ const d=new Date(); calYear=d.getFullYear(); calMonth=d.getMonth(); render(); }

function clockCard(empId){
  const s=openShift(empId), on=!!s;
  const statusTxt = on ? (breakActive?'On a paid break':'On the clock') : 'Clocked out';
  const actions = on
    ? `<button class="btn btn-out" onclick="openClockOut()">Clock out</button>`+(breakActive?'':`<button class="btn btn-brk" onclick="startBreak()">Start 30-min break</button>`)
    : `<button class="btn btn-in" onclick="clockIn()">Clock in</button>`;
  let schedChip='', schedBanner='';
  if(on){
    if(s.onSchedule){
      schedChip=`<div style="margin-bottom:18px"><span class="chip on-sched"><span class="dot"></span>On schedule</span></div>`;
    } else {
      schedChip=`<div style="margin-bottom:18px"><span class="chip off-sched"><span class="dot"></span>Outside scheduled hours</span></div>`;
      schedBanner = s.notified
        ? `<div class="notice-warn" style="margin-top:18px">You're clocked in outside your normal schedule. Your manager has been notified.</div>`
        : `<div class="notice-warn" style="margin-top:18px">You're clocked in outside your normal schedule. Let your manager know — <button class="link-btn" style="font-size:12.5px" onclick="notifyOutsideHours('${s.id}')">notify them now</button>.</div>`;
    }
  }
  let brk='';
  if(breakActive){
    const rem=breakEndsAt?breakEndsAt-Date.now():0;
    brk=`<div class="break-panel">
      <div class="break-row"><span class="mini">Paid break — back in</span><span class="brk-count" id="brkCount">${fmtWatch(rem)}</span></div>
      <div class="break-row" style="margin-top:12px"><button class="btn btn-brk" onclick="endBreak()">End break</button></div>
      <div class="mini" style="margin-top:10px">You're still on the clock. An alarm sounds at zero — keep this tab open so it can ring.</div></div>`;
  } else {
    brk=`<div class="break-panel"><button class="test-link" onclick="testAlarm()">Test the alarm sound</button></div>`;
  }
  return `<div class="card clock-card">
    <div class="status-line" style="${on?'margin-bottom:10px':''}"><span class="dot ${on?'live':''}"></span>${statusTxt}</div>
    ${on?`<div class="live-timer mono" id="liveTimer">${fmtWatch(Date.now()-s.clockIn)}</div><div class="live-cap">since ${fmtTime(s.clockIn)}</div>`:''}
    ${schedChip}
    <div class="clock-actions">${actions}</div>${brk}${schedBanner}</div>`;
}

function renderManager(){
  const tabs=[{id:'team',label:'Team'},{id:'calendar',label:'Calendar'},{id:'pay',label:'Pay periods'},{id:'audit',label:'Change log'}];
  if(selectedEmpId) return tabsBar(tabs)+employeeDetail(selectedEmpId);
  if(activeTab==='calendar') return tabsBar(tabs)+calendarTab();
  if(activeTab==='pay') return tabsBar(tabs)+payTab();
  if(activeTab==='audit') return tabsBar(tabs)+auditCard();
  return tabsBar(tabs)+rosterCard();
}
function rosterCard(){
  const team=employees.filter(e=>e.role==='employee');
  const rows=team.map(e=>{
    const s=openShift(e.id);
    const chip=s?'<span class="chip in"><span class="dot"></span>On the clock</span>':'<span class="chip out"><span class="dot"></span>Clocked out</span>';
    const since=s?('since '+fmtTime(s.clockIn)):'';
    return `<tr class="rowlink" onclick="openEmp('${e.id}')">
      <td><span style="display:flex;align-items:center;gap:10px"><span class="avatar" style="background:${e.color}">${initials(e.name)}</span><b>${e.name}</b></span></td>
      <td>${chip} <span class="mini">${since}</span></td>
      <td class="num">${fmtDur(weekTotal(e.id))}</td>
      <td style="text-align:right"><button class="link-btn">View &rsaquo;</button></td></tr>`;
  }).join('');
  const live=team.filter(e=>openShift(e.id)).length;
  return `<div class="card"><h2>Team</h2>
    <p class="hint">${live} of ${team.length} on the clock right now. Tap anyone to see their days and correct a time.</p>
    <table><thead><tr><th>Employee</th><th>Status</th><th class="num">This week</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>`;
}
function employeeDetail(empId){
  const e=employees.find(x=>x.id===empId);
  return `<button class="back-btn" onclick="closeEmp()">&lsaquo; Back to team</button>
    <div class="card"><h2>${e.name}</h2>
      <p class="hint">Tap a day to read the work log. Use Correct to fix a time — every change is recorded in the Change log.</p>
      ${dayList(empId,{logEditable:false,canCorrect:true})}
      <div class="totals"><div class="stat"><div class="k">This week</div><div class="v">${fmtDur(weekTotal(empId))}</div></div>
        <div class="stat"><div class="k">Pay rate</div><div class="v" style="font-size:18px">${money(e.rate)}/hr</div></div></div>
      <button class="btn-sm" style="margin-top:16px" onclick="openAdd('${empId}')">+ Add a missing day</button></div>
    ${scheduleSummaryCard(empId)}`;
}
function scheduleSummaryCard(empId){
  const sc=scheduleFor(empId);
  if(!sc) return `<div class="card"><h2>Weekly schedule</h2><div class="empty">No schedule submitted yet.</div></div>`;
  const rows=DOW.map(d=>{ const day=sc[d];
    return `<tr><td>${DOW_LABEL[d]}</td><td class="num">${day.off?'Off':fmtHM(day.start)+' – '+fmtHM(day.end)}</td></tr>`; }).join('');
  return `<div class="card"><h2>Weekly schedule</h2><p class="hint">Submitted ${sc.submittedAt?fmtDay(sc.submittedAt):'—'}. Clock-ins outside these hours are flagged as "outside hours" in the day list above.</p>
    <table><tbody>${rows}</tbody></table></div>`;
}
function openEmp(id){ selectedEmpId=id; openDay=null; render(); }
function closeEmp(){ selectedEmpId=null; openDay=null; render(); }

/* ---------- Pay periods ---------- */
function payTab(){
  const team=employees.filter(e=>e.role==='employee');
  const rateRows=team.map(e=>`<tr><td><b>${e.name}</b></td>
    <td style="text-align:right"><input type="number" min="0" step="0.25" class="rate-in mono" value="${e.rate.toFixed(2)}" onchange="setRate('${e.id}',this.value)"> <span class="mini">/hr</span></td></tr>`).join('');
  const periodCards=[...payPeriods].sort((a,b)=>a.start.localeCompare(b.start)).map(p=>{
    let total=0;
    const rows=team.map(e=>{ const ms=periodMs(e.id,p); const paypp=(ms/HR)*e.rate; total+=paypp;
      return `<tr><td>${e.name}</td><td class="num">${fmtDur(ms)}</td><td class="num">${money(e.rate)}</td><td class="num"><b>${money(paypp)}</b></td></tr>`; }).join('');
    return `<div class="card"><div class="period-head">
        <span class="period-title">${fmtDayKey(p.start)} – ${fmtDayKey(p.end)}</span>
        <span style="display:flex;align-items:center;gap:12px"><span class="period-total">${money(total)}</span><button class="x-btn" title="Remove period" onclick="removePeriod('${p.id}')">&times;</button></span>
      </div>
      <table><thead><tr><th>Employee</th><th class="num">Hours</th><th class="num">Rate</th><th class="num">Est. pay</th></tr></thead><tbody>${rows}</tbody></table></div>`;
  }).join('');
  return `<div class="card"><h2>Pay rates</h2><p class="hint">Set each person's hourly rate. Used to estimate pay below.</p>
      <table><tbody>${rateRows}</tbody></table></div>
    <div class="card"><h2>Set up pay periods</h2><p class="hint">Generate biweekly periods ahead of time, or add one by hand. Each worked day falls into its period automatically.</p>
      <div class="row-inline" style="margin-bottom:14px">
        <div class="field"><label>First period starts</label><input type="date" id="genStart" value="${dateKey(now)}"></div>
        <div class="field"><label>How many periods</label><input type="number" id="genCount" min="1" max="26" value="6" style="width:120px"></div>
        <button class="btn-brand" onclick="genPeriods()">Generate biweekly</button>
      </div>
      <div class="row-inline">
        <div class="field"><label>Or add one: start</label><input type="date" id="mStart"></div>
        <div class="field"><label>End</label><input type="date" id="mEnd"></div>
        <button class="btn-sm" onclick="addPeriodManual()">Add period</button>
      </div><div class="err" id="periodErr"></div></div>
    <div class="notice" style="margin:0 0 16px">Estimated pay is hours &times; rate. No overtime rules applied yet — we can add those once you confirm the setup.</div>
    ${periodCards || '<div class="card"><div class="empty">No pay periods yet. Generate some above.</div></div>'}`;
}
function setRate(id,v){ const e=employees.find(x=>x.id===id); e.rate=parseFloat(v)||0; render(); }
function genPeriods(){
  const start=document.getElementById('genStart').value; const count=Math.min(26,Math.max(1,parseInt(document.getElementById('genCount').value)||1));
  if(!start){ document.getElementById('periodErr').textContent='Pick a start date first.'; return; }
  payPeriods=[]; for(let i=0;i<count;i++){ const s=addDaysKey(start,i*14); payPeriods.push({id:'p'+Date.now()+'_'+i,start:s,end:addDaysKey(s,13)}); }
  render();
}
function addPeriodManual(){
  const s=document.getElementById('mStart').value, e=document.getElementById('mEnd').value;
  if(!s||!e){ document.getElementById('periodErr').textContent='Enter both a start and end date.'; return; }
  if(e<s){ document.getElementById('periodErr').textContent='End date must be after the start date.'; return; }
  payPeriods.push({id:'p'+Date.now(),start:s,end:e}); render();
}
function removePeriod(id){ payPeriods=payPeriods.filter(p=>p.id!==id); render(); }

/* ---------- Change log ---------- */
function auditCard(){
  if(!auditLog.length) return '<div class="card"><h2>Change log</h2><p class="hint">Every manual correction is recorded here.</p><div class="empty">No corrections yet. When you fix a time, it shows up here with the original value and your reason.</div></div>';
  const rows=[...auditLog].reverse().map(a=>`<tr>
    <td class="mono">${fmtDay(a.ts)} ${fmtTime(a.ts)}</td><td>${a.manager}</td><td>${a.emp}</td><td>${a.field}</td>
    <td class="mono">${a.old} &rarr; <b>${a.new}</b></td><td>${escapeHtml(a.reason)}</td></tr>`).join('');
  return `<div class="card"><h2>Change log</h2><p class="hint">A permanent record of every correction — who, when, what changed, and why.</p>
    <div style="overflow:auto"><table><thead><tr><th>When</th><th>By</th><th>Employee</th><th>Field</th><th>Change</th><th>Reason</th></tr></thead><tbody>${rows}</tbody></table></div></div>`;
}

/* ============================================================ CORRECTIONS */
function tsToInput(ts){ const d=new Date(ts); return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())+'T'+pad(d.getHours())+':'+pad(d.getMinutes()); }
function inputToTs(v){ return v?new Date(v).getTime():null; }
function openEdit(id){
  const s=shifts.find(x=>x.id===id); const e=employees.find(x=>x.id===s.empId);
  document.getElementById('modalMount').innerHTML=`<div class="overlay" onclick="if(event.target===this)closeModal()"><div class="modal">
    <h3>Correct a time</h3><p class="hint">${fmtDay(s.clockIn)} · ${e.name}</p>
    <div class="field"><label>Clock in</label><input type="datetime-local" id="edIn" value="${tsToInput(s.clockIn)}"></div>
    <div class="field"><label>Clock out</label><input type="datetime-local" id="edOut" value="${s.clockOut?tsToInput(s.clockOut):''}"></div>
    <div class="field"><label>Reason for change <span class="required">*</span></label><input type="text" id="edReason" placeholder="e.g. Forgot to clock out"></div>
    <div class="err" id="edErr"></div>
    <div class="modal-actions"><button class="btn-cancel" onclick="closeModal()">Cancel</button><button class="btn-brand" onclick="saveEdit('${id}')">Save correction</button></div>
  </div></div>`;
}
function openAdd(empId){
  const e=employees.find(x=>x.id===empId); const base=tsToInput(now);
  document.getElementById('modalMount').innerHTML=`<div class="overlay" onclick="if(event.target===this)closeModal()"><div class="modal">
    <h3>Add a missing day</h3><p class="hint">${e.name}</p>
    <div class="field"><label>Clock in</label><input type="datetime-local" id="edIn" value="${base}"></div>
    <div class="field"><label>Clock out</label><input type="datetime-local" id="edOut" value="${base}"></div>
    <div class="field"><label>Reason <span class="required">*</span></label><input type="text" id="edReason" placeholder="e.g. Employee forgot to clock in"></div>
    <div class="err" id="edErr"></div>
    <div class="modal-actions"><button class="btn-cancel" onclick="closeModal()">Cancel</button><button class="btn-brand" onclick="saveAdd('${empId}')">Add day</button></div>
  </div></div>`;
}
function closeModal(){ document.getElementById('modalMount').innerHTML=''; }
function toast(msg){ const m=document.getElementById('toastMount'); m.innerHTML=`<div class="saved-toast">${msg}</div>`; setTimeout(()=>{m.innerHTML='';},2200); }

function saveEdit(id){
  const s=shifts.find(x=>x.id===id);
  const reason=document.getElementById('edReason').value.trim(); const err=document.getElementById('edErr');
  if(!reason){ err.textContent='Please add a reason — it goes in the Change log.'; return; }
  const nIn=inputToTs(document.getElementById('edIn').value), nOut=inputToTs(document.getElementById('edOut').value);
  if(!nIn){ err.textContent='Clock-in time is required.'; return; }
  if(nOut && nOut<nIn){ err.textContent='Clock-out must be after clock-in.'; return; }
  const mgr=currentUser.name, en=employees.find(x=>x.id===s.empId).name; let changed=false;
  if(nIn!==s.clockIn){ auditLog.push({ts:Date.now(),manager:mgr,emp:en,field:'Clock in',old:fmtTime(s.clockIn),new:fmtTime(nIn),reason}); s.clockIn=nIn; changed=true; }
  if(nOut!==s.clockOut){ auditLog.push({ts:Date.now(),manager:mgr,emp:en,field:'Clock out',old:s.clockOut?fmtTime(s.clockOut):'—',new:nOut?fmtTime(nOut):'—',reason}); s.clockOut=nOut; changed=true; }
  if(changed) s.edited=true;
  closeModal(); render(); toast(changed?'Correction saved':'No changes to save');
}
function saveAdd(empId){
  const reason=document.getElementById('edReason').value.trim(); const err=document.getElementById('edErr');
  if(!reason){ err.textContent='Please add a reason — it goes in the Change log.'; return; }
  const nIn=inputToTs(document.getElementById('edIn').value), nOut=inputToTs(document.getElementById('edOut').value);
  if(!nIn){ err.textContent='Clock-in time is required.'; return; }
  if(nOut && nOut<nIn){ err.textContent='Clock-out must be after clock-in.'; return; }
  shifts.push({id:nid(),empId,clockIn:nIn,clockOut:nOut,edited:true});
  auditLog.push({ts:Date.now(),manager:currentUser.name,emp:employees.find(x=>x.id===empId).name,field:'Day added',old:'—',new:fmtTime(nIn)+' – '+(nOut?fmtTime(nOut):'—'),reason});
  closeModal(); render(); toast('Day added');
}

/* ============================================================ CLOCK ACTIONS */
function clockIn(){
  const ts=Date.now();
  const onSched=isOnSchedule(currentUser.id,ts);
  const s={id:nid(),empId:currentUser.id,clockIn:ts,clockOut:null,edited:false,onSchedule:onSched,notified:false};
  shifts.push(s); render();
  if(!onSched) openOutsideHoursPopup(s.id);
}
function openOutsideHoursPopup(id){
  document.getElementById('modalMount').innerHTML=`<div class="overlay" onclick="if(event.target===this)closeModal()"><div class="modal" style="max-width:420px">
    <h3><span class="dot-danger"></span>Working outside your hours</h3>
    <p class="hint" style="margin:0 0 20px">You've clocked in outside your normal schedule. Please let your manager know you're working outside of your scheduled hours.</p>
    <div class="modal-actions"><button class="btn-cancel" onclick="closeModal()">Dismiss</button><button class="btn-brand" onclick="notifyOutsideHours('${id}');closeModal()">Notify manager</button></div>
  </div></div>`;
}
function clockOut(){ const s=openShift(currentUser.id); if(!s)return; s.clockOut=Date.now(); if(breakActive)endBreak(true); render(); }

/* ---------- Clock-out confirmation (final notes required) ---------- */
function openClockOut(){
  const empId=currentUser.id, dk=dateKey(now);
  document.getElementById('modalMount').innerHTML=`<div class="overlay" onclick="if(event.target===this)closeModal()"><div class="modal">
    <h3>Before you clock out</h3><p class="hint">Add anything you finished today, then confirm your log before clocking out.</p>
    <div class="task-add">
      <div class="field t-text"><label>Anything to add?</label>
        <input type="text" id="coText" placeholder="e.g. Finished the returns draft" onkeydown="if(event.key==='Enter'){event.preventDefault();addClockOutItem();}"></div>
      <button class="btn-sm" onclick="addClockOutItem()">Add</button>
    </div>
    <div id="coList">${logPanel(empId,dk,false)}</div>
    <div class="check-row">
      <input type="checkbox" id="coCheck">
      <label for="coCheck">I've entered what I did today</label>
    </div>
    <div class="err" id="coErr"></div>
    <div class="modal-actions"><button class="btn-cancel" onclick="closeModal()">Not yet</button><button class="btn-brand" onclick="confirmClockOut()">Clock out</button></div>
  </div></div>`;
}
function addClockOutItem(){
  const empId=currentUser.id, dk=dateKey(now);
  const el=document.getElementById('coText'); const x=el.value.trim(); if(!x) return;
  const key=empId+'|'+dk; if(!workLogs[key]) workLogs[key]={items:[]};
  workLogs[key].items.push({id:Date.now(),text:x}); el.value='';
  document.getElementById('coList').innerHTML=logPanel(empId,dk,false);
}
function confirmClockOut(){
  const empId=currentUser.id, dk=dateKey(now);
  const err=document.getElementById('coErr');
  const log=workLogs[empId+'|'+dk]||{items:[]};
  if(!log.items.length){ err.textContent='Add at least one line about what you did today.'; return; }
  if(!document.getElementById('coCheck').checked){ err.textContent='Please check the box to confirm before clocking out.'; return; }
  closeModal(); clockOut();
}
function startBreak(){ breakActive=true; breakEndsAt=Date.now()+30*MIN; startCountdown(); render(); }
function endBreak(silent){ breakActive=false; breakEndsAt=null; clearInterval(breakTimer); breakTimer=null; stopAlarm(); if(!silent) render(); }
function startCountdown(){ clearInterval(breakTimer); breakTimer=setInterval(()=>{
  if(!breakEndsAt){ clearInterval(breakTimer); return; }
  const rem=breakEndsAt-Date.now(); const el=document.getElementById('brkCount'); if(el) el.textContent=fmtWatch(rem);
  if(rem<=0){ clearInterval(breakTimer); breakTimer=null; fireAlarm(); }
},250); }

/* ============================================================ TICK (guarded) */
function startTick(){ clearInterval(tick); tick=setInterval(updateLiveTimer, 1000); }
function updateLiveTimer(){
  const el=document.getElementById('liveTimer'); if(!el||!currentUser) return;
  const s=openShift(currentUser.id); if(!s) return;
  el.textContent=fmtWatch(Date.now()-s.clockIn);
}

/* ============================================================ ALARM */
function ensureAudio(){ if(!audioCtx) audioCtx=new (window.AudioContext||window.webkitAudioContext)(); if(audioCtx.state==='suspended') audioCtx.resume(); return audioCtx; }
function beep(f,start,dur){ const c=ensureAudio(),o=c.createOscillator(),g=c.createGain(); o.type='square'; o.frequency.value=f; o.connect(g); g.connect(c.destination); const t=c.currentTime+start; g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(0.22,t+0.02); g.gain.exponentialRampToValueAtTime(0.0001,t+dur); o.start(t); o.stop(t+dur+0.02); }
function pattern(){ beep(880,0,0.16); beep(1180,0.22,0.16); beep(880,0.44,0.16); }
function testAlarm(){ ensureAudio(); pattern(); }
function fireAlarm(){ ensureAudio(); pattern(); alarmLoop=setInterval(pattern,1400); document.getElementById('alarmMount').innerHTML=`<div class="alarm"><b>&#9200; Break's over</b><span>Your 30-minute break is up.</span><button onclick="stopAlarm()">Dismiss</button><button onclick="endBreak();stopAlarm()">Back to work</button></div>`; }
function stopAlarm(){ if(alarmLoop){ clearInterval(alarmLoop); alarmLoop=null; } document.getElementById('alarmMount').innerHTML=''; }

/* ============================================================ BOOT */
renderLogin();
</script>
</body>
</html>

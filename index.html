function payTab(){
  const team=hourlyStaff();
  const rateRows=team.map(e=>`<tr><td>${e.name}</td>
    <td class="num"><input type="number" class="rate-in" min="0" step="0.25" value="${e.rate.toFixed(2)}" onchange="setRate('${e.id}',this.value)"></td>
    <td class="ml" style="text-align:left;width:60px">/ hr</td></tr>`).join('');
  const todayK=dateKey(now);
  const ordered=[...payPeriods].sort((a,b)=>{
    const ca=todayK>=a.start&&todayK<=a.end, cb=todayK>=b.start&&todayK<=b.end;
    if(ca!==cb)return ca?-1:1;              /* current period first */
    return b.start.localeCompare(a.start);  /* then newest to oldest */
  });
  const periods=ordered.map(p=>{
    const current=todayK>=p.start&&todayK<=p.end;
    const rows=team.map(e=>{const ms=periodMs(e.id,p),amt=(ms/HR)*e.rate;
      const rbTotal=periodReimb.filter(r=>r.periodId===p.id&&r.empId===e.id).reduce((t,r)=>t+r.amount,0);
      return `<tr><td><button class="emp-link" onclick="openReimb('${p.id}','${e.id}')" title="Add a reimbursement">${esc(e.name)}</button></td><td class="num">${fmtDur(ms)}</td><td class="num">${money(e.rate)}</td><td class="num">${money(amt)}</td><td class="num">${rbTotal>0?money(rbTotal):'—'}</td><td class="num"><b>${money(amt+rbTotal)}</b></td></tr>`;}).join('');
    return `<div class="period ${current?'current':''}"><div class="period-head">
        <span class="period-title">${fmtDayKey(p.start)} — ${fmtDayKey(p.end)}</span>
        ${current?'<span class="period-tag">Current</span>':''}
        <button class="dl-btn" onclick="downloadPeriodPDF('${p.id}')" title="Download PDF for this period" aria-label="Download PDF">&#8595;</button></div>
      <table><thead><tr><th>Employee</th><th class="num">Hours</th><th class="num">Rate</th><th class="num">Est. pay</th><th class="num">Reimb</th><th class="num">Total</th></tr></thead><tbody>${rows}</tbody></table>
      <p class="rb-hint">Click a name to add a reimbursement.</p>
      <div style="margin-top:10px"><button class="pri-x" onclick="removePeriod('${p.id}')" title="Remove period">&times; Remove this period</button></div></div>`;
  }).join('');
  return pageHead('Payroll',payPeriods.length+' periods')
    +`<div class="sec first"><div class="sec-head"><h2>Pay rates</h2></div><table><tbody>${rateRows}</tbody></table></div>
      <div class="sec"><div class="sec-head"><h2>Schedule periods</h2></div>
        <div class="inline-form">
          <div class="field"><label>Start date</label><input type="date" id="genStart"></div>
          <div class="field"><label>End date</label><input type="date" id="genEnd"></div>
          <button class="btn btn-primary btn-sm" onclick="addPeriod()">Add Period</button>
        </div><div class="err" id="periodErr"></div></div>
      <div class="sec"><div class="sec-head"><h2>Estimated pay</h2><span class="ml meta">hours × rate · no overtime rules yet</span></div>
        ${periods||'<div class="empty">No pay periods yet.</div>'}</div>`;
}
function setRate(id,v){
  const rate=parseFloat(v)||0;
  const e=employees.find(x=>x.id===id); if(e)e.rate=rate;
  if(sb) sb.from('profiles').update({rate}).eq('id',id).then(({error})=>{ if(error)toast('Rate not saved: '+error.message); });
  render();
}
function addPeriod(){
  const s=document.getElementById('genStart').value;
  const e=document.getElementById('genEnd').value;
  const err=document.getElementById('periodErr');
  if(!s||!e){err.textContent='Enter both a start and end date.';return;}
  if(e<s){err.textContent='End date must be on or after the start date.';return;}
  payPeriods.push({id:'p'+Date.now(),start:s,end:e});
  render();
}
function removePeriod(id){payPeriods=payPeriods.filter(p=>p.id!==id);render();}
function openReimb(periodId,empId){if(payPeriods.find(x=>x.id===periodId)&&employees.find(x=>x.id===empId))renderReimbModal(periodId,empId);}
function renderReimbModal(periodId,empId){
  const p=payPeriods.find(x=>x.id===periodId),e=employees.find(x=>x.id===empId);if(!p||!e)return;
  const rb=periodReimb.filter(r=>r.periodId===periodId&&r.empId===empId);
  const list=rb.length
    ? rb.map(r=>`<div class="rb-row"><span class="rb-lbl">${esc(r.label)}</span><span class="rb-amt">${money(r.amount)}</span><button class="rb-x" onclick="removeReimb('${r.id}')" title="Remove">&times;</button></div>`).join('')
    : '<div class="rb-none">No reimbursements added yet.</div>';
  document.getElementById('modalMount').innerHTML=`<div class="overlay" onclick="if(event.target===this)closeModal()"><div class="modal">
    <h3>Reimbursements</h3><p class="sub">${esc(e.name)} · ${fmtDayKey(p.start)} — ${fmtDayKey(p.end)}</p>
    <div class="rb-list">${list}</div>
    <div class="rb-add"><div class="field"><label>What it's for</label><input type="text" id="rbLabel" placeholder="Parking"></div>
      <div class="field"><label>Amount ($)</label><input type="number" id="rbAmt" min="0" step="0.01" placeholder="0.00" onkeydown="if(event.key==='Enter')addReimb('${periodId}','${empId}')"></div>
      <div class="err" id="rbErr"></div>
      <button class="btn btn-primary btn-sm" onclick="addReimb('${periodId}','${empId}')">Add reimbursement</button></div>
    <div class="modal-actions"><button class="btn btn-line btn-sm" onclick="closeModal()">Done</button></div></div></div>`;
}
function addReimb(periodId,empId){
  const label=(document.getElementById('rbLabel').value||'').trim();
  const amt=Math.max(0,parseFloat(document.getElementById('rbAmt').value)||0);
  const err=document.getElementById('rbErr');
  if(!label){err.textContent='Add a label, like Parking.';return;}
  if(amt<=0){err.textContent='Enter an amount greater than 0.';return;}
  periodReimb.push({id:'pr'+(++msgSeq),periodId,empId,label,amount:amt});
  render();renderReimbModal(periodId,empId);
}
function removeReimb(id){const r=periodReimb.find(x=>x.id===id);if(!r)return;periodReimb=periodReimb.filter(x=>x.id!==id);render();renderReimbModal(r.periodId,r.empId);}
function downloadPeriodPDF(id){
  const p=payPeriods.find(x=>x.id===id);if(!p)return;
  const team=hourlyStaff();
  const range=fmtDayKey(p.start)+' — '+fmtDayKey(p.end)+', '+keyToDate(p.end).getFullYear();
  const rows=team.map(e=>{const ms=periodMs(e.id,p),amt=(ms/HR)*e.rate;
    return `<tr><td>${esc(e.name)}</td><td class="n">${fmtDur(ms)}</td><td class="n">${money(e.rate)}/hr</td><td class="n"><b>${money(amt)}</b></td></tr>`;}).join('');
  const w=window.open('','_blank');
  if(!w){toast('Allow pop-ups to download the PDF');return;}
  w.document.write(`<!doctype html><html><head><meta charset="utf-8"><title>OTG Payroll ${range}</title>
    <style>
      *{box-sizing:border-box}
      body{font-family:"Barlow",Arial,sans-serif;color:#141218;margin:0;padding:40px;max-width:660px}
      .mark{font-family:"Archivo",Arial,sans-serif;font-weight:700;letter-spacing:-.01em;font-size:13px;
        text-transform:uppercase;letter-spacing:.14em;background:#000;color:#fff;display:inline-block;padding:5px 9px}
      h1{font-family:"Archivo",Arial,sans-serif;font-size:22px;margin:16px 0 2px}
      .sub{color:#6E6B77;font-size:13px;margin:0 0 22px}
      table{width:100%;border-collapse:collapse;font-size:13.5px}
      th{text-align:left;font-family:"Archivo",Arial,sans-serif;font-size:10px;letter-spacing:.08em;
        text-transform:uppercase;color:#6E6B77;border-bottom:2px solid #141218;padding:8px 6px}
      td{padding:11px 6px;border-bottom:1px solid #DEDCE2}
      .n{text-align:right;font-family:"IBM Plex Mono",monospace}
      .note{color:#8A8792;font-size:11px;margin-top:22px}
    </style></head><body>
    <span class="mark">OTG</span>
    <h1>Payroll — pay period</h1>
    <p class="sub">${range}</p>
    <table><thead><tr><th>Employee</th><th class="n">Total time</th><th class="n">Rate</th><th class="n">Exact pay</th></tr></thead>
    <tbody>${rows}</tbody></table>
    <p class="note">Exact pay = hours worked × hourly rate, to the minute. No overtime rules applied.</p>
    <scr`+`ipt>window.onload=function(){setTimeout(function(){window.print();},200);}</scr`+`ipt>
    </body></html>`);
  w.document.close();
}

function auditTab(){
  if(!auditLog.length)return pageHead('Change log','0 corrections')
    +`<div class="sec first"><p class="lede">Every manual correction is recorded here — who made it, when, what changed, and why.</p>
      <div class="empty">No corrections yet.</div></div>`;
  const rows=[...auditLog].reverse().map(a=>`<tr>
    <td class="mono" style="font-size:12.5px">${fmtDay(a.ts)} ${fmtTime(a.ts)}</td><td>${a.manager}</td><td>${a.emp}</td>
    <td class="ml" style="text-align:left">${a.field}</td>
    <td class="mono" style="font-size:12.5px">${a.old} &rarr; <b>${a.new}</b></td><td>${esc(a.reason)}</td></tr>`).join('');
  return pageHead('Change log',auditLog.length+' corrections')
    +`<div class="sec first" style="overflow:auto"><table><thead><tr><th>When</th><th>By</th><th>Employee</th><th>Field</th><th>Change</th><th>Reason</th></tr></thead>
      <tbody>${rows}</tbody></table></div>`;
}

/* ================= CORRECTIONS ================= */
function tsToInput(ts){const d=new Date(ts);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())+'T'+pad(d.getHours())+':'+pad(d.getMinutes());}
function inputToTs(v){return v?new Date(v).getTime():null;}
function openAdd(empId){
  const e=employees.find(x=>x.id===empId),base=tsToInput(now);
  document.getElementById('modalMount').innerHTML=`<div class="overlay" onclick="if(event.target===this)closeModal()"><div class="modal">
    <h3>Add a missing day</h3><p class="sub">${e.name}</p>
    <div class="field"><label>Clock in</label><input type="datetime-local" id="edIn" value="${base}"></div>
    <div class="field"><label>Clock out</label><input type="datetime-local" id="edOut" value="${base}"></div>
    <div class="field"><label>Reason <span class="req">required</span></label><input type="text" id="edReason" placeholder="Employee forgot to clock in"></div>
    <div class="err" id="edErr"></div>
    <div class="modal-actions"><button class="btn btn-line btn-sm" onclick="closeModal()">Cancel</button>
    <button class="btn btn-primary btn-sm" onclick="saveAdd('${empId}')">Add day</button></div></div></div>`;
}
function closeModal(){document.getElementById('modalMount').innerHTML='';}
function toast(m){const t=document.getElementById('toastMount');t.innerHTML=`<div class="toast">${m}</div>`;setTimeout(()=>{t.innerHTML='';},2400);}
function saveAdd(empId){
  const err=document.getElementById('edErr'),reason=document.getElementById('edReason').value.trim();
  if(!reason){err.textContent='Add a reason — it goes in the change log.';return;}
  const nIn=inputToTs(document.getElementById('edIn').value),nOut=inputToTs(document.getElementById('edOut').value);
  if(!nIn){err.textContent='Clock-in time is required.';return;}
  if(nOut&&nOut<nIn){err.textContent='Clock-out must be after clock-in.';return;}
  shifts.push({id:nid(),empId,clockIn:nIn,clockOut:nOut,edited:true});
  auditLog.push({ts:Date.now(),manager:currentUser.name,emp:nameOf(empId),field:'Day added',old:'—',new:fmtTime(nIn)+' – '+(nOut?fmtTime(nOut):'—'),reason});
  closeModal();render();toast('Day added');
}
function openEditDay(shiftId){
  const s=shifts.find(x=>x.id===shiftId);if(!s)return;
  const e=employees.find(x=>x.id===s.empId);
  const active=s.clockOut===null;
  document.getElementById('modalMount').innerHTML=`<div class="overlay" onclick="if(event.target===this)closeModal()"><div class="modal">
    <h3>Edit day</h3><p class="sub">${e.name} · ${fmtDay(s.clockIn)}</p>
    <div class="field"><label>Clock in</label><input type="datetime-local" id="edIn" value="${tsToInput(s.clockIn)}"></div>
    <div class="field"><label>Clock out ${active?'<span class="opt">optional — still clocked in</span>':''}</label><input type="datetime-local" id="edOut" value="${s.clockOut?tsToInput(s.clockOut):''}"></div>
    <div class="err" id="edErr"></div>
    <div class="modal-actions"><button class="btn btn-line btn-sm" onclick="closeModal()">Cancel</button>
    <button class="btn btn-primary btn-sm" onclick="saveEditDay('${shiftId}')">Save changes</button></div></div></div>`;
}
function saveEditDay(shiftId){
  const s=shifts.find(x=>x.id===shiftId);if(!s)return;
  const wasActive=s.clockOut===null;
  const err=document.getElementById('edErr');
  const nIn=inputToTs(document.getElementById('edIn').value),nOut=inputToTs(document.getElementById('edOut').value);
  if(!nIn){err.textContent='Clock-in time is required.';return;}
  if(!nOut&&!wasActive){err.textContent='Clock-out time is required.';return;}   /* active shifts may stay open */
  if(nOut&&nOut<nIn){err.textContent='Clock-out must be after clock-in.';return;}
  const oldStr=fmtTime(s.clockIn)+' – '+(s.clockOut?fmtTime(s.clockOut):'active');
  const newStr=fmtTime(nIn)+' – '+(nOut?fmtTime(nOut):'active');
  s.clockIn=nIn;s.clockOut=nOut||null;s.edited=true;
  auditLog.push({ts:Date.now(),manager:currentUser.name,emp:nameOf(s.empId),field:'Time edited',old:oldStr,new:newStr,reason:''});
  closeModal();render();toast('Day updated');
}

/* ================= CLOCK ================= */
function clockIn(){
  const ts=Date.now();
  shifts.push({id:nid(),empId:currentUser.id,clockIn:ts,clockOut:null,edited:false});
  render();
  if(isOutsideSchedule(currentUser.id,ts))askNotify(ts);
}
function askNotify(ts){
  const slots=slotsForDate(currentUser.id,ts);
  const line=slots.length?`You're scheduled ${slots.map(sl=>fmtHM(sl.start)+' – '+fmtHM(sl.end)).join(', ')} today.`:`You're not scheduled to work today.`;
  document.getElementById('modalMount').innerHTML=`<div class="overlay"><div class="modal">
    <h3>Working outside your schedule</h3><p class="sub">Clocked in ${fmtTime(ts)}</p>
    <p style="margin:0 0 20px;font-size:14px">${line} Send your manager a notice so they know?</p>
    <div class="field"><label>Reason (optional)</label><input type="text" id="nfReason" placeholder="Covering for Devin"></div>
    <div class="modal-actions"><button class="btn btn-line btn-sm" onclick="closeModal()">Not now</button>
      <button class="btn btn-primary btn-sm" onclick="sendNotice(${ts})">Send notice</button></div></div></div>`;
}
function sendNotice(ts){
  const r=document.getElementById('nfReason').value.trim();
  notices.push({id:'n'+Date.now(),empId:currentUser.id,ts,reason:r});
  closeModal();render();toast('Notice sent to your manager');
}
function clockOut(){
  const s=openShift(currentUser.id);if(!s)return;
  s.clockOut=Date.now();if(breakActive)endBreak(true);
  render();promptWorkLog();
}
function promptWorkLog(){
  const dk=dateKey(now),log=workLogs[currentUser.id+'|'+dk]||{items:[]};
  const list=log.items.length?'<ul class="loglist">'+log.items.map(i=>`<li><span>${esc(i.text)}</span></li>`).join('')+'</ul>'
    :'<div class="empty">Nothing logged yet today.</div>';
  document.getElementById('modalMount').innerHTML=`<div class="overlay"><div class="modal">
    <h3>Before you go</h3><p class="sub">Work log · ${fmtDayKey(dk)}</p>
    <div class="field"><label>What did you work on?</label>
      <input type="text" id="wlInput" placeholder="Restocked front displays" onkeydown="if(event.key==='Enter')wlAdd()"></div>
    <button class="btn btn-dark btn-sm" onclick="wlAdd()">Add entry</button>
    <div id="wlList">${list}</div>
    <div class="modal-actions"><button class="btn btn-line btn-sm" onclick="wlSkip()">Skip for now</button>
      <button class="btn btn-primary btn-sm" onclick="wlDone()">Done</button></div></div></div>`;
}
function wlAdd(){
  const el=document.getElementById('wlInput'),v=el.value.trim();if(!v)return;
  const k=currentUser.id+'|'+dateKey(now);if(!workLogs[k])workLogs[k]={items:[]};
  workLogs[k].items.push({id:Date.now(),text:v});el.value='';
  document.getElementById('wlList').innerHTML='<ul class="loglist">'+workLogs[k].items.map(i=>`<li><span>${esc(i.text)}</span></li>`).join('')+'</ul>';
}
function wlSkip(){
  const log=workLogs[currentUser.id+'|'+dateKey(now)];
  logReminder=!log||!log.items.length;
  closeModal();render();
}
function wlDone(){
  const log=workLogs[currentUser.id+'|'+dateKey(now)];
  logReminder=!log||!log.items.length;
  closeModal();render();toast(logReminder?'Work log still empty':'Work log saved');
}
function breakKey(){return currentUser.id+'|'+dateKey(now);}
function breakRemaining(){return Math.max(0,BREAK_BUDGET-(breakUsed[breakKey()]||0));}
function startBreak(){
  const rem=breakRemaining();
  if(rem<=0){toast('Your 30-minute break is used up for today');return;}
  breakActive=true;breakEndsAt=Date.now()+rem;startCountdown();render();
}
function endBreak(silent){
  if(breakEndsAt!=null){
    /* used = full budget minus whatever time was still left on the clock */
    breakUsed[breakKey()]=BREAK_BUDGET-Math.max(0,breakEndsAt-Date.now());
  }
  breakActive=false;breakEndsAt=null;clearInterval(breakTimer);breakTimer=null;stopAlarm();if(!silent)render();
}
function startCountdown(){clearInterval(breakTimer);breakTimer=setInterval(()=>{
  if(!breakEndsAt){clearInterval(breakTimer);return;}
  const rem=breakEndsAt-Date.now(),el=document.getElementById('brkCount');
  if(el)el.textContent=fmtWatch(rem);
  if(rem<=0){clearInterval(breakTimer);breakTimer=null;fireAlarm();}},250);}

/* ================= ALARM ================= */
function ensureAudio(){if(!audioCtx)audioCtx=new (window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume();return audioCtx;}
function beep(f,st,du){const c=ensureAudio(),o=c.createOscillator(),g=c.createGain();o.type='square';o.frequency.value=f;
  o.connect(g);g.connect(c.destination);const t=c.currentTime+st;g.gain.setValueAtTime(0.0001,t);
  g.gain.exponentialRampToValueAtTime(0.22,t+0.02);g.gain.exponentialRampToValueAtTime(0.0001,t+du);o.start(t);o.stop(t+du+0.02);}
function pattern(){beep(880,0,0.16);beep(1180,0.22,0.16);beep(880,0.44,0.16);}
function testAlarm(){ensureAudio();pattern();}
function fireAlarm(){ensureAudio();pattern();alarmLoop=setInterval(pattern,1400);
  document.getElementById('alarmMount').innerHTML=`<div class="alarm"><b>Break is over</b>
    <span class="ml" style="color:#fff">30 minutes elapsed</span>
    <button class="btn btn-sm o" onclick="stopAlarm()">Dismiss</button>
    <button class="btn btn-sm" onclick="endBreak();stopAlarm()">Back to work</button></div>`;}
function stopAlarm(){if(alarmLoop){clearInterval(alarmLoop);alarmLoop=null;}document.getElementById('alarmMount').innerHTML='';}

/* ================= BOOT ================= */
setInterval(()=>{
  if(!currentUser)return;
  const s=openShift(currentUser.id);
  const el=document.getElementById('liveClock');if(el&&s)el.textContent=fmtWatch(netMs(s));
  const wc=document.getElementById('wClock');if(wc)wc.textContent=s?fmtWatch(netMs(s)):'00:00:00';
  const wn=document.getElementById('wNow');if(wn)wn.textContent=new Date().toLocaleTimeString();
},1000);
initAuth();
</script>

let dragKey=null;
function wDragStart(ev,key){dragKey=key;
  try{ev.dataTransfer.effectAllowed='move';ev.dataTransfer.setData('text/plain',key);}catch(e){}
  const g=document.getElementById('homeGrid');if(g)g.classList.add('dragging');
  const card=ev.target.closest('.widget');if(card)setTimeout(()=>card.classList.add('drag-src'),0);}
function wDragOver(ev){if(dragKey===null)return;ev.preventDefault();try{ev.dataTransfer.dropEffect='move';}catch(e){}}
function wCellDrop(ev,r,c){_wCellDrop(ev,r,c);saveMyState();}
function _wCellDrop(ev,r,c){
  ev.preventDefault();ev.stopPropagation();
  if(dragKey===null){cleanupDrag();return;}
  const u=currentUser,pm=posMap(u),d=dimOf(dragKey);
  // clamp target so the widget stays fully on the board
  let tr=Math.min(Math.max(1,r),GRID_MAXR-d.h+1),tc=Math.min(Math.max(1,c),GRID_COLS-d.w+1);
  const old=pm[dragKey];
  // which other widgets overlap the target footprint?
  const g=occGrid(u,dragKey),hit=new Set();
  for(let rr=tr;rr<tr+d.h;rr++)for(let cc=tc;cc<tc+d.w;cc++)if(g[rr][cc])hit.add(g[rr][cc]);
  if(hit.size===0){ pm[dragKey]={r:tr,c:tc}; dragKey=null; render(); return; }   // drop into empty space
  if(hit.size===1 && old){ // swap with the single occupant
    const other=[...hit][0],od=dimOf(other),op=pm[other];
    // tentative: dragged -> other's spot; other -> dragged's old spot
    const g2=Array.from({length:GRID_MAXR+1},()=>Array(GRID_COLS+1).fill(null));
    const place=(k,r0,c0,dd)=>{for(let rr=r0;rr<r0+dd.h;rr++)for(let cc=c0;cc<c0+dd.w;cc++){if(rr<1||cc<1||rr>GRID_MAXR||cc>GRID_COLS||g2[rr][cc])return false;g2[rr][cc]=k;}return true;};
    // place every other widget except dragged & other, then try the swap
    let ok=true;
    userWidgets(u).forEach(k=>{if(k===dragKey||k===other)return;const pp=pm[k];if(pp&&ok)ok=place(k,pp.r,pp.c,dimOf(k));});
    if(ok && place(dragKey,op.r,op.c,d) && place(other,old.r,old.c,od)){
      pm[dragKey]={r:op.r,c:op.c}; pm[other]={r:old.r,c:old.c}; dragKey=null; render(); return;
    }
  }
  toast('Doesn\'t fit there'); cleanupDrag();
}

async function saveLogText(empId,dk,v){
  const k=empId+'|'+dk, prev=workLogs[k]||{text:'',saved:'',ids:[]};
  v=(v||'').trim();
  if(live()){
    if(v===''){
      if(prev.ids&&prev.ids.length){const {error}=await sb.from('work_logs').delete().in('id',prev.ids);if(error){toast('Log not saved: '+error.message);return false;}}
      workLogs[k]={text:'',saved:'',ids:[]};
    }else if(prev.ids&&prev.ids.length){
      /* one row per day: update the first, drop any legacy extras */
      const keep=prev.ids[0], extra=prev.ids.slice(1);
      const {error}=await sb.from('work_logs').update({text:v}).eq('id',keep);
      if(error){toast('Log not saved: '+error.message);return false;}
      if(extra.length)await sb.from('work_logs').delete().in('id',extra);
      workLogs[k]={text:v,saved:v,ids:[keep]};
    }else{
      const {data,error}=await sb.from('work_logs').insert({user_id:empId,day:dk,text:v}).select().single();
      if(error){toast('Log not saved: '+error.message);return false;}
      workLogs[k]={text:v,saved:v,ids:[data.id]};
    }
  }else{
    workLogs[k]={text:v,saved:v,ids:(prev.ids&&prev.ids.length)?prev.ids:(v?[Date.now()]:[])};
  }

      }).join('');

      html+=`<tr class="expand"><td colspan="4"><div class="expand-in">${shiftBlock}${logPanel(empId,dk,logEditable)}</div></td></tr>`;
    }
    return html;
  }).join('');
  return `<table><thead><tr><th>Day</th><th class="num">In</th><th class="num">Out</th><th class="num">Hours</th></tr></thead><tbody>${rows}</tbody></table>`;
}

function shiftMonth(n){
  const [y,m]=calCursor.split('-').map(Number);
  const d=new Date(y,m-1+n,1);calCursor=d.getFullYear()+'-'+pad(d.getMonth()+1);render();
}
function thisMonth(){const d=new Date(now);calCursor=d.getFullYear()+'-'+pad(d.getMonth()+1);render();}
function offFor(k,scopeId){
  return timeOff.filter(t=>{
    if(t.status!=='approved')return false;                 // only approved on the calendar
    if(!(k>=t.start&&k<=t.end))return false;
    if(canManage(currentUser))return true;                 // managers see everyone
    return t.empId===currentUser.id||isManagerId(t.empId); // employees: own + managers'
  });
}
function priFor(k){return priorities.filter(p=>p.due===k);}

function calendarGrid(scopeId){
  const [y,m]=calCursor.split('-').map(Number);
  const first=new Date(y,m-1,1),lead=first.getDay(),total=new Date(y,m,0).getDate();
  const todayK=dateKey(now);
  let cells='';
  for(let i=0;i<lead;i++)cells+='<div class="cell pad"></div>';
  for(let d=1;d<=total;d++){
    const k=y+'-'+pad(m)+'-'+pad(d);
    const offs=offFor(k,scopeId).map(t=>`<span class="ev off" onclick="event.stopPropagation();openRequestDetail('${t.id}')">${esc(t.empId===currentUser.id?t.note:nameOf(t.empId).split(' ')[0]+' · '+t.note)}</span>`).join('');

    cells+=`<${clickable?'button':'div'} class="cell ${k===todayK?'today':''}" ${clickable?`onclick="openDayAdd('${k}')"`:''}>
      <span class="dnum">${d}</span>${offs}${pris}</${clickable?'button':'div'}>`;
  }
  const label=new Date(y,m-1,1).toLocaleDateString(undefined,{month:'long',year:'numeric'});
  return `<div class="cal-head">
      <span class="cal-title">${label}</span>
      <button class="btn-cell" onclick="shiftMonth(-1)">&lsaquo;</button>
      <button class="btn-cell" onclick="thisMonth()">Today</button>
      <button class="btn-cell" onclick="shiftMonth(1)">&rsaquo;</button>

    </div>

}

function priContrast(color){
  if(!color)return '#fff';
  let l=null;
  const h=color.match(/hsl\(\s*[\d.]+\s*,\s*[\d.]+%\s*,\s*([\d.]+)%/i);
  if(h)l=parseFloat(h[1]);
  else if(color[0]==='#'){let c=color.slice(1);if(c.length===3)c=c.split('').map(x=>x+x).join('');
    const r=parseInt(c.slice(0,2),16),g=parseInt(c.slice(2,4),16),b=parseInt(c.slice(4,6),16);
    l=(0.2126*r+0.7152*g+0.0722*b)/2.55;}
  if(l==null)return '#fff';
  return l>=62?'#111':'#fff';
}

function priWheelPick(ev){
  const w=document.getElementById('priWheel'), r=w.getBoundingClientRect();
  const cx=r.width/2, cy=r.height/2, dx=ev.clientX-r.left-cx, dy=ev.clientY-r.top-cy;
  const R=Math.min(cx,cy), dist=Math.min(Math.sqrt(dx*dx+dy*dy)/R,1);
  let hue=Math.atan2(dx,-dy)*180/Math.PI; if(hue<0)hue+=360;
  const sat=Math.round(dist*100), light=Math.round(100-dist*50);
  priPickColor=`hsl(${Math.round(hue)},${sat}%,${light}%)`;
  const prev=document.getElementById('priPrev');
  if(prev){prev.style.background=priPickColor;prev.style.borderColor=priPickColor;prev.style.color=priContrast(priPickColor);}
}

    if(live()){

        if(error){toast('Project not saved: '+error.message);return;}
        if(!priorities.some(p=>p.id===data.id)){priorities.push(priFromRow(data));render();}
      });
    }else{
      priorities.push({id:'pr'+Date.now(),title:note,due:d,done:false,addedBy:currentUser.name});
    }
    closeModal();render();toast('Project added');
  }
}

function timecardTab(){

/* ---------- schedule ---------- */
function scheduleTab(empId,editable,embed){
  const s=schedules[empId]||blankWeek();
  const rows=DOW.map(k=>{
    const day=Array.isArray(s[k])?s[k]:[];
    let inner;
    if(editable){
      inner=day.map((sl,i)=>`<span class="slot"><input class="range-in" id="rg_${k}_${i}" value="${fmtHM(sl.start)} – ${fmtHM(sl.end)}"
          onblur="setSlot('${empId}','${k}',${i},this)" onkeydown="if(event.key==='Enter')this.blur()">
          <button class="slot-x" tabindex="-1" onmousedown="event.preventDefault()" onclick="removeSlot('${empId}','${k}',${i})" title="Remove block">&times;</button></span>`).join('')
        +`<button class="slot-add" onclick="addSlot('${empId}','${k}')" aria-label="Add a time block" title="Add a time block">+</button>`;
    }else{
      inner=day.length
        ? day.map(sl=>`<span class="slot ro"><span class="mono">${fmtHM(sl.start)} – ${fmtHM(sl.end)}</span></span>`).join('')
        : `<span class="sched-off">Day off</span>`;
    }
    return `<div class="sched-row ${day.length?'':'off'}"><span class="sched-day">${DOW_LABEL[k]}</span>
      <span class="slot-wrap">${inner}</span>
      <span class="sched-hrs">${day.length?fmtHrs(dayHours(day)):'—'}</span></div>`;
  }).join('');
  const total=weekHours(empId);
  const inner=`${editable?'<p class="lede">Tap the purple + on a day to add a time block, then type the hours — "9-5", "9am-5:30pm", and "09:00-17:00" all work. Add as many blocks a day as you need; tap a block and hit the × to remove it.</p>':''}
      ${rows}
      <div class="totals"><div class="stat"><div class="k">Scheduled per week</div><div class="v">${fmtHrs(total)}</div></div>
        <div class="stat"><div class="k">Worked so far this week</div><div class="v">${fmtDur(workedThisWeek(empId))}</div></div>
        <div class="stat"><div class="k">Days working</div><div class="v">${DOW.filter(k=>Array.isArray(s[k])&&s[k].length).length}</div></div></div>`;
  if(embed)return inner;
  return pageHead(editable?'My schedule':'Schedule',(editable?'visible to your manager':nameOf(empId))+' · '+tzLabel(tzOf(empId)))
    +`<div class="sec first">${inner}</div>`;
}
function ensureWeek(empId){if(!schedules[empId])schedules[empId]=blankWeek();
  DOW.forEach(k=>{if(!Array.isArray(schedules[empId][k]))schedules[empId][k]=[];});return schedules[empId];}
function addSlot(empId,day){const w=ensureWeek(empId);w[day].push({start:'09:00',end:'17:00'});render();saveSchedule(empId);
  setTimeout(()=>{const el=document.getElementById('rg_'+day+'_'+(w[day].length-1));if(el){el.focus();el.select();}},0);}
function removeSlot(empId,day,i){const w=ensureWeek(empId);w[day].splice(i,1);render();saveSchedule(empId);}
function setSlot(empId,day,i,el){
  const r=parseRange(el.value);
  if(!r){el.classList.add('bad');toast('Try a range like 9-5 or 9:00am-5:30pm');return;}
  el.classList.remove('bad');
  const w=ensureWeek(empId);
  if(!w[day][i]){render();return;}
  w[day][i].start=r.start;w[day][i].end=r.end;
  const clash=w[day].some((sl,j)=>j!==i&&slotsOverlap(sl,w[day][i]));
  render();saveSchedule(empId);
  if(clash)toast('Heads up — this block overlaps another one. Check the AM/PM.');
}

/* ================= STRIKES (#1) =================
   Ledger of add/remove events. Active count = adds minus removes (never below 0).
   Clock for eligibility starts at the most recent strike activity (add OR remove):
   6 months later -> "Eligible for reevaluation", 12 months later -> "Eligible for removal".
   A manager/co-manager decides and removes with a reason. Employees only ever load their own rows. */
const STRIKE_MAX=3;
function strikeFromRow(r){return {id:r.id,empId:r.user_id,action:r.action,reason:r.reason||'',
  date:r.strike_date||dateKey(new Date(r.created_at).getTime()),byName:r.created_by_name||'',ts:new Date(r.created_at).getTime()};}
async function loadStrikes(){
  const {data,error}=await sb.from('strikes').select('*').order('strike_date',{ascending:true}).order('created_at',{ascending:true});
  if(error)throw error;
  strikes=(data||[]).filter(r=>r.user_id&&(r.action==='add'||r.action==='remove')).map(strikeFromRow);
}
function strikesFor(id){return strikes.filter(s=>s.empId===id).sort((a,b)=>a.date.localeCompare(b.date)||a.ts-b.ts);}
function strikeCount(id){let n=0;strikesFor(id).forEach(s=>{n+=s.action==='add'?1:-1;if(n<0)n=0;});return n;}
function lastStrikeAdd(id){const a=strikesFor(id).filter(s=>s.action==='add');return a.length?a[a.length-1].date:null;}
function lastStrikeEvent(id){const a=strikesFor(id);return a.length?a[a.length-1].date:null;}
function addMonthsKey(k,n){const d=keyToDate(k),day=d.getDate();d.setMonth(d.getMonth()+n);if(d.getDate()!==day)d.setDate(0);return dateKey(d);}
function fmtDayKeyYear(k){return keyToDate(k).toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'});}
/* calendar difference from a date key to today, e.g. "1 yr 2 mo 5 days" */
function timeSinceKey(k){
  const a=keyToDate(k),b=keyToDate(dateKey(Date.now()));
  if(b<=a)return 'today';
  let y=b.getFullYear()-a.getFullYear(),m=b.getMonth()-a.getMonth(),d=b.getDate()-a.getDate();
  if(d<0){m--;d+=new Date(b.getFullYear(),b.getMonth(),0).getDate();}
  if(m<0){y--;m+=12;}
  const p=[];if(y)p.push(y+(y===1?' yr':' yrs'));if(m)p.push(m+' mo');if(d)p.push(d+(d===1?' day':' days'));
  return p.join(' ')||'today';
}
function strikeStatus(id){
  const n=strikeCount(id),last=lastStrikeAdd(id),clock=lastStrikeEvent(id),today=dateKey(Date.now());
  let flag='';
  if(n>0&&clock){ if(today>=addMonthsKey(clock,12))flag='removal'; else if(today>=addMonthsKey(clock,6))flag='reeval'; }
  return {n,last,flag};
}
function strikeStat(id,mgr){
  const st=strikeStatus(id);
  const since=st.last?`Time since last strike · ${timeSinceKey(st.last)}`:'No strikes on record';
  const flag=(mgr&&st.flag)?`<span class="strike-flag ${st.flag}">${st.flag==='removal'?'Eligible for removal':'Eligible for reevaluation'}</span>`:'';
  const plus=mgr?`<button class="plus-bub" title="Add a strike" aria-label="Add a strike" onclick="event.stopPropagation();openStrikeForm('${id}','add')">+</button>`:'';
  return `<div class="stat strike-stat click-stat ${st.n>=STRIKE_MAX?'maxed':''}" onclick="openStrikeHistory('${id}')" title="See strike history">
      <div class="k">Strikes</div>
      <div class="v">${st.n}<span class="of"> / ${STRIKE_MAX}</span>${plus}</div>
      <div class="strike-since">${since}</div>${flag}</div>`;
}
function openStrikeForm(id,action){
  if(!canManage(currentUser))return;
  const e=employees.find(x=>x.id===id);if(!e)return;
  const add=action==='add',n=strikeCount(id),today=dateKey(Date.now());
  const warn=(add&&n+1>=STRIKE_MAX)?`<div class="note warn" style="margin-bottom:18px">This will be strike ${n+1} of ${STRIKE_MAX}. All managers and co-managers will be notified.</div>`:'';
  document.getElementById('modalMount').innerHTML=`<div class="overlay" onclick="if(event.target===this)closeModal()"><div class="modal">
    <h3>${add?'Add a strike':'Remove a strike'}</h3><p class="sub">${esc(e.name)} · currently ${n} / ${STRIKE_MAX}</p>
    ${warn}
    <div class="field"><label>Date</label><input type="date" id="skDate" value="${today}" max="${today}"></div>
    <div class="field"><label>Reason <span class="req">required</span></label><textarea class="log-area" id="skReason" rows="3" placeholder="Write the reason for ${add?'this strike':'removing this strike'}"></textarea></div>
    <div class="err" id="skErr"></div>
    <div class="modal-actions"><button class="btn btn-line btn-sm" onclick="closeModal()">Cancel</button>
      <button class="btn ${add?'btn-danger':'btn-primary'} btn-sm" onclick="saveStrike('${id}','${action}')">${add?'Add strike':'Remove strike'}</button></div></div></div>`;
}
async function saveStrike(id,action){
  const err=document.getElementById('skErr');
  const reason=(document.getElementById('skReason').value||'').trim();
  const date=document.getElementById('skDate').value;
  const today=dateKey(Date.now());
  if(!reason){err.textContent='Add a reason — it is saved with the strike.';return;}
  if(!date){err.textContent='Pick a date.';return;}
  if(date>today){err.textContent='The date can\'t be in the future.';return;}
  const before=strikeCount(id);
  if(action==='remove'&&before<=0){err.textContent='There are no active strikes to remove.';return;}
  const row={user_id:id,action,reason,strike_date:date,created_by:currentUser.id,created_by_name:currentUser.name};
  if(live()){
    const {data,error}=await sb.from('strikes').insert(row).select().single();
    if(error){err.textContent='Could not save: '+error.message;return;}
    if(!strikes.some(s=>s.id===data.id))strikes.push(strikeFromRow(data));
  }else{
    strikes.push({id:'sk'+Date.now(),empId:id,action,reason,date,byName:currentUser.name,ts:Date.now()});
  }
  const after=strikeCount(id);
  logAudit({ts:Date.now(),manager:currentUser.name,emp:nameOf(id),field:action==='add'?'Strike added':'Strike removed',
    old:before+' / '+STRIKE_MAX,new:after+' / '+STRIKE_MAX,reason});
  if(action==='add'&&before<STRIKE_MAX&&after>=STRIKE_MAX)notifyStrikeMax(id);
  closeModal();render();toast(action==='add'?'Strike added':'Strike removed');
}
/* 3/3 reached -> notify every other active manager/co-manager */
function notifyStrikeMax(id){
  const text=`${nameOf(id)} has reached ${STRIKE_MAX} of ${STRIKE_MAX} strikes.`;
  const leaders=activeAll().filter(x=>canManage(x)&&x.id!==currentUser.id);
  if(!leaders.length)return;
  if(live()){
    sb.from('messages').insert(leaders.map(l=>({to_user:l.id,from_user:currentUser.id,from_name:currentUser.name,subject:'Strike alert',body:text})))
      .then(({error})=>{ if(error)toast('Strike alert not sent: '+error.message); });
  }else{
    leaders.forEach(l=>messages.push({id:'nt'+(++msgSeq),to:l.id,from:currentUser.name,subject:'Strike alert',text,ts:Date.now(),read:false}));
  }
}
function openStrikeHistory(id){
  const mgr=canManage(currentUser);
  if(!mgr&&id!==currentUser.id)return;   /* employees can only ever open their own */
  const e=employees.find(x=>x.id===id);if(!e)return;
  const list=strikesFor(id).slice().reverse();
  const rows=list.length?list.map(s=>`<div class="sh-row"><span class="sh-badge ${s.action}">${s.action==='add'?'Added':'Removed'}</span>
      <div class="sh-main"><div class="sh-reason">${esc(s.reason)||'—'}</div>
      <div class="sh-date">${fmtDayKeyYear(s.date)}${mgr&&s.byName?' · by '+esc(s.byName):''}</div></div></div>`).join('')
    :'<div class="empty">No strikes on record.</div>';
  document.getElementById('modalMount').innerHTML=`<div class="overlay" onclick="if(event.target===this)closeModal()"><div class="modal">
    <h3>Strike history</h3><p class="sub">${esc(e.name)} · ${strikeCount(id)} / ${STRIKE_MAX} active</p>
    <div class="sh-list">${rows}</div>
    <p class="sh-rule">A strike is eligible for reevaluation 6 months after the most recent strike activity, and for removal after a full year without a new strike.</p>
    <div class="modal-actions edit-actions"><span class="ea-left">${mgr?`<button class="btn btn-danger btn-sm" onclick="openStrikeForm('${id}','add')">+ Add strike</button>`
        +(strikeCount(id)>0?`<button class="btn btn-line btn-sm" onclick="openStrikeForm('${id}','remove')">Remove a strike</button>`:''):''}</span>
      <span class="ea-right"><button class="btn btn-line btn-sm" onclick="closeModal()">Close</button></span></div></div></div>`;
}

/* ================= QUESTIONS OF THE WEEK (#2) =================
   One entry per person per week. A week is keyed by its Friday send-by date.
   Everyone sees everything; each person edits their own; leaders edit any + set the Special Guest.
   Imported rows may be name-only (no account yet) — they're matched to an account by first name. */
function qeFromRow(r){return {id:r.id,week:r.week_date,userId:r.user_id||null,personName:r.person_name||'',question:r.question||'',vacation:!!r.is_vacation,status:r.answer_status||''};}
async function loadQotw(){
  const [er,wr]=await Promise.all([sb.from('qotw_entries').select('*'),sb.from('qotw_weeks').select('*')]);
  if(er.error)throw er.error; if(wr.error)throw wr.error;
  qotwEntries=(er.data||[]).filter(r=>r.week_date).map(qeFromRow);
  qotwGuests={};(wr.data||[]).forEach(r=>{if(r.week_date&&r.guest)qotwGuests[r.week_date]=r.guest;});
}
function firstNameOf(n){return (n||'').trim().split(/\s+/)[0].toLowerCase();}
function qPersonKey(en){
  if(en.userId)return en.userId;
  const fn=firstNameOf(en.personName),m=employees.find(e=>firstNameOf(e.name)===fn);
  return m?m.id:'name:'+fn;
}
function isQParticipant(u){return !!u&&(u.role==='comanager'||u.role==='employee')&&isActive(u)&&!isOwner(u);}
function qParticipants(){
  const map=new Map();
  employees.filter(isQParticipant).forEach(e=>map.set(e.id,{key:e.id,name:e.name}));
  qotwEntries.forEach(en=>{const k=qPersonKey(en);if(!map.has(k)){const emp=employees.find(e=>e.id===k);
    map.set(k,{key:k,name:emp?emp.name:(en.personName||k.replace(/^name:/,''))});}});
  return [...map.values()].sort((a,b)=>a.name.localeCompare(b.name));
}
function qEntry(week,key){return qotwEntries.find(en=>en.week===week&&qPersonKey(en)===key)||null;}
function fridayOnOrAfter(k){const d=keyToDate(k);d.setDate(d.getDate()+((5-d.getDay()+7)%7));return dateKey(d);}
function currentQWeek(){return fridayOnOrAfter(dateKey(Date.now()));}
function fmtQWeek(k){return keyToDate(k).toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric',year:'numeric'});}
/* Monday reminder: from Monday until the question for this Friday is in (vacation counts as done) */
function qotwReminderDue(){
  if(!isQParticipant(currentUser))return null;
  const dow=new Date().getDay(); if(dow<1||dow>5)return null;
  const wk=currentQWeek(); return qEntry(wk,currentUser.id)?null:wk;
}
function qCanEdit(key){return canManage(currentUser)||key===currentUser.id;}
function qotwTab(){
  const me=currentUser,mgr=canManage(me),wk=currentQWeek(),people=qParticipants();
  let mine='';
  if(isQParticipant(me)){
    const en=qEntry(wk,me.id),vac=!!(en&&en.vacation);

        <span class="ml meta ${en?'qw-done':'qw-due'}">${en?(vac?'on vacation':'submitted'):'not submitted yet'}</span></div>
      <textarea class="log-area" id="qwMine" rows="3" placeholder="Write your question for this week…" oninput="qwDraft=this.value" ${vac?'disabled':''}>${esc(val)}</textarea>

  const randBtn=mgr?`<button class="btn btn-primary btn-sm qw-rand-btn" onclick="startRandomizer()">&#8645; ${qRand?'New 3':'Randomizer'}</button>`:'';
  const tools=(guestTool||randBtn)?`<div class="qw-tools">${guestTool}${randBtn}</div><div class="err" id="qgErr"></div>`:'';
  if(qRand&&!mgr)qRand=null;
  const pinned=new Set(qRand?qRand.ids:[]);
  const weekSet=new Set([wk,...qotwEntries.map(e=>e.week),...Object.keys(qotwGuests)]);
  /* future weeks show once they have a guest or an answered question (so a question answered early still has a home) */
  const weeks=[...weekSet].filter(k=>k<=wk||qotwGuests[k]||qotwEntries.some(e=>e.week===k&&e.status==='answered')).sort((a,b)=>b.localeCompare(a));
  const pencil=`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>`;
  const cards=weeks.map(k=>{
    const guest=qotwGuests[k]||'';
    const rows=[],missing=[];
    let nAns=0,nOpen=0;
    people.forEach(pp=>{const en=qEntry(k,pp.key);
      if(en&&pinned.has(en.id))return;   /* pinned in the Randomizer section for now */
      if(en){
        const st=en.vacation?'':en.status;
        if(st==='answered')nAns++;
        const marks=(mgr&&!en.vacation)?`<span class="qw-marks">
            <button class="qw-mark ok ${st==='answered'?'on':''}" title="${st==='answered'?'Answered — click to undo':'Mark answered'}" onclick="setQStatus('${en.id}','answered')">&#10003;</button></span>`:'';
        rows.push(`<div class="qw-row ${st==='answered'?'st-answered':''}"><span class="qw-who">${esc(pp.name.split(' ')[0])}</span>
        <span class="qw-q">${en.vacation?'<span class="qw-vac">Vacation</span>':esc(en.question)}</span>${marks}
        ${qCanEdit(pp.key)?`<button class="day-edit" title="Edit" onclick="openQEdit('${k}','${pp.key}')">${pencil}</button>`:''}</div>`);
      } else missing.push(pp);});
    const tally=nAns?`<span class="qw-tally"><b class="t-ok">${nAns} answered</b></span>`:'';
    const miss=missing.length?`<div class="qw-missing">No question yet: ${missing.map(pp=>qCanEdit(pp.key)
        ?`<button class="qw-add" onclick="openQEdit('${k}','${pp.key}')">${esc(pp.name.split(' ')[0])}</button>`
        :`<span>${esc(pp.name.split(' ')[0])}</span>`).join('')}</div>`:'';
    return `<div class="qw-week ${k===wk?'current':''}"><div class="qw-head">
        <span class="qw-date">${fmtQWeek(k)}</span>${k===wk?'<span class="period-tag">This week</span>':''}
        ${guest?(mgr?`<button class="qw-guest qw-guest-btn" title="Change or remove guest" onclick="openGuestEdit('${k}')">Special guest · ${esc(guest)}</button>`:`<span class="qw-guest">Special guest · ${esc(guest)}</span>`)
          :(mgr?`<button class="qw-addguest" onclick="openGuestEdit('${k}')">+ Add guest</button>`:'')}${tally}</div>
      ${rows.join('')||'<div class="empty" style="padding:6px 0">No questions yet.</div>'}${miss}</div>`;
  }).join('');
  return pageHead('Questions of the Week','due Fridays · '+people.length+' people')
    +`<div class="sec first">${mine}${tools}<div class="qw-weeks">${qRandSection()}${cards}</div></div>`;
}
/* create / update / clear one person's entry for a week */
async function upsertQ(week,key,question,vacation){
  const existing=qEntry(week,key);
  const emp=employees.find(e=>e.id===key);
  const person=emp?emp.name:(existing?existing.personName:key.replace(/^name:/,''));
  question=(question||'').trim();
  if(!question&&!vacation){
    if(existing){
      if(live()){const {error}=await sb.from('qotw_entries').delete().eq('id',existing.id);if(error){toast('Not saved: '+error.message);return false;}}
      qotwEntries=qotwEntries.filter(x=>x!==existing);
    }
    return true;
  }
  const row={week_date:week,user_id:emp?emp.id:null,person_name:person,question:vacation?'':question,is_vacation:!!vacation,updated_by:currentUser.id,updated_at:new Date().toISOString()};
  if(live()){
    const q=existing?sb.from('qotw_entries').update(row).eq('id',existing.id):sb.from('qotw_entries').insert(row);
    const {data,error}=await q.select().single();
    if(error){toast('Not saved: '+error.message);return false;}
    if(existing)Object.assign(existing,qeFromRow(data)); else qotwEntries.push(qeFromRow(data));
  }else{
    const loc={week,userId:row.user_id,personName:person,question:row.question,vacation:!!vacation};
    if(existing)Object.assign(existing,loc); else qotwEntries.push({id:'qe'+Date.now(),...loc});
  }
  return true;
}
async function setQStatus(id,status){
  if(!canManage(currentUser))return;
  const en=qotwEntries.find(x=>x.id===id);if(!en)return;
  const next=en.status==='answered'?'':'answered';
  const prev=en.status; en.status=next; render();
  if(live()){
    const {error}=await sb.from('qotw_entries').update({answer_status:next||null}).eq('id',id);
    if(error){en.status=prev;render();toast('Not saved: '+error.message);}
  }
}

/* Randomizer (leaders only, this screen only): pins 3 random not-yet-answered questions (any week, past or future)
   to the top. ✓ marks one answered and sends it back to its own week. Skip swaps it for another random one;
   skipped questions stay out for this round only. The section hides once all 3 are answered, or on Clear. */
function qRandomPool(exclude){exclude=exclude||new Set();
  return qotwEntries.filter(en=>!en.vacation&&(en.question||'').trim()&&en.status!=='answered'&&!exclude.has(en.id));}
function qRandPick(n,exclude){
  const pool=qRandomPool(exclude).slice();
  for(let i=pool.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]];}
  return pool.slice(0,n).map(en=>en.id);
}
function startRandomizer(){
  if(!canManage(currentUser))return;
  const ids=qRandPick(3);
  if(!ids.length){qRand=null;render();toast('Every question has been answered');return;}
  qRand={ids,skipped:new Set()};render();
  const el=document.getElementById('qRandSec');if(el)el.scrollIntoView({block:'nearest',behavior:'smooth'});
}
function clearRandomizer(){qRand=null;render();}
function skipRandQ(id){
  if(!qRand)return;
  qRand.skipped.add(id);
  const i=qRand.ids.indexOf(id);if(i<0)return;
  const [rep]=qRandPick(1,new Set([...qRand.skipped,...qRand.ids]));
  if(rep)qRand.ids[i]=rep; else{qRand.ids.splice(i,1);toast('No more unanswered questions to swap in');}
  if(!qRand.ids.length)qRand=null;
  render();
}
async function answerRandQ(id){
  if(!qRand)return;
  qRand.ids=qRand.ids.filter(x=>x!==id);
  if(!qRand.ids.length)qRand=null;   /* all 3 done -> hide the section */
  await setQStatus(id,'answered');
  const en=qotwEntries.find(x=>x.id===id);
  if(en&&en.status==='answered')toast('Answered · moved back to '+fmtDayKey(en.week));
}
function qRandSection(){
  if(!qRand||!canManage(currentUser))return '';
  /* drop anything answered/removed elsewhere in the meantime */
  qRand.ids=qRand.ids.filter(id=>{const en=qotwEntries.find(x=>x.id===id);return en&&en.status!=='answered';});
  if(!qRand.ids.length){qRand=null;return '';}
  const nameFor=en=>{const k=qPersonKey(en),pp=qParticipants().find(x=>x.key===k);return (pp?pp.name:en.personName||'').split(' ')[0];};
  const rows=qRand.ids.map(id=>{const en=qotwEntries.find(x=>x.id===id);
    return `<div class="qw-row qr-row"><button class="qr-skip" title="Skip — swap in another question" onclick="skipRandQ('${id}')">Skip</button>
      <span class="qw-who">${esc(nameFor(en))}</span>
      <span class="qw-q">${esc(en.question)}<span class="qr-from">from ${fmtQWeek(en.week)}</span></span>
      <span class="qw-marks"><button class="qw-mark ok" title="Mark answered — moves it back to its week" onclick="answerRandQ('${id}')">&#10003;</button></span></div>`;}).join('');
  const left=qRandomPool(new Set([...qRand.skipped,...qRand.ids])).length;
  return `<div class="qw-week qr-sec" id="qRandSec"><div class="qw-head"><span class="qw-date">Randomizer</span>
      <span class="period-tag">${qRand.ids.length} picked</span><span class="qr-left">${left} more to swap in</span>
      <button class="btn btn-line btn-xs qr-clear" onclick="clearRandomizer()">Clear</button></div>${rows}</div>`;
}

/* ================= ANONYMOUS SURVEY (#3) =================
   Once per calendar month (company time, Utah). The comment is stored with NO name and NO timestamp.
   A separate private marker ("you sent one this month") is readable only by that same person.
   Leaders get a monthly bell reminder to send the survey out; sending notifies the team. */
const SURVEY_MSG="This month's anonymous survey is open. Share advice, problems or concerns — your name is never attached. Open Messages → Anonymous feedback.";
function surveyMonth(){return new Intl.DateTimeFormat('en-CA',{timeZone:'America/Denver',year:'numeric',month:'2-digit'}).format(new Date()).slice(0,7);}
function surveyMonthLabel(m){return new Date(m+'-01T00:00:00').toLocaleDateString(undefined,{month:'long',year:'numeric'});}
function nextSurveyMonthLabel(){const d=new Date(surveyMonth()+'-01T00:00:00');d.setMonth(d.getMonth()+1);return d.toLocaleDateString(undefined,{month:'long',day:'numeric'});}
async function loadSurvey(){
  const resp=[],rounds={},mine=new Set();
  if(canManage(currentUser)){
    const [r1,r2]=await Promise.all([sb.from('survey_responses').select('*'),sb.from('survey_rounds').select('*')]);
    if(r1.error)throw r1.error; if(r2.error)throw r2.error;
    (r1.data||[]).forEach(r=>resp.push({id:r.id,month:r.month,body:r.body||''}));
    (r2.data||[]).forEach(r=>{rounds[r.month]={by:r.sent_by_name||'',at:new Date(r.sent_at).getTime(),status:r.status||'sent'};});
  }
  const r3=await sb.from('survey_submissions').select('month').eq('user_id',currentUser.id);
  if(r3.error)throw r3.error;
  (r3.data||[]).forEach(r=>mine.add(r.month));
  surveyResponses=resp;surveyRounds=rounds;surveyMine=mine;
}
function surveyReminderDue(){const m=surveyMonth();return (canManage(currentUser)&&!surveyRounds[m])?m:null;}
function surveyButton(){
  const sent=isQParticipant(currentUser)&&surveyMine.has(surveyMonth());
  const n=canManage(currentUser)?surveyResponses.filter(r=>r.month===surveyMonth()).length:0;
  return `<button class="btn btn-line btn-sm sv-btn" onclick="openSurvey()">Anonymous feedback${n?` <span class="um-ct">${n}</span>`:''}${sent&&!canManage(currentUser)?' ✓':''}</button>`;
}
function openSurvey(){ if(canManage(currentUser))openSurveyReader(); else openSurveyForm(); }
function openSurveyForm(){
  if(!isQParticipant(currentUser)){toast('Anonymous feedback is for team members.');return;}
  const m=surveyMonth();
  if(surveyMine.has(m)){
    document.getElementById('modalMount').innerHTML=`<div class="overlay" onclick="if(event.target===this)closeModal()"><div class="modal">
      <h3>Thanks — feedback sent</h3><p class="sub">${surveyMonthLabel(m)}</p>
      <p style="margin:0;font-size:14px">You've already shared your anonymous feedback this month. You can send another starting ${nextSurveyMonthLabel()}.</p>
      <div class="modal-actions"><button class="btn btn-line btn-sm" onclick="closeModal()">Close</button></div></div></div>`;
    return;
  }
  document.getElementById('modalMount').innerHTML=`<div class="overlay" onclick="if(event.target===this)closeModal()"><div class="modal compose">
    <h3>Anonymous feedback</h3><p class="cmp-sub">${surveyMonthLabel(m)} · one per month</p>
    <div class="cmp-field"><textarea id="svBody" rows="7" aria-label="Your anonymous feedback"></textarea></div>
    <div class="sv-privacy">Your name is never attached to this — not in the app and not in the database. Leadership only sees what you write.</div>
    <div class="err" id="svErr"></div>
    <div class="cmp-actions"><button class="btn btn-line btn-sm" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary btn-sm" onclick="submitSurvey()">Send anonymously</button></div></div></div>`;
}
async function submitSurvey(){
  const err=document.getElementById('svErr'),body=(document.getElementById('svBody').value||'').trim();
  if(!body){err.textContent='Write a comment first.';return;}
  const m=surveyMonth();

    if(error){err.textContent=error.message;return;}

function openSurveyReader(month){
  if(!canManage(currentUser))return;
  const cur=surveyMonth(),m=month||cur;
  const months=[...new Set([cur,...surveyResponses.map(r=>r.month)])].sort((a,b)=>b.localeCompare(a));
  const list=surveyResponses.filter(r=>r.month===m);
  const round=surveyRounds[cur];
  const sendBox=!round
    ?`<div class="sv-send"><span>${surveyMonthLabel(cur)}'s survey hasn't been sent out yet.</span><span class="sv-send-acts"><button class="btn btn-line btn-sm" onclick="skipSurvey()">Dismiss</button><button class="btn btn-primary btn-sm" onclick="sendOutSurvey()">Send out survey</button></span></div>`
    :round.status==='skipped'
      ?`<div class="sv-skip"><span>This month's survey was skipped${round.by?' by '+esc(round.by):''} · the reminder returns next month.</span><button class="btn btn-line btn-sm" onclick="sendOutSurvey()">Send it anyway</button></div>`
      :`<div class="sv-sent">This month's survey was sent out ${fmtDay(round.at)}${round.by?' by '+esc(round.by):''}.</div>`;
  const rows=list.length?list.map(r=>`<div class="sv-row"><div class="sv-body">${esc(r.body).replace(/\n/g,'<br>')}</div></div>`).join('')
    :'<div class="empty">No feedback for this month yet.</div>';
  const own=isQParticipant(currentUser)?`<button class="btn btn-line btn-sm" onclick="openSurveyForm()">${surveyMine.has(cur)?'Your feedback ✓':'Share your own'}</button>`:'';
  document.getElementById('modalMount').innerHTML=`<div class="overlay" onclick="if(event.target===this)closeModal()"><div class="modal sv-modal">
    <h3>Anonymous feedback</h3><p class="sub">Names are never stored · managers &amp; co-managers only</p>
    ${sendBox}
    <div class="sv-head"><select class="role-sel" onchange="openSurveyReader(this.value)">${months.map(x=>`<option value="${x}" ${x===m?'selected':''}>${surveyMonthLabel(x)}</option>`).join('')}</select>
      <span class="sv-count">${list.length} response${list.length===1?'':'s'}</span></div>
    <div class="sv-list">${rows}</div>
    <div class="modal-actions edit-actions">${own||'<span></span>'}<span class="ea-right"><button class="btn btn-line btn-sm" onclick="closeModal()">Close</button></span></div></div></div>`;
}
async function sendOutSurvey(fromPrompt){
  if(!canManage(currentUser))return;
  const m=surveyMonth(); if(surveyRounds[m]&&surveyRounds[m].status!=='skipped'){openSurveyReader();return;}
  const recips=activeAll().filter(e=>isQParticipant(e)&&e.id!==currentUser.id);
  if(live()){
    const {error}=await sb.from('survey_rounds').upsert({month:m,status:'sent',sent_by:currentUser.id,sent_by_name:currentUser.name,sent_at:new Date().toISOString()});
    if(error){toast('Could not send: '+error.message);return;}
    if(recips.length){
      const {error:e2}=await sb.from('messages').insert(recips.map(r=>({to_user:r.id,from_user:currentUser.id,from_name:currentUser.name,subject:'Anonymous survey',body:SURVEY_MSG})));
      if(e2)toast('Survey marked sent, but the team notice failed: '+e2.message);

/* ================= HOURS CHECK (#6) — managers & co-managers only =================
   Custom From/To dates + custom required hours. Worked = hours whose shifts fall on those company (Utah) days.
   Approved time off lowers the target: required x (weekdays not off / weekdays in range). */
let hoursCheck=null;   /* {start,end,hours} for this session */
function isWeekdayKey(k){const d=keyToDate(k).getDay();return d>0&&d<6;}
function weekdaysIn(a,b){let n=0;for(let k=a;k<=b;k=addDaysKey(k,1))if(isWeekdayKey(k))n++;return n;}
function offWeekdaysIn(id,a,b){let n=0;
  for(let k=a;k<=b;k=addDaysKey(k,1))if(isWeekdayKey(k)&&timeOff.some(t=>t.empId===id&&t.status==='approved'&&k>=t.start&&k<=t.end))n++;
  return n;}
function hoursCheckFor(id){
  const c=hoursCheck,worked=periodMs(id,{start:c.start,end:c.end});
  const W=weekdaysIn(c.start,c.end),off=offWeekdaysIn(id,c.start,c.end);
  const reqH=W?c.hours*(W-off)/W:c.hours;
  return {worked,reqH,off,ok:worked>=Math.round(reqH*HR)};
}
function hoursCheckBar(hc,nMet,nShort){
  const v=hc||{start:'',end:'',hours:''};
  const summary=hc?`<div class="hc-sum"><b>${fmtDayKeyYear(hc.start)} – ${fmtDayKeyYear(hc.end)}</b> · ${fmtHrs(hc.hours)} required
      <span class="mini">(lowered for approved weekday time off)</span>
      <span class="hc-count"><span class="hc-light ok"><i></i>${nMet} met</span><span class="hc-light no"><i></i>${nShort} short</span></span></div>`:'';
  return `<div class="hc-bar"><span class="ml hc-title">Hours check</span>
      <div class="field"><label>From</label><input type="date" id="hcStart" value="${v.start}"></div>
      <div class="field"><label>To</label><input type="date" id="hcEnd" value="${v.end}"></div>
      <div class="field"><label>Required hours</label><input type="number" id="hcHours" min="0" step="0.25" value="${v.hours}" placeholder="20" onkeydown="if(event.key==='Enter')runHoursCheck()"></div>
      <button class="btn btn-primary btn-sm hc-pill" onclick="runHoursCheck()">Check</button>
      ${hc?'<button class="btn btn-line btn-sm hc-pill" onclick="hoursCheck=null;render()">Clear</button>':''}</div>
    <div class="err" id="hcErr"></div>${summary}`;
}
function runHoursCheck(){
  if(!canManage(currentUser))return;
  const a=document.getElementById('hcStart').value,b=document.getElementById('hcEnd').value;
  const h=parseFloat(document.getElementById('hcHours').value),err=document.getElementById('hcErr');
  if(!a||!b){err.textContent='Pick a From and To date.';return;}
  if(b<a){err.textContent='The To date must be on or after the From date.';return;}
  if(!(h>0)){err.textContent='Enter the required hours (more than 0).';return;}
  hoursCheck={start:a,end:b,hours:h};render();
}

/* ================= TIME OFF TRACKER (#7) =================
   4 weeks = 20 workdays (Mon–Fri) of unpaid time off per calendar year, reset every Jan 1 (company time).
   Only APPROVED time off counts. Leaders mark each one Regular or Emergency/sick; emergency days
   don't count against the 20 and appear only in the red bar, which only managers/co-managers see. */
const PTO_DAYS=20;
async function loadTimeOffCats(){
  const {data,error}=await sb.from('time_off_categories').select('time_off_id,category');
  if(error)throw error;
  const m={};(data||[]).forEach(r=>{m[r.time_off_id]=r.category;});timeOffCat=m;
}
function offCat(id){return timeOffCat[String(id)]==='emergency'?'emergency':'regular';}
function offTypePicker(elId,value,onchange,short){
  return `<select class="role-sel${short?' oh-sel':''}" id="${elId}" ${onchange?`onchange="${onchange}"`:''}>
    <option value="regular" ${value!=='emergency'?'selected':''}>${short?'Regular':'Regular — counts toward the 4 weeks'}</option>
    <option value="emergency" ${value==='emergency'?'selected':''}>${short?'Emergency / sick':'Emergency / sick — doesn\'t count'}</option></select>`;
}
async function setOffType(id,cat){
  if(!canManage(currentUser))return true;
  const t=timeOff.find(x=>x.id===id);
  if(live()){
    const {error}=await sb.from('time_off_categories').upsert({time_off_id:String(id),user_id:t?t.empId:null,category:cat,set_by:currentUser.id,set_at:new Date().toISOString()});
    if(error){toast('Type not saved: '+error.message);return false;}
  }
  timeOffCat[String(id)]=cat;return true;
}
async function changeOffType(id,el){if(await setOffType(id,el.value)){render();toast('Marked '+(el.value==='emergency'?'emergency / sick':'regular'));}}
function ptoYear(){const y=todayKey().slice(0,4);return {y,a:y+'-01-01',b:y+'-12-31'};}
/* weekdays in this year's approved time off, split by type and by used (date has arrived) vs upcoming */
function offDaysByCat(id){
  const {a,b}=ptoYear(),today=todayKey(),reg=new Set(),em=new Set();
  timeOff.filter(t=>t.empId===id&&t.status==='approved').forEach(t=>{
    const bucket=offCat(t.id)==='emergency'?em:reg;
    const s0=t.start<a?a:t.start,e0=t.end>b?b:t.end;
    for(let k=s0;k<=e0;k=addDaysKey(k,1))if(isWeekdayKey(k))bucket.add(k);
  });
  em.forEach(k=>reg.delete(k));   /* a day marked emergency never also counts as regular */
  const split=set=>{let used=0,up=0;set.forEach(k=>k<=today?used++:up++);return {used,up};};
  const r=split(reg),e=split(em);
  return {regular:reg.size,emergency:em.size,regUsed:r.used,regUp:r.up,emUsed:e.used,emUp:e.up};
}
function daysWord(n){return n+' day'+(n===1?'':'s');}
function ptoBar(used,up,cls){
  const u=Math.min(100,used/PTO_DAYS*100),p=Math.min(100-u,up/PTO_DAYS*100);
  return `<div class="pto-bar ${cls}"><span class="seg-used" style="width:${u}%"></span><span class="seg-up" style="width:${p}%"></span></div>`;
}
function timeOffBlocks(id,showRed){
  const d=offDaysByCat(id),{y}=ptoYear(),left=PTO_DAYS-d.regular;
  const main=`<div class="pto-block click-stat" onclick="openTimeOffHistory('${id}','regular')" title="See time off history">
      <div class="k">Time off · ${y}</div>${ptoBar(d.regUsed,d.regUp,left<0?'over':'')}
      <div class="pto-txt"><b>${daysWord(Math.max(0,left))} left</b>${d.regUp?` <span class="pto-up">(${daysWord(d.regUp)} upcoming)</span>`:''}
        · ${d.regUsed} used${left<0?` · <span class="pto-over">over by ${-left}</span>`:''}</div></div>`;
  const red=showRed?`<div class="pto-block click-stat" onclick="openTimeOffHistory('${id}','emergency')" title="See emergency / sick history">
      <div class="k">Emergency / sick · ${y}</div>${ptoBar(d.emUsed,d.emUp,'red')}
      <div class="pto-txt"><b>${daysWord(d.emergency)}</b>${d.emUp?` <span class="pto-up red">(${daysWord(d.emUp)} upcoming)</span>`:''} · no limit · leaders only</div></div>`:'';
  return main+red;
}
function timeOffStat(id,mgr){return `<div class="stat pto-stat">${timeOffBlocks(id,mgr)}</div>`;}
/* history of one person's time off this year, for one type */
function openTimeOffHistory(id,cat){
  const mgr=canManage(currentUser);
  if(!mgr&&id!==currentUser.id)return;
  if(cat==='emergency'&&!mgr)return;          /* emergency / sick history is leaders only */
  const e=employees.find(x=>x.id===id);if(!e)return;
  const {a,b,y}=ptoYear(),today=todayKey();
  const inYear=t=>t.end>=a&&t.start<=b;
  const approved=timeOff.filter(t=>t.empId===id&&t.status==='approved'&&inYear(t)&&offCat(t.id)===cat).sort((x,z)=>z.start.localeCompare(x.start));
  const wd=t=>{const s0=t.start<a?a:t.start,e0=t.end>b?b:t.end;let n=0;for(let k=s0;k<=e0;k=addDaysKey(k,1))if(isWeekdayKey(k))n++;return n;};
  const range=t=>t.start===t.end?fmtDayKeyYear(t.start):`${fmtDayKey(t.start)} – ${fmtDayKeyYear(t.end)}`;
  const state=t=>t.start>today?['up','Upcoming']:(t.end>today?['now','In progress']:['used','Used']);
  const row=t=>{const [c,l]=state(t);
    return `<div class="sh-row"><span class="oh-badge ${c}">${l}</span><div class="sh-main"><div class="sh-reason">${range(t)} · ${daysWord(wd(t))}</div>
      <div class="sh-date">${esc(t.note)||'—'}${mgr&&t.decidedByName?' · approved by '+esc(t.decidedByName):(mgr&&t.addedBy?' · added by '+esc(t.addedBy):'')}</div></div>
      ${mgr?offTypePicker('oh_'+t.id,offCat(t.id),`changeOffType('${t.id}',this).then(()=>openTimeOffHistory('${id}','${cat}'))`,true):''}</div>`;};
  const waiting=cat==='regular'?timeOff.filter(t=>t.empId===id&&t.status==='pending'&&inYear(t)).sort((x,z)=>x.start.localeCompare(z.start)):[];
  const d=offDaysByCat(id);
  const sum=cat==='regular'
    ?`${daysWord(Math.max(0,PTO_DAYS-d.regular))} left of ${PTO_DAYS} · ${d.regUsed} used${d.regUp?' · '+d.regUp+' upcoming':''}`
    :`${daysWord(d.emergency)} this year${d.emUp?' · '+d.emUp+' upcoming':''} · no limit`;
  document.getElementById('modalMount').innerHTML=`<div class="overlay" onclick="if(event.target===this)closeModal()"><div class="modal sv-modal">
    <h3>${cat==='regular'?'Time off':'Emergency / sick'} · ${y}</h3><p class="sub">${esc(e.name)} · ${sum}</p>
    <div class="sh-list">${approved.length?approved.map(row).join(''):`<div class="empty">No ${cat==='regular'?'time off':'emergency / sick days'} this year.</div>`}</div>
    ${waiting.length?`<div class="oh-wait-h">Awaiting approval · doesn't count yet</div>${waiting.map(t=>`<div class="sh-row"><span class="oh-badge wait">Pending</span><div class="sh-main"><div class="sh-reason">${range(t)} · ${daysWord(wd(t))}</div><div class="sh-date">${esc(t.note)||'—'}</div></div></div>`).join('')}`:''}
    <p class="sh-rule">Counts weekdays only. 4 weeks = ${PTO_DAYS} workdays per year, resetting Jan 1. Approved days are "upcoming" until the date arrives, then "used"${cat==='regular'?'; both count toward days left':''}.</p>
    <div class="modal-actions"><button class="btn btn-line btn-sm" onclick="closeModal()">Close</button></div></div></div>`;
}

function tsToInput(ts){const d=new Date(ts);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())+'T'+pad(d.getHours())+':'+pad(d.getMinutes());}

function toast(m){const t=document.getElementById('toastMount');t.innerHTML=`<div class="toast">${m}</div>`;setTimeout(()=>{t.innerHTML='';},2400);}
async function saveAdd(empId){
  const err=document.getElementById('edErr'),reason=document.getElementById('edReason').value.trim();
  if(!reason){err.textContent='Add a reason — it goes in the change log.';return;}
  const active=document.getElementById('edActive')&&document.getElementById('edActive').checked;
  const tz=tzOf(empId);
  const nIn=inputToTsTZ(document.getElementById('edIn').value,tz);
  const nOut=active?null:inputToTsTZ(document.getElementById('edOut').value,tz);
  if(!nIn){err.textContent='Clock-in time is required.';return;}
  if(active){
    if(companyDateKey(nIn)!==todayKey()){err.textContent='“Currently clocked in” only works for today.';return;}
  }else{
    if(!nOut&&companyDateKey(nIn)!==todayKey()){err.textContent='Clock-out is required for a past day.';return;}
    if(nOut&&nOut<nIn){err.textContent='Clock-out must be after clock-in.';return;}
  }
  if(live()){
    const {data,error}=await sb.from('shifts').insert({user_id:empId,clock_in:new Date(nIn).toISOString(),clock_out:nOut?new Date(nOut).toISOString():null,edited:true}).select().single();
    if(error){err.textContent='Could not save: '+error.message;return;}
    upsertShift(shiftFromRow(data));
  }else{
    shifts.push({id:nid(),empId,clockIn:nIn,clockOut:nOut,edited:true});
  }
  logAudit({ts:Date.now(),manager:currentUser.name,emp:nameOf(empId),field:'Day added',old:'—',new:fmtTimeTZ(nIn,tz)+' – '+(nOut?fmtTimeTZ(nOut,tz):'currently clocked in'),reason});
  closeModal();render();toast('Day added');
}

async function saveEditDay(shiftId){
  const s=shifts.find(x=>x.id===shiftId);if(!s)return;

  const nIn=inputToTsTZ(document.getElementById('edIn').value,tz),nOut=inputToTsTZ(document.getElementById('edOut').value,tz);

  const el=document.getElementById('wlInput');
  if(el){const v=el.value.trim(); if(v)await saveLogText(currentUser.id,todayKey(),v);}   /* keep whatever they typed */
  logReminder=!logText(currentUser.id,todayKey()).trim();
  closeModal();render();
}
async function wlDone(){
  const el=document.getElementById('wlInput'), v=el?el.value.trim():'';
  const ok=await saveLogText(currentUser.id,todayKey(),v);
  if(!ok)return;
  logReminder=!v;
  closeModal();render();toast(v?'Work log saved':'Work log still empty');
}
function breakKey(){return currentUser.id+'|'+dateKey(now);}
function breakRemaining(){return Math.max(0,BREAK_BUDGET-(breakUsed[breakKey()]||0));}
function startBreak(){
  const rem=breakRemaining();
  if(rem<=0){toast('Your 30-minute break is used up for today');return;}
  breakActive=true;breakEndsAt=Date.now()+rem;startCountdown();render();
}
function endBreak(silent){
  if(breakEndsAt!=null){
    /* used = full budget minus whatever time was still left on the clock */
    breakUsed[breakKey()]=BREAK_BUDGET-Math.max(0,breakEndsAt-Date.now());
  }
  breakActive=false;breakEndsAt=null;clearInterval(breakTimer);breakTimer=null;stopAlarm();if(!silent)render();
}
function startCountdown(){clearInterval(breakTimer);breakTimer=setInterval(()=>{
  if(!breakEndsAt){clearInterval(breakTimer);return;}
  const rem=breakEndsAt-Date.now(),el=document.getElementById('brkCount');
  if(el)el.textContent=fmtWatch(rem);
  if(rem<=0){clearInterval(breakTimer);breakTimer=null;fireAlarm();}},250);}

/* ================= ALARM ================= */
function ensureAudio(){if(!audioCtx)audioCtx=new (window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume();return audioCtx;}
function beep(f,st,du){const c=ensureAudio(),o=c.createOscillator(),g=c.createGain();o.type='square';o.frequency.value=f;
  o.connect(g);g.connect(c.destination);const t=c.currentTime+st;g.gain.setValueAtTime(0.0001,t);
  g.gain.exponentialRampToValueAtTime(0.22,t+0.02);g.gain.exponentialRampToValueAtTime(0.0001,t+du);o.start(t);o.stop(t+du+0.02);}
function pattern(){beep(880,0,0.16);beep(1180,0.22,0.16);beep(880,0.44,0.16);}
function testAlarm(){ensureAudio();pattern();}
function fireAlarm(){ensureAudio();pattern();alarmLoop=setInterval(pattern,1400);
  document.getElementById('alarmMount').innerHTML=`<div class="alarm"><b>Break is over</b>
    <span class="ml" style="color:#fff">30 minutes elapsed</span>
    <button class="btn btn-sm o" onclick="stopAlarm()">Dismiss</button>
    <button class="btn btn-sm" onclick="endBreak();stopAlarm()">Back to work</button></div>`;}
function stopAlarm(){if(alarmLoop){clearInterval(alarmLoop);alarmLoop=null;}document.getElementById('alarmMount').innerHTML='';}

/* ================= BOOT ================= */
setInterval(()=>{
  if(!currentUser)return;
  const s=openShift(currentUser.id);
  const el=document.getElementById('liveClock');if(el&&s)el.textContent=fmtWatch(netMs(s));
  const wc=document.getElementById('wClock');if(wc)wc.textContent=s?fmtWatch(netMs(s)):'00:00:00';
  const wn=document.getElementById('wNow');if(wn)wn.textContent=new Date().toLocaleTimeString();
},1000);
initAuth();
</script>

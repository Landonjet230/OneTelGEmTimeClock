<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light only">
<title>OTG — Timecard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=Barlow:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    color-scheme:light;
    --purple:#9B64B1; --purple-deep:#6F4783; --purple-wash:#F4EEF7;
    --black:#000000; --white:#FFFFFF;
    --page:#FBFBFC; --rule:#DEDCE2; --rule-soft:#EBE9EE;
    --muted:#6E6B77; --text:#141218;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{background:var(--page);color:var(--text);
    font-family:"Barlow",system-ui,sans-serif;font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
  h1,h2,h3{font-family:"Archivo",sans-serif;letter-spacing:-.015em;margin:0}
  button{font-family:inherit;cursor:pointer;border-radius:0}
  input,select{border-radius:0}
  :focus-visible{outline:2px solid var(--purple);outline-offset:1px}
  .hide{display:none!important}
  .mono{font-family:"IBM Plex Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}
  .wordmark{font-family:"Archivo";font-weight:700;letter-spacing:-.04em}
  .wordmark .g{color:var(--purple)}
  .ml{font-family:"IBM Plex Mono";font-size:10.5px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}

  /* ============ LOGIN ============ */
  .login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:28px;background:#000}
  .login-inner{width:100%;max-width:392px;color:#fff}
  .logo-mark{max-width:300px;margin:0 0 6px}
  .logo-mark svg{width:100%;height:auto;display:block}
  .login-inner .sub{font-family:"Archivo";font-weight:600;font-size:14px;letter-spacing:.16em;text-transform:uppercase;color:#fff;margin:14px 0 0}
  .login-rule{height:1px;background:rgba(255,255,255,.18);margin:22px 0 0}
  .login-note{font-size:12.5px;color:#9A94A4;margin:16px 0 0;line-height:1.55}
  .auth-tabs{display:flex;gap:0;margin:20px 0 16px;border:1px solid rgba(255,255,255,.22)}
  .auth-tab{flex:1;background:transparent;border:0;color:#B9B2C4;font-family:"Archivo";font-weight:700;font-size:11px;
    letter-spacing:.12em;text-transform:uppercase;padding:11px 6px;cursor:pointer}
  .auth-tab.on{background:#fff;color:#000}
  .afield{margin-bottom:14px}
  .afield label{display:block;font-family:"IBM Plex Mono";font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:#9A94A4;margin-bottom:6px}
  .afield input{width:100%;background:#fff !important;border:0;border-bottom:1.5px solid #9A94A4;color-scheme:only light;
    color:#000 !important;-webkit-text-fill-color:#000 !important;font-family:"Barlow";font-size:15px;padding:9px 10px;outline:none;border-radius:3px 3px 0 0}
  .afield input::placeholder{color:#8A8494 !important;-webkit-text-fill-color:#8A8494 !important}
  .afield input:focus{border-bottom-color:var(--purple)}
  .afield input:-webkit-autofill,.afield input:-webkit-autofill:hover,.afield input:-webkit-autofill:focus,.afield input:-webkit-autofill:active{
    -webkit-text-fill-color:#000 !important;-webkit-box-shadow:0 0 0 60px #fff inset !important;box-shadow:0 0 0 60px #fff inset !important;
    caret-color:#000;transition:background-color 999999s ease-out 0s}
  .afield input:autofill{
    -webkit-text-fill-color:#000 !important;box-shadow:0 0 0 60px #fff inset !important;caret-color:#000}
  .pw-wrap{position:relative}
  .pw-wrap input{padding-right:40px}
  .pw-eye{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:28px;height:28px;border:0;background:transparent;
    cursor:pointer;color:#6E6880;display:flex;align-items:center;justify-content:center;padding:0}
  .pw-eye:hover{color:#000}
  .pw-eye.on::after{content:'';position:absolute;width:19px;height:2px;background:currentColor;transform:rotate(45deg);border-radius:2px}
  .modal.dark .pw-eye{color:#9A94A4}
  .modal.dark .pw-eye:hover{color:#fff}
  .opt2{font-weight:400;letter-spacing:.06em;color:#7E7889}
  .auth-go{width:100%;margin-top:6px;justify-content:center}
  .auth-go:disabled{opacity:.6}
  .auth-msg{font-size:13px;color:#C9F0D6;margin-top:14px;line-height:1.5}
  .auth-msg.err{color:#FF9A9A}
  .demo-label{margin:30px 0 2px;color:#7E7889}
  .acct{display:flex;align-items:center;gap:13px;width:100%;text-align:left;background:none;border:0;
    border-bottom:1px solid rgba(255,255,255,.14);padding:15px 0;color:#fff;position:relative;transition:padding-left .14s}
  .acct:first-of-type{border-top:1px solid rgba(255,255,255,.14)}
  .acct:before{content:"";position:absolute;left:0;top:0;bottom:0;width:2px;background:var(--purple);transform:scaleY(0);transition:transform .14s}
  .acct:hover{padding-left:12px}
  .acct:hover:before{transform:scaleY(1)}
  .acct .sq{width:30px;height:30px;flex:none;display:grid;place-items:center;background:rgba(255,255,255,.09);
    font-family:"IBM Plex Mono";font-size:11.5px;font-weight:600;letter-spacing:.04em}
  .acct .nm{flex:1;font-weight:500;font-size:15px}
  .acct .rl{font-family:"IBM Plex Mono";font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:#8B8496}
  .acct .rl.manager{color:var(--purple)}

  /* ============ SHELL ============ */
  .topbar{background:#000;color:#fff;position:sticky;top:0;z-index:30;border-bottom:1px solid rgba(255,255,255,.12)}
  .topbar-in{max-width:1060px;margin:0 auto;padding:0 22px;height:56px;display:flex;align-items:center;gap:16px}
  .topbar .wordmark{font-size:21px;color:#fff}
  .spacer{flex:1}
  .usermenu{position:relative}
  .usermenu:after{content:"";position:absolute;left:0;right:0;top:100%;height:10px}
  .user-btn{display:flex;align-items:center;gap:10px;background:none;border:0;color:#fff;padding:5px 2px}
  .user-btn .sq{width:26px;height:26px;display:grid;place-items:center;background:rgba(255,255,255,.1);
    font-family:"IBM Plex Mono";font-size:10.5px;font-weight:600}
  .user-btn .nm{font-size:13.5px;font-weight:500}
  .user-btn .uc{font-family:"IBM Plex Mono";font-size:10px;color:#8B8496}
  .user-btn:hover .uc{color:var(--purple)}
  .notif-dot{width:7px;height:7px;border-radius:50%;background:var(--purple);flex:none}
  .um-notif{padding:12px 15px 6px;max-height:230px;overflow:auto}
  .um-label{font-family:"IBM Plex Mono";font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:#7E7889;margin-bottom:8px;display:flex;justify-content:space-between}
  .um-item{border-top:1px solid rgba(255,255,255,.09);padding:9px 0;font-size:12px;color:#CFC9D8;line-height:1.4}
  .um-item b{color:#fff}
  .um-item .t{font-family:"IBM Plex Mono";font-size:10px;color:#8B8496;display:block;margin-top:2px}
  .um-item.um-click{cursor:pointer}
  .um-item.um-click:hover{color:#fff}
  .um-tag{display:inline-block;font-family:"IBM Plex Mono";font-size:8.5px;letter-spacing:.1em;text-transform:uppercase;
    color:var(--purple);border:1px solid rgba(155,100,177,.55);border-radius:20px;padding:1px 7px;margin-right:6px}
  .um-item .dz{background:none;border:0;color:var(--purple);font-family:"IBM Plex Mono";font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;padding:4px 0 0}
  .um-empty{font-size:12px;color:#7E7889;padding:2px 0 6px}
  .um-div{height:1px;background:rgba(255,255,255,.12);margin:5px 0}
  .um-notif .um-label{align-items:center;margin-bottom:10px}
  .um-ct{display:inline-grid;place-items:center;min-width:16px;height:16px;padding:0 4px;background:var(--purple);color:#fff;border-radius:9px;font-size:9.5px;letter-spacing:0;vertical-align:middle}
  .um-send{width:24px;height:24px;border-radius:6px;background:var(--purple);border:0;display:grid;place-items:center;cursor:pointer;flex:none;padding:0}
  .um-send:hover{background:var(--purple-deep)}
  .um-open{background:none;border:0;padding:0;cursor:pointer;font:inherit;color:inherit;letter-spacing:inherit;text-transform:inherit;display:inline-flex;align-items:center;gap:6px}
  .um-open:hover{color:var(--purple)}
  /* ---- messaging page ---- */
  .chat-page{display:flex;flex-direction:column;min-height:calc(100vh - 140px)}
  .chat-head{display:flex;align-items:center;gap:12px;margin-bottom:16px}
  .chat-head h1{font-size:22px;margin:0}
  .chat-head-t{display:flex;flex-direction:column}
  .chat-sub{font-size:12px;color:var(--muted)}
  .chat-x{background:none;border:0;cursor:pointer;color:var(--text);padding:4px;display:inline-flex;border-radius:8px}
  .chat-x:hover{background:var(--purple-wash)}
  .cv-actions{display:flex;gap:9px;margin-bottom:14px}
  .cv-list{display:flex;flex-direction:column}
  .cv-row{display:flex;align-items:center;gap:12px;padding:11px 6px;border:0;border-bottom:1px solid var(--rule-soft);background:none;cursor:pointer;text-align:left;width:100%}
  .cv-row:hover{background:var(--purple-wash)}
  .cv-ava{width:38px;height:38px;flex:none;border-radius:50%;background:var(--purple);color:#fff;display:grid;place-items:center;font-family:"Archivo";font-weight:700;font-size:14px}
  .cv-ava.grp{background:#E9E5F0;color:var(--purple-deep)}
  .cv-mid{flex:1;min-width:0;display:flex;flex-direction:column}
  .cv-name{font-weight:600;font-size:14.5px}
  .cv-prev{font-size:12.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
  .cv-row.unread .cv-name{font-weight:800}
  .cv-row.unread .cv-prev{color:var(--text)}
  .cv-dot{width:9px;height:9px;flex:none;border-radius:50%;background:var(--purple)}
  .cv-empty{color:var(--muted);font-size:13px;padding:20px 4px}
  .cv-hint{font-size:11px;color:var(--muted);text-align:center;margin:14px 0 0}
  .chat-scroll{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:2px;padding:6px 2px 12px;max-height:calc(100vh - 250px)}
  .cb-row{display:flex;flex-direction:column;max-width:76%}
  .cb-row.me{align-self:flex-end;align-items:flex-end}
  .cb-row.them{align-self:flex-start;align-items:flex-start}
  .cb-who{font-size:10.5px;color:var(--muted);margin:4px 12px 1px}
  .cb{padding:7px 14px;border-radius:20px;font-size:15px;line-height:1.32;word-break:break-word;-webkit-font-smoothing:antialiased}
  .cb-me{background:var(--purple);color:#fff;border-bottom-right-radius:7px}
  .cb-them{background:#E9E9EB;color:#111;border-bottom-left-radius:7px}
  .cb-t{font-size:9.5px;color:var(--muted);margin:3px 12px 4px}
  .chat-compose{display:flex;gap:9px;align-items:center;padding-top:10px;border-top:1px solid var(--rule-soft);margin-top:4px}
  .chat-compose input{flex:1;border:1px solid var(--rule);border-radius:22px;padding:10px 15px;font-family:"Barlow";font-size:14px;color:#000;background:#fff;color-scheme:only light;outline:none}
  .chat-compose input:focus{border-color:var(--purple)}
  .chat-send{width:40px;height:40px;flex:none;border-radius:50%;background:var(--purple);border:0;display:grid;place-items:center;cursor:pointer;padding:0}
  .chat-send:hover{background:var(--purple-deep)}
  .pick-list{display:flex;flex-direction:column;max-height:320px;overflow:auto;margin-top:4px}
  .pick-row{display:flex;align-items:center;gap:11px;padding:9px 6px;border:0;border-bottom:1px solid var(--rule-soft);background:none;cursor:pointer;text-align:left;width:100%;font-size:14px}
  .pick-row:hover{background:var(--purple-wash)}
  .grp-list{display:flex;flex-direction:column;gap:2px;max-height:260px;overflow:auto;margin-top:4px}
  .grp-pick{display:flex;align-items:center;gap:9px;padding:7px 4px;font-size:14px;cursor:pointer}
  .grp-pick input{width:16px;height:16px;accent-color:var(--purple)}
  /* ---- time-off requests ---- */
  .um-req{width:100%;margin:2px 0 10px;padding:9px 12px;border:1px solid var(--purple);background:var(--purple-wash);color:var(--purple-deep);
    border-radius:20px;font-family:"Archivo";font-weight:700;font-size:12px;cursor:pointer}
  .um-req:hover{background:var(--purple);color:#fff}
  .rq-sec{margin-bottom:16px}
  .rq-sec-lbl{font-family:"IBM Plex Mono",monospace;font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:7px}
  .rq-card{display:flex;align-items:center;gap:11px;width:100%;text-align:left;padding:10px;border:1px solid var(--rule);border-radius:12px;background:#fff;cursor:pointer;margin-bottom:7px}
  .rq-card:hover{border-color:var(--purple)}
  .rq-card.pending{border-left:3px solid var(--purple)}
  .rq-ic{width:34px;height:34px;flex:none;border-radius:9px;background:var(--purple-wash);color:var(--purple-deep);display:grid;place-items:center}
  .rq-mid{flex:1;min-width:0;display:flex;flex-direction:column}
  .rq-title{font-weight:600;font-size:13.5px}
  .rq-sub{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .rq-chip{flex:none;font-family:"IBM Plex Mono",monospace;font-size:9.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:20px}
  .rq-chip.pending{background:#FBEED2;color:#8A6D1B}
  .rq-chip.approved{background:#E6F4EA;color:#0B6B33}
  .rq-chip.denied{background:#F6E0E1;color:#A81E27}
  .rq-reason{font-size:14px;margin:2px 0 0}
  .rq-decided{font-size:13px;color:var(--muted);margin:8px 0 0}
  .rq-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:20px}
  .rq-approve,.rq-deny{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:22px;font-family:"Archivo";font-weight:700;font-size:12.5px;cursor:pointer;border:1px solid}
  .rq-approve{background:#0B6B33;border-color:#0B6B33;color:#fff}
  .rq-approve:hover{background:#095a2b}
  .rq-deny{background:#fff;border-color:#C86A70;color:#A81E27}
  .rq-deny:hover{background:rgba(168,30,39,.07)}
  .mrc{border:1px solid var(--rule-soft);border-radius:12px;padding:12px;margin:12px 0 4px}
  .mrc-head{text-align:center;font-family:"Archivo";font-weight:700;font-size:13px;margin-bottom:8px}
  .mrc-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}
  .mrc-dow{font-size:9.5px;color:var(--muted);font-family:"IBM Plex Mono",monospace;padding:2px 0}
  .mrc-cell{font-size:12px;padding:6px 0;border-radius:6px}
  .mrc-cell.pad{visibility:hidden}
  .mrc-cell.on{background:var(--purple);color:#fff;font-weight:700}
  .mrc-note{text-align:center;font-size:12px;color:var(--purple-deep);margin:8px 0 0;font-weight:600}
  .um-subj{color:#fff;font-weight:600}
  .user-panel{display:none;position:absolute;right:0;top:calc(100% + 10px);min-width:186px;background:#0B0A0D;
    border:1px solid rgba(255,255,255,.2);box-shadow:0 18px 44px rgba(0,0,0,.55);padding:5px 0;z-index:45}
  .usermenu:hover .user-panel,.user-panel.show{display:block}
  .soon{font-family:"IBM Plex Mono";font-size:9px;letter-spacing:.12em;text-transform:uppercase;
    color:#7E7889;border:1px solid rgba(255,255,255,.22);padding:1px 5px}

  .navwrap{position:relative}
  .menu-btn{width:34px;height:34px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.28);
    display:grid;place-content:center;gap:4px;padding:0}
  .menu-btn span{display:block;width:15px;height:1.5px;background:#fff}
  .menu-btn:hover{background:rgba(255,255,255,.14);border-color:var(--purple)}
  .menu-btn.open{background:var(--purple);border-color:var(--purple)}
  .menu-panel{position:absolute;right:0;top:42px;min-width:196px;background:#0B0A0D;
    border:1px solid rgba(255,255,255,.2);box-shadow:0 18px 44px rgba(0,0,0,.55);padding:5px 0;z-index:40}
  .menu-item{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;text-align:left;
    background:none;border:0;color:#DCD8E2;padding:11px 15px;font-size:13.5px;font-family:"Barlow";font-weight:500}
  .menu-item:hover{background:rgba(255,255,255,.07);color:#fff}
  .menu-item.active{color:#fff;box-shadow:inset 2px 0 0 var(--purple)}
  .menu-item .tick{font-family:"IBM Plex Mono";font-size:10px;color:var(--purple);opacity:0}
  .menu-item.active .tick{opacity:1}
  .badge{background:var(--purple);color:#fff;font-family:"IBM Plex Mono";font-size:9px;padding:1px 5px;letter-spacing:.08em}

  .wrap{max-width:1060px;margin:0 auto;padding:30px 22px 96px}

  /* ============ SECTIONS ============ */
  .page-head{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;padding-bottom:14px;border-bottom:2px solid var(--black);margin-bottom:4px}
  .page-head h1{font-size:23px;font-weight:700}
  .page-head .meta{margin-left:auto}
  .sec{padding-top:30px;margin-top:30px;border-top:1px solid var(--rule)}
  .sec.first{border-top:0;margin-top:0;padding-top:22px}
  .sec-head{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:16px}
  .sec-head h2{font-size:14px;font-weight:600;letter-spacing:.02em}
  .sec-head .meta{margin-left:auto}
  .lede{color:var(--muted);font-size:13.5px;margin:-8px 0 16px;max-width:64ch}

  /* ============ TABLES ============ */
  table{width:100%;border-collapse:collapse;font-size:14px}
  th{text-align:left;font-family:"IBM Plex Mono";font-size:10px;letter-spacing:.13em;text-transform:uppercase;
    color:var(--muted);font-weight:500;padding:0 10px 10px;border-bottom:1px solid var(--black)}
  td{padding:13px 10px;border-bottom:1px solid var(--rule-soft);vertical-align:middle}
  th:first-child,td:first-child{padding-left:0}
  th:last-child,td:last-child{padding-right:0}
  .num{text-align:right;font-family:"IBM Plex Mono";font-variant-numeric:tabular-nums}
  th.num{font-family:"IBM Plex Mono"}
  .rowlink{cursor:pointer}
  .rowlink:hover td{background:var(--purple-wash)}
  .sq-av{width:28px;height:28px;flex:none;display:grid;place-items:center;background:var(--black);color:#fff;
    font-family:"IBM Plex Mono";font-size:10.5px;font-weight:600}
  .person{display:flex;align-items:center;gap:11px;font-weight:600}

  .st{display:inline-flex;align-items:center;gap:8px;font-family:"IBM Plex Mono";font-size:10.5px;
    letter-spacing:.11em;text-transform:uppercase;font-weight:500}
  .st i{width:7px;height:7px;flex:none;background:var(--muted);display:block}
  .st.on{color:var(--purple-deep)}
  .st.on i{background:var(--purple);animation:beat 1.8s infinite}
  .st.off{color:var(--muted)}
  @keyframes beat{0%,100%{opacity:1}50%{opacity:.35}}
  @media (prefers-reduced-motion:reduce){.st.on i{animation:none}}
  .edited{font-family:"IBM Plex Mono";font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--purple-deep);
    border:1px solid var(--purple);padding:1px 5px;margin-left:9px}
  .day-edit{background:none;border:0;color:var(--purple);cursor:pointer;padding:2px 4px;margin-left:8px;line-height:1;vertical-align:middle;display:inline-flex;align-items:center}
  .day-edit:hover{color:var(--purple-deep)}
  .day-edit svg{width:13px;height:13px}

  /* ============ BUTTONS ============ */
  .btn{border:1px solid transparent;padding:13px 22px;font-family:"Archivo";font-weight:600;font-size:14px;
    letter-spacing:.01em;transition:background .12s,color .12s,border-color .12s}
  .btn-primary{background:var(--purple);border-color:var(--purple);color:#fff}
  .btn-primary:hover{background:var(--purple-deep);border-color:var(--purple-deep)}
  .btn-dark{background:var(--black);border-color:var(--black);color:#fff}
  .btn-dark:hover{background:#2A2830;border-color:#2A2830}
  .btn-line{background:transparent;border-color:var(--black);color:var(--black)}
  .btn-line:hover{background:var(--black);color:#fff}
  .btn-brand-line{background:#fff;border-color:var(--purple);color:var(--purple-deep)}
  .btn-brand-line:hover{background:var(--purple);border-color:var(--purple);color:#fff}
  .btn-sm{padding:9px 15px;font-size:12.5px}
  .btn-clock{border-radius:11px}
  .btn-ghost{background:none;border:0;color:var(--purple-deep);font-family:"IBM Plex Mono";font-size:11px;
    letter-spacing:.1em;text-transform:uppercase;padding:6px 0;border-bottom:1px solid var(--purple)}
  .btn-ghost:hover{color:var(--black);border-color:var(--black)}
  .btn-cell{background:none;border:1px solid var(--rule);padding:6px 12px;font-family:"IBM Plex Mono";
    font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--text)}
  .btn-cell:hover{border-color:var(--black);background:var(--black);color:#fff}
  .linkish{background:none;border:0;color:var(--purple-deep);font-family:"IBM Plex Mono";font-size:11px;letter-spacing:.1em;text-transform:uppercase;padding:0}

  /* ============ CLOCK PANEL (centered) ============ */
  .clockpanel{display:flex;flex-direction:column;align-items:center;text-align:center;gap:16px;
    padding:34px 20px 38px;border-bottom:1px solid var(--rule)}
  .clockpanel .since{font-family:"IBM Plex Mono";font-size:12.5px;color:var(--muted)}
  .clock-actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
  .sched-today{font-family:"IBM Plex Mono";font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
  .brk-strip{display:flex;align-items:center;gap:18px;flex-wrap:wrap;justify-content:center;padding:16px 18px;margin-top:22px;
    background:var(--purple-wash);border-left:3px solid var(--purple)}
  .brk-count{font-family:"IBM Plex Mono";font-size:26px;font-weight:500;color:var(--purple-deep)}
  .mini{font-size:12.5px;color:var(--muted)}

  /* ============ ACCORDION ============ */
  .caret{display:inline-block;width:12px;font-family:"IBM Plex Mono";color:var(--muted);transition:transform .14s}
  .caret.open{transform:rotate(90deg);color:var(--purple-deep)}
  .day-row{cursor:pointer}
  .day-row:hover td{background:var(--purple-wash)}
  .day-cell{display:flex;align-items:center;gap:10px;font-weight:600}
  .expand td{background:#F6F4F8;padding:0;border-bottom:1px solid var(--rule)}
  .expand-in{padding:20px 0 22px 22px;border-left:3px solid var(--purple)}
  .loglist{list-style:none;margin:14px 0 0;padding:0;max-width:640px}
  .loglist li{padding:9px 0;border-bottom:1px solid var(--rule-soft);font-size:14px;display:flex;gap:12px}
  .loglist li:last-child{border-bottom:0}
  .loglist li:before{content:"";width:5px;height:5px;background:var(--purple);flex:none;margin-top:8px}
  .empty{color:var(--muted);font-size:13.5px;padding:14px 0}

  /* ============ FORMS ============ */
  .field{display:flex;flex-direction:column;gap:7px}
  .field label{font-family:"IBM Plex Mono";font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted)}
  input[type=text],input[type=date],input[type=datetime-local],input[type=number],input[type=time],select{
    font-family:"Barlow";font-size:14.5px;border:0;border-bottom:1px solid var(--black);padding:8px 0;
    width:100%;background:transparent;color:var(--text)}
  input:focus,select:focus{outline:0;border-bottom-color:var(--purple);box-shadow:0 1px 0 0 var(--purple)}
  input[type=date],input[type=datetime-local],input[type=number],input[type=time]{font-family:"IBM Plex Mono";font-size:13.5px}
  select{font-family:"Barlow"}
  .inline-form{display:flex;gap:20px;align-items:flex-end;flex-wrap:wrap}
  .inline-form .grow{flex:1;min-width:210px}
  .rate-in{width:92px;text-align:right}
  .err{color:#A81E27;font-size:12.5px;margin-top:8px;min-height:1em}

  /* ============ PAY ============ */
  .period{padding-top:18px;margin-top:40px;border-top:2px solid var(--black)}
  .period:first-of-type{margin-top:8px}
  .period.current{border-top-color:var(--purple)}
  .period-head{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:14px}
  .period-title{font-family:"Archivo";font-weight:700;font-size:16px}
  .period.current .period-title{color:var(--purple-deep)}
  .period-tag{font-family:"IBM Plex Mono";font-size:9px;letter-spacing:.13em;text-transform:uppercase;
    color:var(--purple);background:#fff;border:1px solid var(--purple);padding:2px 7px}
  .period-total{margin-left:auto;font-family:"IBM Plex Mono";font-size:19px;font-weight:600}
  .dl-btn{margin-left:auto;background:#fff;border:1px solid var(--purple);color:var(--purple);
    width:26px;height:26px;display:inline-flex;align-items:center;justify-content:center;
    font-size:14px;line-height:1;align-self:center;cursor:pointer}
  .dl-btn:hover{background:var(--purple-wash)}
  .x-btn{background:none;border:0;color:var(--muted);font-family:"IBM Plex Mono";font-size:11px;letter-spacing:.1em;text-transform:uppercase}
  .x-btn:hover{color:#A81E27}

  .note{border-left:3px solid var(--purple);padding:12px 0 12px 16px;font-size:13px;background:var(--purple-wash)}
  .note.warn{border-left-color:#A81E27;background:#FBEFF0}
  .totals{display:flex;gap:34px;flex-wrap:wrap;padding-top:18px}
  .stat .k{font-family:"IBM Plex Mono";font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted)}
  .stat .v{font-family:"IBM Plex Mono";font-size:23px;font-weight:600;margin-top:3px}

  /* ============ CALENDAR ============ */
  /* calendar + priorities side by side (calendar left, priorities right) */
  .cal-split{display:grid;grid-template-columns:1fr 322px;gap:24px;align-items:start}
  @media(max-width:920px){.cal-split{grid-template-columns:1fr}}
  .panel{border:1px solid var(--rule-soft);background:#fff;padding:22px;border-radius:16px;
    box-shadow:0 1px 2px rgba(20,16,25,.04),0 8px 22px rgba(20,16,25,.05)}
  .panel-head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:16px;
    padding-bottom:12px;border-bottom:1px solid var(--rule-soft)}
  .panel-head h2{font-size:14px;font-weight:600}
  .panel-head .meta{margin-left:auto}

  .cal-head{display:flex;align-items:center;gap:8px;margin-bottom:16px;flex-wrap:wrap}
  .cal-title{font-family:"Archivo";font-weight:600;font-size:16px;min-width:150px}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);border:1px solid var(--rule-soft);
    border-radius:14px;overflow:hidden}
  .dow{font-size:11px;color:var(--muted);padding:9px 6px;text-align:center;font-weight:600;
    background:#FAF9FB;border-bottom:1px solid var(--rule-soft)}
  .cell{min-height:94px;border-right:1px solid var(--rule-soft);border-bottom:1px solid var(--rule-soft);
    padding:7px 7px 8px;background:#fff;text-align:left;font-family:inherit;display:block;width:100%}
  .cell:nth-child(7n){border-right:0}
  .cell:hover{background:var(--purple-wash)}
  .cell.pad{background:#FBFAFC;cursor:default}
  .cell.pad:hover{background:#FBFAFC}
  .dnum{font-family:"IBM Plex Mono";font-size:12px;font-weight:500;color:#4A4553;display:inline-grid;
    place-items:center;width:22px;height:22px;margin-bottom:4px;border-radius:50%}
  .cell.today .dnum{background:var(--purple);color:#fff;font-weight:600}
  .ev{font-size:10.5px;padding:2px 9px;margin-top:3px;line-height:1.4;display:block;border-radius:20px;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .ev.off{background:var(--purple);color:#fff}
  .ev.pri{background:#EDEBF0;color:#4A4553}
  .ev.pri.done{opacity:.5;text-decoration:line-through}

  /* priorities — plain list */
  .pri-row{display:flex;align-items:flex-start;gap:11px;padding:11px 0;border-bottom:1px solid var(--rule-soft)}
  .pri-row:last-of-type{border-bottom:0}
  .pri-check{width:15px;height:15px;flex:none;border:1px solid #A9A5B0;background:#fff;margin-top:3px;
    display:grid;place-items:center;font-family:"IBM Plex Mono";font-size:9px;color:#fff;padding:0}
  .pri-check.done{background:var(--purple);border-color:var(--purple)}
  .pri-main{flex:1;min-width:0}
  .pri-title{font-weight:500;font-size:14px}
  .pri-row.done .pri-title{text-decoration:line-through;color:var(--muted)}
  .pri-meta{font-size:11.5px;color:var(--muted);margin-top:1px}
  .pri-meta .due{color:var(--purple-deep)}
  .pri-meta .over{color:#A81E27}
  .pri-x{background:none;border:0;color:#B9B6BE;font-size:15px;line-height:1;padding:2px 4px}
  .pri-x:hover{color:#A81E27}
  .pri-move{display:flex;flex-direction:column;gap:1px;flex:none;margin-top:1px}
  .pri-drag{cursor:grab}
  .pri-sheet{display:inline-flex;align-items:center;gap:7px;max-width:100%;background:#E6F4EA;color:#0B6B33;
    border:1px solid #A8D5B8;border-radius:6px;padding:3px 9px;font-size:13px;font-weight:600;text-decoration:none}
  .pri-sheet:hover{background:#D8EDDF;border-color:#0F9D58}
  .pri-sheet svg{width:14px;height:14px;flex:none}
  .pri-sheet .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .pri-link{background:none;border:0;color:#B9B6BE;cursor:pointer;padding:2px 5px;line-height:1;display:inline-flex;align-items:center}
  .pri-link svg{width:15px;height:15px}
  .pri-link:hover{color:#0F9D58}
  .pri-link.on{color:#0F9D58}
  /* --- redesigned project row: line 1 title/link, line 2 priority + due --- */
  .pri-line1{display:flex;min-width:0}
  .pri-line2{display:flex;align-items:center;gap:8px;margin-top:6px;flex-wrap:wrap}
  .pri-p{display:inline-flex;align-items:center;gap:3px;font-family:"IBM Plex Mono",monospace;font-size:11px;font-weight:700;
    letter-spacing:.04em;border:1px solid #C7C3CE;background:#fff;color:#6E6880;border-radius:5px;padding:2px 6px;cursor:pointer;line-height:1.3}
  .pri-p:hover{border-color:var(--purple)}
  .pri-p .pbox{width:12px;height:12px;border:1px solid #C7C3CE;border-radius:3px;display:inline-block}
  .pri-p .pn{font-weight:700}
  .pri-p.set{border-style:solid}
  .pri-due-wrap{display:inline-flex;align-items:center;gap:6px}
  .pri-duev{font-size:11.5px;color:var(--purple-deep)}
  .pri-duev.over{color:#A81E27;font-weight:600}
  .pri-due-toggle{background:none;border:0;cursor:pointer;color:#B9B6BE;padding:3px;display:inline-flex;align-items:center;line-height:1}
  .pri-due-toggle:hover{color:var(--purple)}
  .pri-due-toggle .chev{display:inline-block;width:7px;height:7px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;
    transform:rotate(45deg);transition:transform .15s ease;margin-bottom:2px}
  .pri-due-toggle.open .chev{transform:rotate(225deg);margin-bottom:-2px}
  .pri-due-in{font-family:"Barlow";font-size:12px;padding:3px 6px;border:1px solid #C7C3CE;border-radius:5px;color:#000;background:#fff;color-scheme:only light}
  /* --- rounded (oval) add-project box --- */
  .pri-add .btn-sm{border-radius:22px;padding-left:20px;padding-right:20px}
  .pri-add input{border-radius:9px}
  .pri-add.collapsed{padding-top:4px}
  .pri-add-btn{width:100%;justify-content:center}
  .pri-add-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:4px}
  .pri-color-row{display:flex;gap:16px;align-items:flex-start;margin-top:4px;flex-wrap:wrap}
  .pri-recent{display:flex;flex-direction:column;gap:7px;padding-top:2px}
  .pri-recent-lbl{font-family:"IBM Plex Mono",monospace;font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
  .pri-recent-swatches{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}
  .pri-recent-sw{width:24px;height:24px;border-radius:6px;border:1px solid var(--rule);cursor:pointer;padding:0}
  .pri-recent-sw:hover{transform:scale(1.08);border-color:var(--purple)}
  .pri-recent-none{font-size:12px;color:var(--muted)}
  .w-sheet{display:inline-flex;align-items:center;gap:6px;color:#0B6B33;text-decoration:none;font-weight:600}
  .w-sheet svg{width:13px;height:13px;flex:none;stroke:#0F9D58}
  .w-sheet:hover span{text-decoration:underline}
  .pri-drag:active{cursor:grabbing}
  .pri-dragging{opacity:.4}
  .pri-over{box-shadow:inset 0 2px 0 var(--purple)}
  .pri-mv{background:none;border:0;color:#B9B6BE;font-size:9px;line-height:1;padding:1px 3px;cursor:pointer}
  .pri-mv:hover:not(:disabled){color:var(--purple)}
  .pri-mv:disabled{opacity:.3;cursor:default}
  .opt{font-family:"IBM Plex Mono";font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:400}
  .da-nodue{display:flex;align-items:center;gap:8px;font-size:13px;margin-bottom:20px;cursor:pointer}
  .da-nodue input{width:16px;height:16px;accent-color:var(--purple)}
  .nt-reim{display:flex;align-items:center;gap:9px;font-size:13.5px;margin-bottom:20px;cursor:pointer;font-weight:600}
  .nt-reim input{width:16px;height:16px;accent-color:var(--purple)}
  .pri-add{margin-top:18px;padding-top:16px;border-top:1px solid var(--rule)}
  .pri-add .field{margin-bottom:12px}

  /* schedule — horizontal time blocks per day */
  .sched-row{display:flex;align-items:center;gap:14px;padding:11px 0;border-bottom:1px solid var(--rule-soft)}
  .sched-row.off .sched-day{color:var(--muted);font-weight:500}
  .sched-day{width:96px;flex:none;font-weight:600}
  .slot-wrap{display:flex;flex-wrap:wrap;align-items:center;gap:8px;flex:1;min-width:0}
  .slot{position:relative;display:inline-flex}
  .range-in{width:140px;border:1px solid var(--rule);padding:7px 11px;border-radius:20px;text-align:center;
    font-family:"Barlow";font-size:13px;background:#fff}
  .range-in:focus{border-color:var(--purple);box-shadow:none;outline:0}
  .range-in.bad{border-color:#A81E27}
  .slot.ro .mono{display:inline-block;border:1px solid var(--rule-soft);padding:6px 11px;border-radius:20px;font-size:13px;text-align:center}
  .slot-x{position:absolute;top:-6px;right:-6px;width:15px;height:15px;border:1px solid #C85560;border-radius:50%;
    background:#fff;display:none;cursor:pointer;padding:0;font-size:0;box-shadow:0 1px 2px rgba(0,0,0,.12)}
  .slot-x::before,.slot-x::after{content:"";position:absolute;top:50%;left:50%;width:7px;height:1.25px;
    background:#C85560;border-radius:1px}
  .slot-x::before{transform:translate(-50%,-50%) rotate(45deg)}
  .slot-x::after{transform:translate(-50%,-50%) rotate(-45deg)}
  .slot:focus-within .slot-x{display:block}
  .slot-add{position:relative;width:26px;height:26px;flex:none;border:0;border-radius:6px;background:var(--purple);
    cursor:pointer;padding:0;font-size:0;transition:background .14s}
  .slot-add:hover{background:var(--purple-deep)}
  .slot-add::before,.slot-add::after{content:"";position:absolute;top:50%;left:50%;background:#fff;
    border-radius:0;transform:translate(-50%,-50%)}
  .slot-add::before{width:14px;height:3px}
  .slot-add::after{width:3px;height:14px}
  .sched-hrs{margin-left:auto;flex:none;font-family:"IBM Plex Mono";font-size:13px;color:var(--muted)}
  .sched-off{font-size:13px;color:var(--muted)}

  /* payroll reimbursements */
  .emp-link{background:none;border:0;padding:0;font:inherit;color:var(--text);cursor:pointer;text-align:left;border-bottom:1px dashed var(--rule)}
  .emp-link:hover{color:var(--purple-deep);border-bottom-color:var(--purple)}
  .rb-hint{font-size:11.5px;color:var(--muted);margin:8px 0 0}
  .rb-list{margin:2px 0 6px}
  .rb-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--rule-soft)}
  .rb-lbl{flex:1;font-size:13.5px}
  .rb-amt{font-family:"IBM Plex Mono";font-size:13px;color:var(--text)}
  .rb-x{background:none;border:0;color:var(--muted);font-size:17px;line-height:1;cursor:pointer;padding:0 2px}
  .rb-x:hover{color:#C85560}
  .rb-none{font-size:13px;color:var(--muted);padding:8px 0 4px}
  .rb-pending{background:var(--purple-wash);border-radius:12px;padding:12px 14px;margin-bottom:18px}
  .rb-pending .ml{margin-bottom:4px}
  .rb-pending .rb-row{border-bottom-color:rgba(0,0,0,.07)}
  .rb-pending .rb-row:last-child{border-bottom:0}
  .btn-xs{padding:5px 11px;font-size:12px}
  .rb-add{border-top:1px solid var(--rule);padding-top:16px;margin-top:10px}

  /* live shift clock */
  .liveclock{font-family:"IBM Plex Mono";font-weight:500;font-size:clamp(40px,11vw,58px);line-height:1;
    letter-spacing:-.02em;color:var(--text)}

  /* ============ MODAL / TOAST / ALARM ============ */
  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.62);display:grid;place-items:center;z-index:60;padding:20px}
  .modal{background:#fff;width:100%;max-width:440px;padding:28px;border-top:3px solid var(--purple);max-height:88vh;overflow:auto}
  .modal h3{font-size:18px;margin-bottom:5px}
  .modal .sub{color:var(--muted);font-family:"IBM Plex Mono";font-size:11px;letter-spacing:.1em;text-transform:uppercase;margin:0 0 22px}
  .modal .field{margin-bottom:20px}

  /* profile modal */
  .modal.dark{background:#0B0910;color:#EAE7F0;border-top-color:var(--purple)}
  .modal.dark h3{color:#fff}
  .modal.dark input[type=text],.modal.dark input[type=password]{font-family:"Barlow";font-size:14.5px;width:100%;background:#17131F;border:1px solid #2E2838;border-radius:8px;padding:9px 11px;color:#fff}
  .modal.dark input:focus{border-color:var(--purple);box-shadow:none}
  .modal.dark .field label{color:#9A93A8}
  .pf-top{display:flex;gap:16px;align-items:flex-start;margin-bottom:22px}
  .pf-av{width:54px;height:54px;flex:none;display:grid;place-items:center;font-family:"IBM Plex Mono";font-weight:600;font-size:18px}
  .pf-pick{flex:1;display:flex;flex-direction:column;gap:11px}
  .pf-tabs{display:flex;gap:8px}
  .pf-tab{display:flex;align-items:center;gap:7px;background:none;border:1px solid #2E2838;color:#B8B2C4;padding:6px 10px;border-radius:8px;cursor:pointer;font:inherit;font-size:12px}
  .pf-tab.active{border-color:var(--purple);color:#fff}
  .pf-dot{width:13px;height:13px;border-radius:50%;border:1px solid rgba(255,255,255,.3)}
  .pf-wheel{width:140px;height:140px;border-radius:50%;cursor:crosshair;
    background:radial-gradient(circle,#fff 0%,rgba(255,255,255,0) 68%),conic-gradient(from 0deg,hsl(0,100%,50%),hsl(60,100%,50%),hsl(120,100%,50%),hsl(180,100%,50%),hsl(240,100%,50%),hsl(300,100%,50%),hsl(360,100%,50%))}
  .pf-presets{display:flex;gap:8px}
  .pf-preset{width:22px;height:22px;border-radius:50%;border:1px solid rgba(255,255,255,.25);cursor:pointer;padding:0}
  .pf-ro{font-family:"IBM Plex Mono";font-size:14px;color:#EAE7F0}
  .modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:26px;flex-wrap:wrap}
  .edit-actions{justify-content:space-between;align-items:center}
  .edit-actions .ea-right{display:flex;gap:10px;align-items:center}
  .btn-danger{background:#A81E27;color:#fff;border:1px solid #A81E27}
  .btn-danger:hover{background:#8E1720;border-color:#8E1720}
  .del-shift{background:none;border:0;cursor:pointer;color:#C86A70;padding:5px;display:inline-flex;align-items:center;line-height:1;border-radius:7px}
  .del-shift svg{width:19px;height:19px}
  .del-shift:hover{color:#A81E27;background:rgba(168,30,39,.08)}
  .req{color:var(--purple-deep)}
  .role-row{display:flex;align-items:center;gap:14px;justify-content:space-between;padding:11px 0;border-bottom:1px solid var(--rule-soft)}
  .role-row:last-child{border-bottom:0}
  .role-sel{border:1px solid var(--rule);background:#fff;font-family:"Barlow";font-size:13px;padding:7px 9px}
  .role-sel:focus{border-color:var(--purple);outline:none}
  .toast{position:fixed;bottom:0;left:0;right:0;background:var(--black);color:#fff;padding:15px 22px;
    font-family:"IBM Plex Mono";font-size:12px;letter-spacing:.12em;text-transform:uppercase;z-index:80;text-align:center}
  .alarm{position:fixed;left:0;right:0;bottom:0;z-index:70;background:var(--purple);color:#fff;padding:16px 22px;
    display:flex;align-items:center;gap:18px;justify-content:center;flex-wrap:wrap}
  .alarm b{font-family:"Archivo";font-size:15px}
  .alarm .btn{border-color:#fff;background:#fff;color:var(--purple-deep)}
  .alarm .btn.o{background:transparent;color:#fff}
  .alarm .btn.o:hover{background:#fff;color:var(--purple-deep)}

  .back{background:none;border:0;color:var(--muted);font-family:"IBM Plex Mono";font-size:10.5px;
    letter-spacing:.13em;text-transform:uppercase;padding:0;margin-bottom:18px}
  .back:hover{color:var(--black)}

  /* home widgets */
  /* ===== Home page (soft, home-only) ===== */
  body.home-bg{background:#ECEAF2}
  .home-top{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:26px}
  .home-h1{font-family:"Archivo";font-weight:700;font-size:26px;letter-spacing:-.01em}
  .home-hi{color:var(--muted);font-size:13px;margin-top:3px}
  .home-empty{color:var(--muted);font-size:14px;padding:20px}

<script>
/* ================= DEMO DATA (in-memory; resets on refresh) ================= */
const now=Date.now(), DAY=86400000, HR=3600000, MIN=60000;
function at(d,h,m){const x=new Date(now-d*DAY);x.setHours(h,m,0,0);return x.getTime();}
function pad(n){return String(n).padStart(2,'0');}
function dateKey(ts){const d=new Date(ts);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function keyToDate(k){return new Date(k+'T00:00:00');}
function addDaysKey(k,n){const d=keyToDate(k);d.setDate(d.getDate()+n);return dateKey(d);}
function initials(n){return n.split(' ').map(p=>p[0]).slice(0,2).join('').toUpperCase();}

/* ---------- Supabase ---------- */
const SUPABASE_URL='https://cfjuvyhyepxumgonuqsf.supabase.co';
const SUPABASE_KEY='sb_publishable_pLqdSSmHVTPwEAi7pykS1A_BVdiF7mZ';
let sb=null;
/* Session lives in per-tab sessionStorage: a refresh keeps you signed in, closing the tab/browser or
   IDLE_LIMIT_MS of inactivity requires signing in again. Only the login token is stored — never timecard data. */
const IDLE_LIMIT_MS=2*60*60*1000;   /* 2 hours — change this one number to adjust */
try{ if(window.supabase&&window.supabase.createClient) sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true,storage:window.sessionStorage}}); }catch(e){ sb=null; }
function markActive(){try{sessionStorage.setItem('otgLastActive',String(Date.now()));}catch(e){}}
function idleTooLong(){try{const t=+sessionStorage.getItem('otgLastActive')||0;return t>0&&(Date.now()-t)>IDLE_LIMIT_MS;}catch(e){return false;}}
['click','keydown','pointerdown','touchstart'].forEach(ev=>document.addEventListener(ev,markActive,{capture:true,passive:true}));
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState!=='visible')return;
  if(currentUser&&idleTooLong()){signOut();} else markActive();
});

/* profiles are loaded from Supabase at sign-in (clean slate — no demo data) */
let employees=[];
let pendingRoles=[];
let seq=100; const nid=()=>'s'+(seq++);
/* NOTE: shifts, logs, schedules, calendar, projects, notifications, payroll
   are still in-memory in this phase — they migrate to Supabase next. */
let shifts=[];
let workLogs={};

/* weekly schedule — employee sets their own */
const DOW=['sun','mon','tue','wed','thu','fri','sat'];
const DOW_LABEL={sun:'Sunday',mon:'Monday',tue:'Tuesday',wed:'Wednesday',thu:'Thursday',fri:'Friday',sat:'Saturday'};
function blankWeek(){return {sun:[],mon:[],tue:[],wed:[],thu:[],fri:[],sat:[]};}
let schedules={};

/* time off + priorities */
let timeOff=[];
let priorities=[];
let notices=[];   /* out-of-hours notices sent to the manager */
let messages=[];  /* per-recipient notifications: {id,to,from,text,ts,read} */
let msgSeq=0;      /* guarantees a unique id per recipient copy */

let payPeriods=[];
let periodReimb=[]; /* manager-added reimbursements tied to a period+employee: {id,periodId,empId,label,amount} */
let auditLog=[];

/* home widgets: per-user layout + personal reminders/to-dos (in memory) */
let homeWidgets={};   /* userId -> [widget keys] */
let widgetStore={};   /* userId -> {reminders:[], todos:[]} */
let homePos={};       /* userId -> { key:{r,c} }  explicit 4x4 placement */

/* ================= STATE ================= */
let currentUser=null, selectedEmpId=null, activeTab='today';
let breakTimer=null, breakEndsAt=null, breakActive=false, breakUsed={};
const BREAK_BUDGET=30*MIN;
let audioCtx=null, alarmLoop=null, openDay=null, menuOpen=false;
let calCursor=new Date(now).getFullYear()+'-'+pad(new Date(now).getMonth()+1);
let logReminder=false;

/* ================= HELPERS ================= */
function fmtTime(ts){if(ts==null)return '—';const d=new Date(ts);let h=d.getHours(),m=d.getMinutes();const ap=h<12?'AM':'PM';h=h%12||12;return h+':'+pad(m)+' '+ap;}
function fmtHM(hm){if(!hm)return '—';let [h,m]=hm.split(':').map(Number);const ap=h<12?'AM':'PM';h=h%12||12;return h+':'+pad(m)+' '+ap;}
function fmtDay(ts){return new Date(ts).toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'});}
function fmtDayKey(k){return keyToDate(k).toLocaleDateString(undefined,{month:'short',day:'numeric'});}
function fmtDur(ms){if(ms<0)ms=0;return Math.floor(ms/HR)+'h '+pad(Math.floor((ms%HR)/MIN))+'m';}
function fmtHrs(h){return Math.floor(h)+'h '+pad(Math.round((h%1)*60))+'m';}
function fmtWatch(ms){if(ms<0)ms=0;return pad(Math.floor(ms/HR))+':'+pad(Math.floor((ms%HR)/MIN))+':'+pad(Math.floor((ms%MIN)/1000));}
function money(n){return '$'+n.toFixed(2);}
function esc(s){return (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function netMs(s){return (s.clockOut||Date.now())-s.clockIn;}
function openShift(id){return shifts.find(s=>s.empId===id&&s.clockOut===null);}
function daysFor(id){return shifts.filter(s=>s.empId===id).sort((a,b)=>b.clockIn-a.clockIn);}
function weekTotal(id){const w=now-7*DAY;return shifts.filter(s=>s.empId===id&&s.clockIn>=w).reduce((t,s)=>t+netMs(s),0);}
/* role helpers — managers and co-managers share management powers; co-managers + employees clock in */
function canManage(u){return !!u&&(u.role==='manager'||u.role==='comanager');}
function clocksIn(u){return !!u&&u.role!=='manager';}
function hourlyStaff(){return employees.filter(e=>e.role==='comanager'||e.role==='employee');}
function periodMs(id,p){return shifts.filter(s=>{const k=dateKey(s.clockIn);return s.empId===id&&k>=p.start&&k<=p.end;}).reduce((t,s)=>t+netMs(s),0);}
function nameOf(id){const e=employees.find(x=>x.id===id);return e?e.name:'—';}
function hmToMin(hm){const [h,m]=hm.split(':').map(Number);return h*60+m;}
function slotHours(sl){const v=(hmToMin(sl.end)-hmToMin(sl.start))/60;return v>0?v:0;}
function dayHours(day){if(!Array.isArray(day)||!day.length)return 0;return day.reduce((t,sl)=>t+slotHours(sl),0);}
function weekHours(id){const s=schedules[id];if(!s)return 0;return DOW.reduce((t,k)=>t+dayHours(s[k]),0);}
function slotsForDate(id,ts){const s=schedules[id];if(!s)return [];const d=s[DOW[new Date(ts).getDay()]];return Array.isArray(d)?d:[];}
function slotsOverlap(a,b){return hmToMin(a.start)<hmToMin(b.end)&&hmToMin(b.start)<hmToMin(a.end);}
function isOutsideSchedule(id,ts){const slots=slotsForDate(id,ts);if(!slots.length)return true;
  const m=new Date(ts).getHours()*60+new Date(ts).getMinutes();return !slots.some(sl=>m>=hmToMin(sl.start)&&m<=hmToMin(sl.end));}
function weekStartKey(){const d=new Date(now);d.setDate(d.getDate()-d.getDay());return dateKey(d);}
function workedThisWeek(id){const ws=weekStartKey();
  return shifts.filter(s=>s.empId===id&&dateKey(s.clockIn)>=ws).reduce((t,s)=>t+netMs(s),0);}
/* ---- live Supabase state (real session only; demo bypass stays in-memory) ---- */
let liveSession=false;
function live(){return !!sb&&liveSession;}
function shiftFromRow(r){return {id:r.id,empId:r.user_id,clockIn:new Date(r.clock_in).getTime(),
  clockOut:r.clock_out?new Date(r.clock_out).getTime():null,edited:!!r.edited};}
function upsertShift(s){const i=shifts.findIndex(x=>x.id===s.id);if(i>=0)shifts[i]=s;else shifts.push(s);}
/* one compact field: accepts "9-5", "9am-5pm", "09:00-17:00", "9:30 to 6" */
function parseOne(t){
  const m=t.match(/^(\d{1,2})(?::(\d{2}))?(am|pm)?$/);
  if(!m)return null;
  let h=+m[1],mi=m[2]?+m[2]:0;const ap=m[3];
  if(h>23||mi>59)return null;
  if(ap==='pm'&&h<12)h+=12;
  if(ap==='am'&&h===12)h=0;
  return {hm:pad(h)+':'+pad(mi),explicit:!!ap};
}
function parseRange(str){
  const s=(str||'').toLowerCase().replace(/\s/g,'').replace(/[–—]/g,'-');
  const parts=s.split(/-|to/).filter(Boolean);
  if(parts.length!==2)return null;
  const a=parseOne(parts[0]),b=parseOne(parts[1]);
  if(!a||!b)return null;
  let end=b.hm;
  /* "9-5" means 9am to 5pm, not 5am */
  if(!b.explicit&&hmToMin(end)<=hmToMin(a.hm)){
    const h=+end.split(':')[0];
    if(h<12)end=pad(h+12)+':'+end.split(':')[1];
  }
  if(hmToMin(end)<=hmToMin(a.hm))return null;
  return {start:a.hm,end};
}

/* ================= LOGIN ================= */
/* ================= AUTH (Supabase) ================= */
let authMode='signin', authBusy=false;
/* ===== TEMP PREVIEW BYPASS — remove this whole block when Supabase auth is back =====
   Lets you click "Sign in" (no credentials) to preview. Seeds the team in memory; resets on refresh. */

function pwEyeBtn(id){return `<button type="button" class="pw-eye" tabindex="-1" aria-label="Show password" onclick="togglePw('${id}',this)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg></button>`;}
function togglePw(id,btn){const el=document.getElementById(id);if(!el)return;const show=el.type==='password';el.type=show?'text':'password';btn.classList.toggle('on',show);btn.setAttribute('aria-label',show?'Hide password':'Show password');}
function renderLogin(msg,isErr){
  const el=document.getElementById('acctList'); if(!el)return;
  const note=msg?`<div class="auth-msg ${isErr?'err':''}">${esc(msg)}</div>`:'';
  const svcDown=!sb?`<div class="auth-msg err">Can't load the sign-in service. Check your internet connection and refresh.</div>`:'';
  const form=authMode==='signin'
    ? `<div class="afield"><label>Email</label><input type="email" id="auEmail" autocomplete="email" onkeydown="if(event.key==='Enter')authSignIn()"></div>
       <div class="afield"><label>Password</label><div class="pw-wrap"><input type="password" id="auPass" autocomplete="current-password" onkeydown="if(event.key==='Enter')authSignIn()">${pwEyeBtn('auPass')}</div></div>
       <button class="btn btn-primary auth-go" id="authGo" onclick="authSignIn()">Sign in</button>`
    : `<div class="afield"><label>Full name</label><input type="text" id="auName" autocomplete="name" placeholder="First Last"></div>
       <div class="afield"><label>Email</label><input type="email" id="auEmail" autocomplete="email"></div>
       <div class="afield"><label>Password <span class="opt2">8+ characters</span></label><div class="pw-wrap"><input type="password" id="auPass" autocomplete="new-password" onkeydown="if(event.key==='Enter')authSignUp()">${pwEyeBtn('auPass')}</div></div>
       <button class="btn btn-primary auth-go" id="authGo" onclick="authSignUp()">Create account</button>`;
  el.innerHTML=`<div class="auth-tabs">
      <button class="auth-tab ${authMode==='signin'?'on':''}" onclick="authMode='signin';renderLogin()">Sign in</button>
      <button class="auth-tab ${authMode==='signup'?'on':''}" onclick="authMode='signup';renderLogin()">Create account</button>
    </div>${svcDown}${form}${note}<p class="build-tag">Build 18 · iMessage bubbles & avatar colors</p>`;
}
function authBusyState(b,label){authBusy=b;const g=document.getElementById('authGo');if(g){g.disabled=b;g.textContent=label||(authMode==='signin'?'Sign in':'Create account');}}
async function authSignIn(){
  if(authBusy||!sb)return;
  const email=(document.getElementById('auEmail').value||'').trim().toLowerCase();
  const pass=document.getElementById('auPass').value||'';
  if(!email||!pass){renderLogin('Enter your email and password.',true);return;}
  authBusyState(true,'Signing in…');
  try{
    const {data,error}=await sb.auth.signInWithPassword({email,password:pass});
    if(error){renderLogin(error.message,true);return;}
    await enterApp(data.session);
  }catch(e){renderLogin('Can\'t reach the server — check your internet and try again.',true);}
  finally{authBusyState(false);}
}
async function authSignUp(){
  if(authBusy||!sb)return;
  const name=(document.getElementById('auName').value||'').trim();
  const email=(document.getElementById('auEmail').value||'').trim().toLowerCase();
  const pass=document.getElementById('auPass').value||'';
  if(!name){renderLogin('Enter your full name.',true);return;}
  if(!email){renderLogin('Enter your email.',true);return;}
  if(pass.length<8){renderLogin('Password needs at least 8 characters.',true);return;}
  authBusyState(true,'Creating account…');
  try{
    const {data,error}=await sb.auth.signUp({email,password:pass,options:{data:{full_name:name}}});
    if(error){renderLogin(error.message,true);return;}
    if(data.session){ await enterApp(data.session); }
    else { authMode='signin'; renderLogin('Account created — confirm via the email we sent, then sign in.'); }
  }catch(e){renderLogin('Can\'t reach the server — check your internet and try again.',true);}
  finally{authBusyState(false);}
}
async function loadProfiles(){
  const {data,error}=await sb.from('profiles').select('*').order('created_at',{ascending:true});
  if(error)throw error;
  employees=(data||[]).map(p=>({id:p.id,name:p.name||p.email,email:p.email,role:p.role,rate:Number(p.rate)||0,
    avatarColor:p.avatar_bg||'',initialsColor:p.avatar_fg||''}));
}
async function loadPendingRoles(){

let conversations=[], chatMsgs={}, chatPageOpen=false, chatOpenConv=null, chatChannel=null;

async function loadChat(){
  const [cr,mr,gr]=await Promise.all([
    sb.from('conversations').select('*'),
    sb.from('conversation_members').select('*'),
    sb.from('chat_messages').select('*').order('created_at',{ascending:true})
  ]);
  if(cr.error)throw cr.error; if(mr.error)throw mr.error; if(gr.error)throw gr.error;
  const memByConv={}, myRead={};
  (mr.data||[]).forEach(m=>{(memByConv[m.conversation_id]=memByConv[m.conversation_id]||[]).push(m.user_id);
    if(m.user_id===currentUser.id)myRead[m.conversation_id]=new Date(m.last_read_at).getTime();});
  conversations=(cr.data||[]).map(c=>({id:c.id,kind:c.kind,title:c.title||'',dmKey:c.dm_key||'',
    members:memByConv[c.id]||[],lastRead:myRead[c.id]||0}));
  chatMsgs={};
  (gr.data||[]).forEach(m=>appendChatMsg(m.conversation_id,{id:m.id,from:m.from_user,fromName:m.from_name,body:m.body,ts:new Date(m.created_at).getTime()}));
}
function subscribeChat(){
  if(!sb||chatChannel)return;
  chatChannel=sb.channel('chat-rt')
    .on('postgres_changes',{event:'INSERT',schema:'public',table:'chat_messages'},payload=>{
      const m=payload.new; if(!m)return;
      const known=conversations.some(c=>c.id===m.conversation_id);
      appendChatMsg(m.conversation_id,{id:m.id,from:m.from_user,fromName:m.from_name,body:m.body,ts:new Date(m.created_at).getTime()});
      if(!known){ loadChat().then(()=>{ if(chatPageOpen)render(); }); return; }
      if(chatPageOpen){ if(chatOpenConv===m.conversation_id)markRead(m.conversation_id); render(); }
      paintUserMenu();
    })
    .on('postgres_changes',{event:'INSERT',schema:'public',table:'conversation_members'},payload=>{
      if(payload.new&&payload.new.user_id===currentUser.id){ loadChat().then(()=>{ if(chatPageOpen)render(); }); }
    })
    .subscribe();
}

async function openOrCreateDM(otherId){
  const key=[currentUser.id,otherId].sort().join('|');
  let conv=conversations.find(c=>c.kind==='dm'&&c.dmKey===key);
  if(conv){closeModal();openConv(conv.id);return;}
  if(!live()){toast('Sign in to start a chat.');return;}
  const {data:existing}=await sb.from('conversations').select('*').eq('dm_key',key).maybeSingle();
  let convId;
  if(existing){
    convId=existing.id;

    if(!mem){ await sb.from('conversation_members').insert({conversation_id:convId,user_id:currentUser.id}); }
  }
  else{
    const {data:created,error}=await sb.from('conversations').insert({kind:'dm',dm_key:key,created_by:currentUser.id}).select().single();
    if(error){
      const {data:again}=await sb.from('conversations').select('*').eq('dm_key',key).maybeSingle();

      convId=again.id;

function miniRangeCal(startK,endK){
  const [sy,sm]=startK.split('-').map(Number);
  const first=new Date(sy,sm-1,1),lead=first.getDay(),total=new Date(sy,sm,0).getDate();
  const monthName=first.toLocaleDateString('en-US',{month:'long',year:'numeric'});
  let cells='';
  ['S','M','T','W','T','F','S'].forEach(d=>cells+=`<span class="mrc-dow">${d}</span>`);
  for(let i=0;i<lead;i++)cells+='<span class="mrc-cell pad"></span>';
  for(let d=1;d<=total;d++){
    const k=sy+'-'+pad(sm)+'-'+pad(d);
    const on=k>=startK&&k<=endK;
    cells+=`<span class="mrc-cell ${on?'on':''}">${d}</span>`;
  }
  const spanNote=(startK!==endK)?`<p class="mrc-note">${fmtDayKey(startK)} → ${fmtDayKey(endK)}</p>`:`<p class="mrc-note">${fmtDayKey(startK)}</p>`;
  return `<div class="mrc"><div class="mrc-head">${monthName}</div><div class="mrc-grid">${cells}</div>${spanNote}</div>`;
}

        id:session.user.id, email:(session.user.email||'').toLowerCase(), name:meta.full_name||''

    }catch(e){/* fall through to message below */}

  try{ await loadNotices(); }catch(e){ toast('Could not load notices: '+(e.message||e)); }
  try{ await loadAudit(); }catch(e){ toast('Could not load change log: '+(e.message||e)); }
  try{ await loadMyState(); }catch(e){ toast('Could not load your widgets: '+(e.message||e)); }
  try{ await loadChat(); }catch(e){ toast('Could not load messages: '+(e.message||e)); }
  subscribeShifts();

function profileWheelPick(ev){

  const R=Math.min(cx,cy), dist=Math.min(Math.sqrt(dx*dx+dy*dy)/R,1);
  let hue=Math.atan2(dx,-dy)*180/Math.PI; if(hue<0)hue+=360;
  const sat=Math.round(dist*100), light=Math.round(100-dist*50);
  setProfileColor(`hsl(${Math.round(hue)},${sat}%,${light}%)`);

function sendNotification(){
  const u=currentUser, err=document.getElementById('ntErr');
  const subject=(document.getElementById('ntSubj').value||'').trim();
  const text=(document.getElementById('ntMsg').value||'').trim();
  if(!text){err.textContent='Write a message.';return;}
  let recips=[];
  const toSel=document.getElementById('ntTo');
  if(toSel&&toSel.value==='all'){ recips=employees.filter(e=>e.id!==u.id); }
  else{
    const nm=(document.getElementById('ntWho').value||'').trim().toLowerCase();
    let who=employees.find(e=>e.id!==u.id&&e.name.toLowerCase()===nm);
    if(u.role==='employee'&&who&&!(who.role==='manager'||who.role==='comanager'))who=null;
    if(!who){err.textContent=u.role==='employee'?'Pick a manager or co-manager.':'Pick a valid name from your team.';return;}
    recips=[who];
  }
  if(live()){
    const rows=recips.map(r=>({to_user:r.id,from_user:u.id,from_name:u.name,subject:subject||null,body:text}));
    sb.from('messages').insert(rows).select().then(({data,error})=>{
      if(error){toast('Message not sent: '+error.message);return;}
      (data||[]).forEach(r=>{ if(!messages.some(m=>m.id===r.id)) messages.push(msgFromRow(r)); });
    });

    recips.forEach(r=>messages.push({id:'nt'+(++msgSeq),to:r.id,from:u.name,subject,text,ts:Date.now(),read:false}));

/* ================= HOME / WIDGETS ================= */
const WIDGETS=[
  {key:'clock',label:'Clock in / out',clockOnly:true},
  {key:'break',label:'Break',clockOnly:true},
  {key:'priorities',label:'Projects'},
  {key:'calendar',label:'Calendar'},
  {key:'notifications',label:'Notifications'},
  {key:'time',label:'Time'},
  {key:'reminders',label:'Reminders'},
  {key:'todos',label:'To-do list'},
];
function defaultWidgets(u){return u.role==='manager'?['time','priorities','notifications']:['clock','break','time','priorities'];}
function userWidgets(u){if(!homeWidgets[u.id])homeWidgets[u.id]=defaultWidgets(u).slice();return homeWidgets[u.id];}
function userStore(u){if(!widgetStore[u.id])widgetStore[u.id]={reminders:[],todos:[]};return widgetStore[u.id];}
function availableWidgets(u){return WIDGETS.filter(w=>!w.clockOnly||clocksIn(u));}
const GRID_N=4; /* 4x4 board */
const WDIM={time:{w:4,h:1},clock:{w:2,h:2},break:{w:1,h:1},priorities:{w:1,h:2},notifications:{w:2,h:1},calendar:{w:2,h:2},reminders:{w:2,h:2},todos:{w:2,h:2}};
function dimOf(k){return WDIM[k]||{w:2,h:1};}
function posMap(u){if(!homePos[u.id])homePos[u.id]={};return homePos[u.id];}
/* build occupancy grid from placed widgets, optionally excluding one key */
function occGrid(u,exclude){
  const pm=posMap(u),keys=userWidgets(u),g=Array.from({length:GRID_N+1},()=>Array(GRID_N+1).fill(null));
  keys.forEach(k=>{if(k===exclude)return;const p=pm[k];if(!p)return;const d=dimOf(k);
    for(let r=p.r;r<p.r+d.h;r++)for(let c=p.c;c<p.c+d.w;c++)if(r>=1&&r<=GRID_N&&c>=1&&c<=GRID_N)g[r][c]=k;});
  return g;
}
function fits(g,r,c,d){
  if(r<1||c<1||r+d.h-1>GRID_N||c+d.w-1>GRID_N)return false;
  for(let rr=r;rr<r+d.h;rr++)for(let cc=c;cc<c+d.w;cc++)if(g[rr][cc])return false;
  return true;
}
function firstFree(u,k,exclude){
  const g=occGrid(u,exclude),d=dimOf(k);
  for(let r=1;r<=GRID_N;r++)for(let c=1;c<=GRID_N;c++)if(fits(g,r,c,d))return {r,c};
  return null;
}
/* make sure every present widget has a position (largest first so defaults pack cleanly) */
function ensurePositions(u){
  const pm=posMap(u);
  const missing=userWidgets(u).filter(k=>!pm[k]);
  missing.sort((a,b)=>{const da=dimOf(a),db=dimOf(b);return (db.w*db.h)-(da.w*da.h);});
  missing.forEach(k=>{const spot=firstFree(u,k,k);if(spot)pm[k]=spot;});
}
function homeTab(){
  const u=currentUser;
  ensurePositions(u);
  const pm=posMap(u),keys=userWidgets(u);
  const cards=keys.map(k=>widgetCard(k)).join('');
  // 16 cell drop-zones for free placement (active while dragging)
  let cells='';
  for(let r=1;r<=GRID_N;r++)for(let c=1;c<=GRID_N;c++)
    cells+=`<div class="home-cell" style="--r:${r};--c:${c}" ondragover="wDragOver(event)" ondrop="wCellDrop(event,${r},${c})"></div>`;
  const board=keys.length?`<div class="widget-grid" id="homeGrid">${cells}${cards}</div>`
    :'<div class="home-empty">No widgets yet. Use “Add widget” to build your hub.</div>';
  return `<div class="home">
      <div class="home-top">
        <div><h1 class="home-h1">Dashboard</h1><p class="home-hi">Hi, ${esc(u.name.split(' ')[0])}</p></div>
        <button class="btn btn-primary btn-sm" onclick="openWidgetCatalog()">Add widget</button>
      </div>${board}</div>`;
}
function widgetCard(k){
  const w=WIDGETS.find(x=>x.key===k);if(!w)return '';
  if(w.clockOnly&&!clocksIn(currentUser))return '';
  const p=posMap(currentUser)[k];if(!p)return '';const d=dimOf(k);
  return `<div class="widget" style="--r:${p.r};--c:${p.c};--w:${d.w};--h:${d.h}" data-key="${k}">
      <div class="widget-head" draggable="true" ondragstart="wDragStart(event,'${k}')" ondragend="wDragEnd(event)">
        <span class="widget-title">${k==='time'?'':w.label}</span>
        <button class="widget-x" draggable="false" onclick="removeWidget('${k}')" title="Remove widget">&times;</button></div>
      <div class="widget-body">${widgetBody(k)}</div></div>`;
}
let dragKey=null;
function wDragStart(ev,key){dragKey=key;
  try{ev.dataTransfer.effectAllowed='move';ev.dataTransfer.setData('text/plain',key);}catch(e){}
  const g=document.getElementById('homeGrid');if(g)g.classList.add('dragging');
  const card=ev.target.closest('.widget');if(card)setTimeout(()=>card.classList.add('drag-src'),0);}
function wDragOver(ev){if(dragKey===null)return;ev.preventDefault();try{ev.dataTransfer.dropEffect='move';}catch(e){}}
function wCellDrop(ev,r,c){_wCellDrop(ev,r,c);saveMyState();}
function _wCellDrop(ev,r,c){
  ev.preventDefault();ev.stopPropagation();
  if(dragKey===null){cleanupDrag();return;}
  const u=currentUser,pm=posMap(u),d=dimOf(dragKey);
  // clamp target so the widget stays fully on the board
  let tr=Math.min(Math.max(1,r),GRID_N-d.h+1),tc=Math.min(Math.max(1,c),GRID_N-d.w+1);
  const old=pm[dragKey];
  // which other widgets overlap the target footprint?
  const g=occGrid(u,dragKey),hit=new Set();
  for(let rr=tr;rr<tr+d.h;rr++)for(let cc=tc;cc<tc+d.w;cc++)if(g[rr][cc])hit.add(g[rr][cc]);
  if(hit.size===0){ pm[dragKey]={r:tr,c:tc}; dragKey=null; render(); return; }   // drop into empty space
  if(hit.size===1 && old){ // swap with the single occupant
    const other=[...hit][0],od=dimOf(other),op=pm[other];
    // tentative: dragged -> other's spot; other -> dragged's old spot
    const g2=Array.from({length:GRID_N+1},()=>Array(GRID_N+1).fill(null));
    const place=(k,r0,c0,dd)=>{for(let rr=r0;rr<r0+dd.h;rr++)for(let cc=c0;cc<c0+dd.w;cc++){if(rr<1||cc<1||rr>GRID_N||cc>GRID_N||g2[rr][cc])return false;g2[rr][cc]=k;}return true;};
    // place every other widget except dragged & other, then try the swap
    let ok=true;
    userWidgets(u).forEach(k=>{if(k===dragKey||k===other)return;const pp=pm[k];if(pp&&ok)ok=place(k,pp.r,pp.c,dimOf(k));});
    if(ok && place(dragKey,op.r,op.c,d) && place(other,old.r,old.c,od)){
      pm[dragKey]={r:op.r,c:op.c}; pm[other]={r:old.r,c:old.c}; dragKey=null; render(); return;
    }
  }
  toast('Doesn\'t fit there'); cleanupDrag();
}
function wDragEnd(){cleanupDrag();}
function cleanupDrag(){dragKey=null;
  document.querySelectorAll('.widget-grid.dragging').forEach(g=>g.classList.remove('dragging'));
  document.querySelectorAll('.widget.drag-src').forEach(w=>w.classList.remove('drag-src'));}
function widgetBody(k){
  const u=currentUser;
  if(k==='clock'){
    const s=openShift(u.id);
    const mainBtn=s?`<button class="btn btn-primary btn-sm w-clockbtn" onclick="clockOut()">Clock out</button>`
                   :`<button class="btn btn-primary btn-sm w-clockbtn" onclick="clockIn()">Clock in</button>`;
    return `<div class="w-time" id="wClock">${s?fmtWatch(netMs(s)):'00:00:00'}</div>
      <div class="w-sub">${s?'Clocked in '+fmtTime(s.clockIn):'Not clocked in'}</div>
      <div style="text-align:center">${mainBtn}</div>`;
  }
  if(k==='break'){
    const s=openShift(u.id),rem=breakRemaining();
    if(!s) return `<div class="w-brk"><div class="w-sub" style="margin:0">Clock in first.</div></div>`;
    if(breakActive){
      const left=breakEndsAt?breakEndsAt-Date.now():0;

    }

    return `<div class="w-brk"><button class="btn btn-primary btn-sm" onclick="startBreak()">${label}</button></div>`;
  }
  if(k==='time'){
    const d=new Date();
    return `<div class="w-time" id="wNow">${d.toLocaleTimeString()}</div>
      <div class="w-sub">${d.toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric'})}</div>`;
  }
  if(k==='priorities'){
    const list=priorities.filter(p=>!p.done).slice(0,5);
    if(!list.length)return '<div class="w-empty">Nothing outstanding.</div>';
    const todayK=dateKey(now);
    return list.map(p=>{
      const meta=p.due?`<span class="ml" style="margin-left:auto;color:${p.due<todayK?'#A81E27':'var(--muted)'}">${p.due<todayK?'Overdue':fmtDayKey(p.due)}</span>`:'';
      const name=p.link?`<a class="w-sheet" href="${esc(p.link)}" target="_blank" rel="noopener noreferrer">${sheetIcon()}<span>${esc(p.title)}</span></a>`:`<span>${esc(p.title)}</span>`;
      return `<div class="w-line">${name}${meta}</div>`;
    }).join('');
  }
  if(k==='calendar'){
    const d=new Date(now),y=d.getFullYear(),m=d.getMonth()+1;
    const lead=new Date(y,m-1,1).getDay(),total=new Date(y,m,0).getDate(),todayK=dateKey(now);
    let cells='';
    for(let i=0;i<lead;i++)cells+='<span class="mc-cell mc-pad"></span>';
    for(let dd=1;dd<=total;dd++){
      const key=y+'-'+pad(m)+'-'+pad(dd);
      const has=offFor(key).length||priFor(key).length;
      cells+=`<span class="mc-cell ${key===todayK?'mc-today':''}">${dd}${has?'<i class="mc-dot"></i>':''}</span>`;
    }

    return `<div class="mc"><div class="mc-h">${label}</div>
      <div class="mc-grid">${['S','M','T','W','T','F','S'].map(x=>`<span class="mc-dow">${x}</span>`).join('')}${cells}</div></div>`;
  }
  if(k==='notifications'){
    const myMsgs=messages.filter(m=>m.to===u.id&&!m.read);
    const msgLines=myMsgs.map(m=>`<div class="w-line"><span><b>${esc(m.from)}</b> ${esc(m.text)}</span></div>`).join('');
    let rest='';
    if(canManage(u)){
      const noticeLines=notices.map(n=>`<div class="w-line"><span>${esc(nameOf(n.empId).split(' ')[0])} clocked in off-schedule</span></div>`).join('');
      rest=noticeLines;
    }

    const body=msgLines+rest;
    if(body)return body;

  }
  if(k==='reminders'){
    const arr=userStore(u).reminders;

  }

    return rows+`<div class="w-add"><input type="text" id="wTodo" placeholder="Add a to-do" onkeydown="if(event.key==='Enter')addTodo()"><button class="btn btn-dark btn-sm" onclick="addTodo()">Add</button></div>`;

}
function addWidget(k){const arr=userWidgets(currentUser);

    arr.push(k);posMap(currentUser)[k]=spot;
  }

async function addItem(empId,dk){
  const el=document.getElementById('tx_'+dk);if(!el)return;const v=el.value.trim();if(!v)return;

/* ================= CALENDAR ================= */
function shiftMonth(n){
  const [y,m]=calCursor.split('-').map(Number);
  const d=new Date(y,m-1+n,1);calCursor=d.getFullYear()+'-'+pad(d.getMonth()+1);render();
}
function thisMonth(){const d=new Date(now);calCursor=d.getFullYear()+'-'+pad(d.getMonth()+1);render();}
function offFor(k,scopeId){
  return timeOff.filter(t=>{
    if(t.status!=='approved')return false;                 // only approved on the calendar
    if(!(k>=t.start&&k<=t.end))return false;
    if(canManage(currentUser))return true;                 // managers see everyone
    return t.empId===currentUser.id||isManagerId(t.empId); // employees: own + managers'
  });
}
function priFor(k){return priorities.filter(p=>p.due===k);}

function calendarGrid(scopeId){
  const [y,m]=calCursor.split('-').map(Number);

    cells+=`<${clickable?'button':'div'} class="cell ${k===todayK?'today':''}" ${clickable?`onclick="openDayAdd('${k}')"`:''}>
      <span class="dnum">${d}</span>${offs}${pris}</${clickable?'button':'div'}>`;
  }
  const label=new Date(y,m-1,1).toLocaleDateString(undefined,{month:'long',year:'numeric'});
  return `<div class="cal-head">
      <span class="cal-title">${label}</span>

      <button class="btn-cell" onclick="thisMonth()">Today</button>
      <button class="btn-cell" onclick="shiftMonth(1)">&rsaquo;</button>

    </div>
    <div class="cal-grid">${['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(d=>`<div class="dow">${d}</div>`).join('')}${cells}</div>`;
}
function sheetIcon(){return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M4 9h16M4 15h16M10 3v18"/></svg>`;}
function priorityList(editable){
  const list=priorities;

  const rows=list.length?list.map((p,i)=>{

function priContrast(color){
  if(!color)return '#fff';
  let l=null;
  const h=color.match(/hsl\(\s*[\d.]+\s*,\s*[\d.]+%\s*,\s*([\d.]+)%/i);
  if(h)l=parseFloat(h[1]);
  else if(color[0]==='#'){let c=color.slice(1);if(c.length===3)c=c.split('').map(x=>x+x).join('');
    const r=parseInt(c.slice(0,2),16),g=parseInt(c.slice(2,4),16),b=parseInt(c.slice(4,6),16);
    l=(0.2126*r+0.7152*g+0.0722*b)/2.55;}
  if(l==null)return '#fff';
  return l>=62?'#111':'#fff';
}

function priWheelPick(ev){
  const w=document.getElementById('priWheel'), r=w.getBoundingClientRect();
  const cx=r.width/2, cy=r.height/2, dx=ev.clientX-r.left-cx, dy=ev.clientY-r.top-cy;
  const R=Math.min(cx,cy), dist=Math.min(Math.sqrt(dx*dx+dy*dy)/R,1);
  let hue=Math.atan2(dx,-dy)*180/Math.PI; if(hue<0)hue+=360;
  const sat=Math.round(dist*100), light=Math.round(100-dist*50);
  priPickColor=`hsl(${Math.round(hue)},${sat}%,${light}%)`;
  const prev=document.getElementById('priPrev');
  if(prev){prev.style.background=priPickColor;prev.style.borderColor=priPickColor;prev.style.color=priContrast(priPickColor);}
}

function scheduleTab(empId,editable){
  const s=schedules[empId]||blankWeek();
  const rows=DOW.map(k=>{
    const day=Array.isArray(s[k])?s[k]:[];
    let inner;
    if(editable){
      inner=day.map((sl,i)=>`<span class="slot"><input class="range-in" id="rg_${k}_${i}" value="${fmtHM(sl.start)} – ${fmtHM(sl.end)}"
          onblur="setSlot('${empId}','${k}',${i},this)" onkeydown="if(event.key==='Enter')this.blur()">
          <button class="slot-x" tabindex="-1" onmousedown="event.preventDefault()" onclick="removeSlot('${empId}','${k}',${i})" title="Remove block">&times;</button></span>`).join('')
        +`<button class="slot-add" onclick="addSlot('${empId}','${k}')" aria-label="Add a time block" title="Add a time block">+</button>`;
    }else{
      inner=day.length
        ? day.map(sl=>`<span class="slot ro"><span class="mono">${fmtHM(sl.start)} – ${fmtHM(sl.end)}</span></span>`).join('')
        : `<span class="sched-off">Day off</span>`;
    }
    return `<div class="sched-row ${day.length?'':'off'}"><span class="sched-day">${DOW_LABEL[k]}</span>
      <span class="slot-wrap">${inner}</span>
      <span class="sched-hrs">${day.length?fmtHrs(dayHours(day)):'—'}</span></div>`;
  }).join('');
  const total=weekHours(empId);
  return pageHead(editable?'My schedule':'Schedule',editable?'visible to your manager':nameOf(empId))
    +`<div class="sec first">${editable?'<p class="lede">Tap the purple + on a day to add a time block, then type the hours — "9-5", "9am-5:30pm", and "09:00-17:00" all work. Add as many blocks a day as you need; tap a block and hit the × to remove it.</p>':''}
      ${rows}
      <div class="totals"><div class="stat"><div class="k">Scheduled per week</div><div class="v">${fmtHrs(total)}</div></div>
        <div class="stat"><div class="k">Worked so far this week</div><div class="v">${fmtDur(workedThisWeek(empId))}</div></div>
        <div class="stat"><div class="k">Days working</div><div class="v">${DOW.filter(k=>Array.isArray(s[k])&&s[k].length).length}</div></div></div></div>`;
}
function ensureWeek(empId){if(!schedules[empId])schedules[empId]=blankWeek();
  DOW.forEach(k=>{if(!Array.isArray(schedules[empId][k]))schedules[empId][k]=[];});return schedules[empId];}
function addSlot(empId,day){const w=ensureWeek(empId);w[day].push({start:'09:00',end:'17:00'});render();saveSchedule(empId);
  setTimeout(()=>{const el=document.getElementById('rg_'+day+'_'+(w[day].length-1));if(el){el.focus();el.select();}},0);}
function removeSlot(empId,day,i){const w=ensureWeek(empId);w[day].splice(i,1);render();saveSchedule(empId);}
function setSlot(empId,day,i,el){
  const r=parseRange(el.value);
  if(!r){el.classList.add('bad');toast('Try a range like 9-5 or 9:00am-5:30pm');return;}
  el.classList.remove('bad');
  const w=ensureWeek(empId);
  if(!w[day][i]){render();return;}
  w[day][i].start=r.start;w[day][i].end=r.end;
  const clash=w[day].some((sl,j)=>j!==i&&slotsOverlap(sl,w[day][i]));
  render();saveSchedule(empId);
  if(clash)toast('Heads up — this block overlaps another one. Check the AM/PM.');
}

function payTab(){
  const team=hourlyStaff();
  const rateRows=team.map(e=>`<tr><td>${e.name}</td>

  const todayK=dateKey(now);

  });
  const periods=ordered.map(p=>{
    const current=todayK>=p.start&&todayK<=p.end;
    const rows=team.map(e=>{const ms=periodMs(e.id,p),amt=(ms/HR)*e.rate;

  }).join('');
  return pageHead('Payroll',payPeriods.length+' periods')
    +`<div class="sec first"><div class="sec-head"><h2>Pay rates</h2></div><table><tbody>${rateRows}</tbody></table></div>
      <div class="sec"><div class="sec-head"><h2>Schedule periods</h2></div>

function tsToInput(ts){const d=new Date(ts);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())+'T'+pad(d.getHours())+':'+pad(d.getMinutes());}
function inputToTs(v){return v?new Date(v).getTime():null;}
function openAdd(empId){
  const e=employees.find(x=>x.id===empId),base=tsToInput(now);
  document.getElementById('modalMount').innerHTML=`<div class="overlay" onclick="if(event.target===this)closeModal()"><div class="modal">
    <h3>Add a missing day</h3><p class="sub">${e.name}</p>
    <div class="field"><label>Clock in</label><input type="datetime-local" id="edIn" value="${base}"></div>
    <div class="field"><label>Clock out</label><input type="datetime-local" id="edOut" value="${base}"></div>
    <div class="field"><label>Reason <span class="req">required</span></label><input type="text" id="edReason" placeholder="Employee forgot to clock in"></div>
    <div class="err" id="edErr"></div>
    <div class="modal-actions"><button class="btn btn-line btn-sm" onclick="closeModal()">Cancel</button>
    <button class="btn btn-primary btn-sm" onclick="saveAdd('${empId}')">Add day</button></div></div></div>`;
}
function closeModal(){document.getElementById('modalMount').innerHTML='';}
function toast(m){const t=document.getElementById('toastMount');t.innerHTML=`<div class="toast">${m}</div>`;setTimeout(()=>{t.innerHTML='';},2400);}
async function saveAdd(empId){
  const err=document.getElementById('edErr'),reason=document.getElementById('edReason').value.trim();
  if(!reason){err.textContent='Add a reason — it goes in the change log.';return;}
  const nIn=inputToTs(document.getElementById('edIn').value),nOut=inputToTs(document.getElementById('edOut').value);
  if(!nIn){err.textContent='Clock-in time is required.';return;}
  if(!nOut&&dateKey(nIn)!==dateKey(now)){err.textContent='Clock-out is required for a past day.';return;}
  if(nOut&&nOut<nIn){err.textContent='Clock-out must be after clock-in.';return;}
  if(live()){
    const {data,error}=await sb.from('shifts').insert({user_id:empId,clock_in:new Date(nIn).toISOString(),clock_out:nOut?new Date(nOut).toISOString():null,edited:true}).select().single();
    if(error){err.textContent='Could not save: '+error.message;return;}
    upsertShift(shiftFromRow(data));
  }else{
    shifts.push({id:nid(),empId,clockIn:nIn,clockOut:nOut,edited:true});
  }
  logAudit({ts:Date.now(),manager:currentUser.name,emp:nameOf(empId),field:'Day added',old:'—',new:fmtTime(nIn)+' – '+(nOut?fmtTime(nOut):'—'),reason});
  closeModal();render();toast('Day added');
}
function openEditDay(shiftId){
  const s=shifts.find(x=>x.id===shiftId);if(!s)return;
  const e=employees.find(x=>x.id===s.empId);
  const inToday=dateKey(s.clockIn)===dateKey(now);
  const outHint=inToday?'<span class="opt">leave blank if still clocked in</span>':'<span class="opt">required for a past day</span>';
  document.getElementById('modalMount').innerHTML=`<div class="overlay" onclick="if(event.target===this)closeModal()"><div class="modal">
    <h3>Edit day</h3><p class="sub">${e.name} · ${fmtDay(s.clockIn)}</p>
    <div class="field"><label>Clock in</label><input type="datetime-local" id="edIn" value="${tsToInput(s.clockIn)}"></div>

    <div class="modal-actions edit-actions"><button class="del-shift" title="Delete this time record" onclick="deleteShift('${shiftId}')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/></svg></button>
    <span class="ea-right"><button class="btn btn-line btn-sm" onclick="closeModal()">Cancel</button>
    <button class="btn btn-primary btn-sm" onclick="saveEditDay('${shiftId}')">Save changes</button></span></div></div></div>`;
